<script id="jq-dynamic-pwa-manifest">
(function(){
  "use strict";
  // 真好點單檔 PWA：Manifest 由 Blob 動態生成，圖示使用 GitHub Pages 根目錄的 ico.png。
  // GitHub Pages 正式網址位於 /JinOrder/，因此所有安裝路徑都轉成絕對網址。
  let appBaseUrl;
  try {
    const isVirtual = window.location.href.startsWith('blob:') || window.location.href.startsWith('data:');
    appBaseUrl = isVirtual
      ? new URL('./', document.referrer || (window.location.origin + '/JinOrder/')).href
      : new URL('./', window.location.href).href;
  } catch (e) {
    appBaseUrl = 'https://tcuteblue.github.io/JinOrder/';
  }

  let iconUrl;
  try {
    const isVirtual = window.location.href.startsWith('blob:') || window.location.href.startsWith('data:');
    iconUrl = new URL('ico.png', isVirtual ? appBaseUrl : window.location.href).href;
  } catch (e) {
    iconUrl = new URL('ico.png', appBaseUrl).href;
  }

  const startUrl = new URL('./?source=pwa', appBaseUrl).href;
  const svgFallback = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ff9b24'/%3E%3Ccircle cx='50' cy='43' r='29' fill='%23ffd928' stroke='%231b1b1b' stroke-width='5'/%3E%3Ccircle cx='40' cy='38' r='3.5'/%3E%3Ccircle cx='60' cy='38' r='3.5'/%3E%3Cpath d='M37 52 Q50 66 63 52' fill='none' stroke='%231b1b1b' stroke-width='5' stroke-linecap='round'/%3E%3Ctext x='50' y='91' font-size='15' font-weight='900' text-anchor='middle' fill='white' stroke='%23d94b18' stroke-width='1.5' paint-order='stroke'%3E真%3C/text%3E%3C/svg%3E";

  const manifest = {
    id: appBaseUrl,
    name: '真好點問卷系統',
    short_name: '真好點',
    description: '輕鬆設計問卷，快速收集與整理回答。',
    lang: 'zh-TW',
    start_url: startUrl,
    scope: appBaseUrl,
    display: 'standalone',
    display_override: ['standalone', 'minimal-ui'],
    orientation: 'portrait',
    background_color: '#fff8e7',
    theme_color: '#ffc928',
    prefer_related_applications: false,
    icons: [
      // 沿用已實際成功安裝的信用卡夾範例：同一個正式 PNG 提供 192 / 512 尺寸宣告。
      { src: iconUrl, sizes: '192x192 512x512', type: 'image/png', purpose: 'any maskable' },
      { src: svgFallback, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' }
    ]
  };

  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const manifestUrl = URL.createObjectURL(manifestBlob);
  const manifestLink = document.createElement('link');
  manifestLink.rel = 'manifest';
  manifestLink.href = manifestUrl;
  document.head.appendChild(manifestLink);

  // 瀏覽器分頁圖示及 iOS 主畫面圖示，均讀取根目錄 ico.png。
  const favicon = document.createElement('link');
  favicon.rel = 'icon';
  favicon.type = 'image/png';
  favicon.href = iconUrl;
  document.head.appendChild(favicon);

  const appleIcon = document.createElement('link');
  appleIcon.rel = 'apple-touch-icon';
  appleIcon.href = iconUrl;
  document.head.appendChild(appleIcon);

  window.__JQ_LOGO_URL__ = iconUrl;
  window.__JQ_MANIFEST_URL__ = manifestUrl;
  window.__JQ_PWA_ICON_URL__ = iconUrl;
})();
</script>

<script>
'use strict';
/* 部署完成後，將 GAS /exec 網址貼在下方，然後更新 GitHub Pages 的 index.html。 */
const GAS_EXEC_URL = 'https://script.google.com/macros/s/AKfycbxw-JED9O-aW_x39VIOZJYeTb4Ou57eito80nsnYcqR3YM4FMQH49XMa3lbTjALbg9klA/exec';
const CHANNEL = 'JINORDER_SURVEY_RPC_V1';
const PROFILE_STORAGE_KEY = 'jinorder_profile_v1';
const PUBLIC_CACHE_KEY = 'jinorder_public_data_v1';
const ADMIN_SESSION_STORAGE_KEY = 'jinorder_admin_session_v1';
function readRememberedAdminToken(){
  try{return String(localStorage.getItem(ADMIN_SESSION_STORAGE_KEY)||'').trim()}catch(e){return ''}
}
function saveRememberedAdminToken(token){
  try{if(token)localStorage.setItem(ADMIN_SESSION_STORAGE_KEY,String(token));else localStorage.removeItem(ADMIN_SESSION_STORAGE_KEY)}catch(e){/* 儲存空間停用時仍可正常登入本次工作階段。 */}
}
function readCachedPublicData(){
  try{
    const raw=localStorage.getItem(PUBLIC_CACHE_KEY);
    if(!raw)return null;
    const data=JSON.parse(raw);
    if(!data||!Array.isArray(data.surveys))return null;
    // 首頁快取僅包含公開問卷清單，不包含任何填寫者資料。
    return {appName:String(data.appName||'真好點問卷系統'),surveys:data.surveys.filter(s=>s&&s.id&&s.title),cachedAt:String(data.cachedAt||'')};
  }catch(e){return null}
}
function writeCachedPublicData(data){
  try{
    const safeData={appName:String(data.appName||'真好點問卷系統'),surveys:Array.isArray(data.surveys)?data.surveys:[],cachedAt:new Date().toISOString()};
    localStorage.setItem(PUBLIC_CACHE_KEY,JSON.stringify(safeData));
  }catch(e){/* 本機空間不足或瀏覽器停用儲存時，不影響雲端使用。 */}
}
const initialPublicCache=readCachedPublicData();
function readRememberedIdentity(){
  try{
    const saved=JSON.parse(localStorage.getItem(PROFILE_STORAGE_KEY)||'null');
    if(!saved||typeof saved!=='object')return null;
    return {name:String(saved.name||''),phone:String(saved.phone||'')};
  }catch(e){return null}
}
function rememberIdentity(profile){
  const previous=state.identity||{name:'',phone:''};
  const next={
    name:profile&&profile.name!==undefined?String(profile.name):String(previous.name||''),
    phone:profile&&profile.phone!==undefined?String(profile.phone):String(previous.phone||'')
  };
  state.identity=next;
  try{
    if(next.name||next.phone)localStorage.setItem(PROFILE_STORAGE_KEY,JSON.stringify(next));
    else localStorage.removeItem(PROFILE_STORAGE_KEY);
  }catch(e){/* 無痕模式或瀏覽器停用儲存空間時，仍可正常填寫問卷。 */}
  return next;
}
const rememberedAdminToken=readRememberedAdminToken();
const state = {
  publicData:initialPublicCache, surveys:initialPublicCache?initialPublicCache.surveys:[], hasLoadedPublic:false, cloudUnavailable:false, cloudMessage:'', admin:!!rememberedAdminToken, token:rememberedAdminToken, adminTab:'surveys',
  activeSurvey:null, editingResponse:null, identity:readRememberedIdentity(), lookupSurveyId:'',
  adminOverview:null, adminSurvey:null, adminResponses:[], editSurveyId:'',
  logoClicks:0, logoTimer:null, bridgeReady:false, bridgePort:null, bridgePending:new Map(), bridgeNonce:'', requestNo:0
};
let deferredInstallPrompt = null;

const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(message){const el=$('toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toast._timer);toast._timer=setTimeout(()=>el.classList.add('hidden'),3200)}
function setBusy(on){document.body.classList.toggle('loading',!!on)}
function showModal(html){if(window.__JQ_APP_NAV__&&window.__JQ_APP_NAV__.initialized&&!window.__JQ_APP_NAV__.modalActive){const nav=window.__JQ_APP_NAV__;if(nav.reuseModalSlot){history.replaceState({jqAppModal:true},'',location.href);nav.reuseModalSlot=false;}else history.pushState({jqAppModal:true},'',location.href);nav.modalActive=true;} $('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(keepHistoryForNextView=false){$('modalRoot').innerHTML='';const nav=window.__JQ_APP_NAV__;if(nav&&nav.modalActive){nav.modalActive=false;if(keepHistoryForNextView){nav.reuseModalSlot=true;}else{nav.closingModal=true;history.back();}}}
function setStatus(text,ok=true){
  const el=$('syncStatus');if(!el)return;
  el.textContent=text||'';
  el.classList.toggle('error',!ok);
  el.classList.toggle('syncing',!!text&&/(同步|確認|連線|讀取)/.test(text)&&ok);
  el.onclick=ok?null:retryCloudConnection;
  el.style.cursor=ok?'default':'pointer';
  el.title=ok?'':'點擊重新連線';
}

function makeBridgeNonce(){
  try{return Array.from(crypto.getRandomValues(new Uint8Array(18))).map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){return 'jq'+Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)}
}
function isTrustedGasOrigin(origin){
  try{
    const host=new URL(origin).hostname.toLowerCase();
    // Apps Script HTML Service 的實際 sandbox host 常是 n-xxxx-0lu-script.googleusercontent.com，
    // 注意它前面是連字號，不是 .script.googleusercontent.com。
    return host==='script.google.com'||
      host==='script.googleusercontent.com'||
      host.endsWith('.script.googleusercontent.com')||
      /^[a-z0-9-]+-script\.googleusercontent\.com$/.test(host);
  }catch(e){return false}
}
function setupBridge(){
  if(!GAS_EXEC_URL || GAS_EXEC_URL.indexOf('https://script.google.com/macros/s/')!==0){
    setStatus('待設定 API',false);renderBridgeSetup();return;
  }
  const frame=$('gasBridge');
  const nonce=makeBridgeNonce();
  state.bridgeNonce=nonce;

  // 收到 GAS 內層 sandbox frame 傳來的 MessagePort 後，後續 API 全走該 Port。
  // 這可避免 GitHub 只把訊息送到 GAS 外層 iframe、內層 userCodeAppPanel 收不到的巢狀 iframe 問題。
  window.addEventListener('message',event=>{
    if(!isTrustedGasOrigin(event.origin)||!event.data||event.data.channel!==CHANNEL||event.data.nonce!==nonce)return;
    if(event.data.type==='ready'){
      const port=event.ports&&event.ports[0];
      if(!port){showCloudUnavailable('GAS 已載入，但沒有提供安全訊息通道。請確認 GAS 部署版本及存取權限。');return;}
      if(state.bridgePort){try{state.bridgePort.close()}catch(e){}}
      state.bridgePort=port;
      state.bridgePort.onmessage=handleBridgePortMessage;
      if(state.bridgePort.start)state.bridgePort.start();
      if(state.bridgeReady)return;
      state.bridgeReady=true;
      setStatus('雲端通道已就緒，正在背景同步…');
      if(state.admin&&state.token){loadAdmin({preserveTab:true,silent:true});}
      else{loadPublic();}
      return;
    }
    if(event.data.type==='bridge_error'){
      showCloudUnavailable(event.data.error||'GAS 橋接頁未能啟動。請確認網路及 GAS 部署設定。');
    }
  });
  frame.addEventListener('load',()=>{
    if(!state.bridgeReady)setStatus('GAS 頁面已載入，正在建立安全通道…');
  });
  frame.addEventListener('error',()=>{
    showCloudUnavailable('瀏覽器無法載入 GAS 橋接頁。請確認網路、部署權限及 GAS 網頁應用程式網址。');
  });
  const bridgeUrl=new URL(GAS_EXEC_URL);
  bridgeUrl.searchParams.set('bridge','1');
  bridgeUrl.searchParams.set('nonce',nonce);
  frame.src=bridgeUrl.toString();

  setTimeout(()=>{
    if(!state.bridgeReady){
      showCloudUnavailable('雲端安全通道尚未建立（25 秒未收到回應）。目前仍可查看本機保存的問卷清單，請稍後重新連線。');
    }
  },25000);
}
function handleBridgePortMessage(event){
  const data=event&&event.data;
  if(!data||data.channel!==CHANNEL||data.nonce!==state.bridgeNonce)return;
  if(data.type==='response'){
    const pending=state.bridgePending.get(data.id);if(!pending)return;
    clearTimeout(pending.timer);state.bridgePending.delete(data.id);
    if(data.ok)pending.resolve(data.result);else pending.reject(new Error(data.error||'雲端服務發生錯誤'));
  }
}
function api(method,...args){
  return new Promise((resolve,reject)=>{
    if(!state.bridgeReady||!state.bridgePort){reject(new Error('雲端連線尚未就緒，請稍候或重新整理。'));return;}
    const id='r'+(++state.requestNo)+'_'+Date.now();
    const timer=setTimeout(()=>{state.bridgePending.delete(id);reject(new Error('雲端回應逾時，請稍後再試。'));},45000);
    state.bridgePending.set(id,{resolve,reject,timer});
    try{
      state.bridgePort.postMessage({channel:CHANNEL,nonce:state.bridgeNonce,type:'request',id,method,args});
    }catch(err){
      clearTimeout(timer);state.bridgePending.delete(id);reject(err);
    }
  });
}

function isRunningStandalone(){
  const modes=['standalone','minimal-ui','fullscreen'];
  return modes.some(mode=>window.matchMedia&&window.matchMedia(`(display-mode: ${mode})`).matches)
    || window.navigator.standalone===true;
}
function hideInstallButton(){
  const strip=$('installStrip');
  const btn=$('installBtn');
  if(strip)strip.hidden=true;
  if(btn)btn.hidden=true;
}
function showInstallButton(){
  const strip=$('installStrip');
  const btn=$('installBtn');
  if(strip)strip.hidden=false;
  if(btn)btn.hidden=false;
}
async function installApp(){
  if(isRunningStandalone()){
    hideInstallButton();
    toast('真好點已經安裝在這台裝置上了。');
    return;
  }
  if(deferredInstallPrompt){
    const promptEvent=deferredInstallPrompt;
    deferredInstallPrompt=null;
    try{
      await promptEvent.prompt();
      const choice=await promptEvent.userChoice;
      if(choice&&choice.outcome==='accepted'){
        toast('已接受安裝，請完成系統安裝步驟。');
      }else{
        const btn=$('installBtn');
        if(btn)btn.textContent='📲 安裝為 APP';
      }
    }catch(err){
      console.warn('PWA 安裝視窗未能開啟：',err);
      toast('目前無法開啟安裝視窗，請稍後再試。');
    }
    return;
  }
  showModal(`<h3>真好點安裝為 APP</h3><p>Chrome 目前尚未提供真正的應用程式安裝提示。</p><div class="notice">請確認使用 Android Chrome，並保持網頁開啟一段時間、至少點擊操作一次。若右上角選單出現「安裝應用程式」，可使用該選項。<br><br><strong>請不要選擇「新增至主畫面」來代替安裝</strong>，那可能只會建立帶有 Chrome 標誌的網頁捷徑。</div><p class="tiny muted">當瀏覽器確認符合 PWA 安裝條件後，這個按鈕會直接開啟系統安裝視窗。</p><button class="btn btn-primary btn-block" onclick="closeModal()">知道了</button>`);
}
function initPwaInstall(){
  const btn=$('installBtn');
  if(!btn)return;
  btn.textContent='📲 安裝為 APP';
  btn.addEventListener('click',installApp);

  // CSS 會先隱藏已安裝 App 的按鈕；此處再補 Safari/iOS 的 standalone 判斷。
  if(isRunningStandalone()){
    hideInstallButton();
    return;
  }

  window.addEventListener('beforeinstallprompt',event=>{
    event.preventDefault();
    deferredInstallPrompt=event;
    btn.textContent='📲 立即安裝 APP';
    showInstallButton();
  });

  window.addEventListener('appinstalled',()=>{
    deferredInstallPrompt=null;
    hideInstallButton();
    toast('真好點已成功安裝！');
  });

  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&isRunningStandalone())hideInstallButton();
  });
}

function retryCloudConnection(){
  if(state.bridgeReady&&state.bridgePort){loadPublic();return;}
  // 安全通道尚未建立時，重新載入頁面會重新建立 nonce 與 MessageChannel。
  window.location.reload();
}
function showCloudUnavailable(message){
  state.cloudUnavailable=true;
  state.cloudMessage=String(message||'雲端資料暫時無法讀取。');
  setStatus(state.publicData?'暫時無法同步，先顯示上次資料':'雲端連線暫時中斷',false);
  // 有快取時絕不以錯誤頁蓋掉已顯示的首頁；沒有快取時也保留正常首頁框架。
  if(!state.publicData&&!state.admin)renderHome();
}
function renderStartupScreen(){
  // 啟動時先同步讀取本機快取；若先前未退出管理，先保留管理模式畫面。
  if(state.admin){
    $('main').innerHTML=`<section class="hero"><h2>問卷管理中心</h2><p>已保留這台裝置的管理者登入狀態，正在背景確認雲端權限。</p></section><div class="card"><div class="notice">正在確認管理者登入狀態，請稍候；不需要重新輸入密碼。</div><div class="btn-row" style="margin-top:12px"><button class="btn btn-secondary" onclick="loadAdmin({preserveTab:true})">重新連線</button><button class="btn btn-plain" onclick="exitAdmin()">退出管理</button></div></div>`;
  }else{renderHome();}
  setStatus(state.admin?'正在確認管理者登入狀態…':(state.publicData?'已載入本機問卷清單，正在背景確認雲端…':'正在背景連接雲端並讀取問卷…'));
}
async function loadPublic(){
  // 首頁的雲端確認不鎖定畫面，也不降低頁面互動性。
  state.cloudUnavailable=false;state.cloudMessage='';
  setStatus(state.publicData?'正在背景同步雲端資料…':'正在背景讀取雲端問卷…');
  try{
    const data=await api('getPublicData');
    if(!data||!Array.isArray(data.surveys))throw new Error('雲端回傳的問卷清單格式不正確。');
    state.publicData=data;state.surveys=data.surveys;state.hasLoadedPublic=true;
    state.cloudUnavailable=false;state.cloudMessage='';
    writeCachedPublicData(data);
    setStatus('雲端資料已同步');
    if(!state.admin&&!$('questionForm'))renderHome();
  }catch(err){
    showCloudUnavailable(err.message);
  }
}

  $('main').innerHTML=`${cloudNotice}<section class="hero"><h2>每一份回答，都值得好好收集！</h2><p>選擇下方開放中的問卷開始填寫。不同活動、團購或調查，可以同時進行。</p></section>
    <section class="card"><div class="section-title"><span class="emoji">📝</span><h3>目前開放中的問卷</h3><span class="badge">${open.length} 份</span></div>
      ${open.length?`<div class="survey-grid">${open.map(s=>`<div class="survey-card"><div class="survey-head"><div><h3>${esc(s.title)}</h3><div class="tiny muted">${esc(s.description||'歡迎填寫本問卷')}</div></div><span class="badge">開放中</span></div><div class="survey-meta">建立時間：${esc(dateText(s.createdAt))}</div><div class="btn-row"><button class="btn btn-primary" onclick="openSurvey('${esc(s.id)}')">開始填寫</button><button class="btn btn-plain" onclick="openLookup('${esc(s.id)}')">查詢回覆</button></div></div>`).join('')}</div>`:`<div class="notice"><strong>目前沒有問卷進行中……</strong><br>${esc(emptyMessage)}</div>`}

    </section>`;

async function openSurvey(id,existing,options={}){
  try{setBusy(true);const result=await api('getPublicSurvey',id);state.activeSurvey=result.survey;state.editingResponse=existing||null;if(!options.skipNavigation)pushAppView({type:'survey',survey:result.survey,existing:existing||null});renderSurveyForm(existing?existing.answers:null);}
  catch(err){toast(err.message)}finally{setBusy(false)}
}
function renderQuestion(q,answers){

        ${q.allowNote!==false?`<textarea class="textarea item-product-note" data-item-note maxlength="300" placeholder="商品備註（選填，例如不要香菜）">${esc(a.note||'')}</textarea>`:''}
      </div>`;
    }
  }
  else if(q.type==='items'){
    formItemMode='legacy';
    body=`<div class="option-list">${(q.options||[]).map(o=>{const chosen=Array.isArray(answer)?answer.find(x=>x.optionId===o.id):null;return `<div class="option item-option"><input type="checkbox" class="item-check" value="${esc(o.id)}" ${chosen?'checked':''}><div style="flex:1;min-width:0"><div class="option-name">${esc(o.label)} ${Number(o.price||0)?`<span class="price">${money(o.price)}</span>`:''}</div><div class="qty-row"><span class="tiny muted">數量</span><input class="qty item-qty" type="number" min="1" max="${Number(q.maxQty||20)}" value="${chosen?Number(chosen.qty||1):1}"><input class="input note-input item-note" style="flex:1;min-width:110px;min-height:36px;padding:7px 9px" maxlength="300" placeholder="備註（選填）" value="${esc(chosen?chosen.note||'':'')}"></div></div></div>`}).join('')}</div>`;
  }
  const boxItemMode=q.type==='items'?(formItemMode||'product'):'';

function collectAnswersFrom(rootSelector){
  const out={};
  document.querySelectorAll(`${rootSelector} .question-box`).forEach(box=>{
    const id=box.dataset.qid,type=box.dataset.type;
    if(type==='text'||type==='textarea'||type==='date'||type==='number'){const el=box.querySelector('[data-answer]');out[id]=el?el.value:'';}
    else if(type==='rating'){const x=box.querySelector('input:checked');out[id]=x?Number(x.value):'';}
    else if(type==='single'){const x=box.querySelector('input:checked');out[id]=x?x.value:'';}
    else if(type==='multi'){out[id]=Array.from(box.querySelectorAll('input:checked')).map(x=>x.value);}
    else if(type==='dropdown'){const x=box.querySelector('[data-answer]');out[id]=x?x.value:'';}
    else if(type==='items'&&box.dataset.itemMode==='product'){
      const productQty=Math.max(0,Number(box.querySelector('[data-qty-role="product"]')?.value||0));
      const customizations=Array.from(box.querySelectorAll('[data-qty-role="custom"]')).map(el=>({optionId:el.dataset.optionId,qty:Math.max(0,Number(el.value||0))})).filter(x=>x.qty>0);
      const note=box.querySelector('[data-item-note]')?.value.trim()||'';
      out[id]={productQty:productQty,customizations:customizations,note:note};
    }
    else if(type==='items'){
      out[id]=Array.from(box.querySelectorAll('.item-option')).filter(el=>el.querySelector('.item-check').checked).map(el=>({optionId:el.querySelector('.item-check').value,qty:Number(el.querySelector('.item-qty').value)||1,note:el.querySelector('.item-note').value.trim()}));
    }
  });
  return out;
}
function collectAnswers(){return collectAnswersFrom('#questionForm')}
function adjustQty(button,delta,max){
  const control=button.closest('.qty-control');if(!control)return;
  const input=control.querySelector('.qty-value');if(!input||input.disabled)return;
  const next=Math.max(0,Math.min(Number(max||99),Math.floor(Number(input.value||0))+delta));
  input.value=String(next);
  input.dispatchEvent(new Event('input',{bubbles:true}));
}
function handleQtyInput(input){
  const max=Number(input.max||99);let value=Number(input.value);
  if(!Number.isFinite(value)||value<0)value=0;
  value=Math.min(max,Math.floor(value));input.value=String(value);
  const box=input.closest('.question-box');
  if(box&&input.dataset.qtyRole==='product')syncProductOptionAvailability(box);
  updateLiveTotal();
}
function syncProductOptionAvailability(box){
  if(!box)return;
  const productQty=Number(box.querySelector('[data-qty-role="product"]')?.value||0);
  box.querySelectorAll('[data-qty-role="custom"]').forEach(input=>{
    const control=input.closest('.qty-control');
    const buttons=control?control.querySelectorAll('button'):[];
    if(productQty<=0){input.value='0';input.disabled=true;buttons.forEach(b=>b.disabled=true);}
    else{input.disabled=false;buttons.forEach(b=>b.disabled=false);const max=Number(input.max||5);input.value=String(Math.min(max,Math.max(0,Number(input.value||0))));if(buttons[0])buttons[0].disabled=Number(input.value)<=0;if(buttons[1])buttons[1].disabled=Number(input.value)>=max;}
  });
}
function currentAmount(){
  if(!state.activeSurvey)return 0;
  const answers=collectAnswers();let sum=0;
  state.activeSurvey.questions.forEach(q=>{
    const a=answers[q.id];
    if(q.type==='single'||q.type==='dropdown'){const o=(q.options||[]).find(x=>x.id===a);if(o)sum+=Number(o.price||0);}
    else if(q.type==='multi'&&Array.isArray(a)){a.forEach(id=>{const o=(q.options||[]).find(x=>x.id===id);if(o)sum+=Number(o.price||0);});}
    else if(q.type==='items'&&q.itemMode==='product'&&Array.isArray(a)){a.forEach(x=>{const o=(q.options||[]).find(y=>y.id===x.optionId);if(o)sum+=Number(o.price||0)*Number(x.qty||1);});}
    else if(q.type==='items'&&q.itemMode==='product'&&a&&!Array.isArray(a)){
      sum+=Number(q.basePrice||0)*Number(a.productQty||0);
      (a.customizations||[]).forEach(x=>{const o=(q.options||[]).find(y=>y.id===x.optionId);if(o)sum+=Number(o.price||0)*Number(x.qty||0);});
    }
    else if(q.type==='items'&&Array.isArray(a)){a.forEach(x=>{const o=(q.options||[]).find(y=>y.id===x.optionId);if(o)sum+=Number(o.price||0)*Number(x.qty||1);});}
  });
  return sum;
}
function updateLiveTotal(){const el=$('liveTotal');if(el)el.textContent=money(currentAmount())}


async function submitCurrentSurvey(){
  const profile={name:$('profileName').value.trim(),phone:$('profilePhone').value.trim()};

  const answers=collectAnswers();

  const isEdit=!!state.editingResponse;
  if(!confirm(`${isEdit?'確認儲存修改':'確認送出問卷'}？\n姓名：${profile.name}\n金額：${money(total)}`))return;

  try{

function formatAnswerForUi(q,a){
  if(a===undefined||a===null||a==='')return '';
  if(q.type==='text'||q.type==='textarea'||q.type==='date')return String(a).trim();
  if(q.type==='number')return String(a);
  if(q.type==='single'||q.type==='dropdown'){const o=(q.options||[]).find(x=>x.id===a);return o?o.label+(Number(o.price||0)?'（'+money(o.price)+'）':''):'';}
  if(q.type==='multi')return (Array.isArray(a)?a:[]).map(id=>(q.options||[]).find(x=>x.id===id)).filter(Boolean).map(o=>o.label+(Number(o.price||0)?'（'+money(o.price)+'）':'')).join('、');
  if(q.type==='items'&&Array.isArray(a))return a.map(x=>{const o=(q.options||[]).find(y=>y.id===x.optionId);return (o?o.label:x.optionId)+' × '+x.qty+(o&&Number(o.price||0)?'（'+money(o.price)+'/份）':'')+(x.note?'（'+x.note+'）':'');}).join('；');
  if(q.type==='items'&&(q.itemMode==='product'||q.basePrice!==undefined||(a&&typeof a==='object'&&!Array.isArray(a)))){
    const obj=a&&typeof a==='object'?a:{};const qty=Number(obj.productQty||0);const parts=[];
    if(qty>0){const price=Number(q.basePrice||0);parts.push(`主商品數量：${qty} 份 × ${money(price)} = ${money(qty*price)}`);}
    (Array.isArray(obj.customizations)?obj.customizations:[]).forEach(item=>{const o=(q.options||[]).find(x=>x.id===item.optionId);const n=Number(item.qty||0);if(o&&n>0){const subtotal=Number(o.price||0)*n;parts.push(`${o.label}：${n} 份（${money(o.price||0)}／份，小計 ${money(subtotal)}）`);}});
    if(obj.note)parts.push('備註：'+String(obj.note).trim());
    return parts.join('；');
  }
  if(q.type==='items')return '';
  if(q.type==='rating')return a===''?'':String(a)+' 分';
  return String(a).trim();
}
function renderFilledAnswersHtml(survey,answers){
  const rows=(survey.questions||[]).map(q=>({q:q,text:formatAnswerForUi(q,answers?answers[q.id]:undefined)})).filter(x=>x.text!==''&&x.text!=null);
  if(!rows.length)return '<p class="tiny muted">沒有其他填寫內容。</p>';
  return rows.map(x=>`<div class="answer-line"><b>${esc(x.q.label)}</b><br>${esc(x.text)}</div>`).join('');
}

function productCustomizationSourceHtml(targetId,allQuestions){
  const questions=Array.isArray(allQuestions)?allQuestions:((state.editDraft&&state.editDraft.questions)||[]);
  const sources=questions.filter(q=>q.id!==targetId&&q.type==='items'&&(q.itemMode==='product'||q.basePrice!==undefined));
  if(!sources.length)return '';
  return `<div class="copy-custom-settings"><label>套用其他商品的客製化／加購設定（自行選擇）</label><div class="editor-grid"><select class="select qe-copy-source"><option value="">請選擇來源商品</option>${sources.map(q=>`<option value="${esc(q.id)}">${esc(q.label||'未命名商品')}</option>`).join('')}</select><button class="btn btn-secondary" onclick="copyProductCustomizations('${esc(targetId)}')">套用設定</button></div><p class="tiny muted">只複製客製化名稱、價格及數量上限；不會複製主商品名稱與價格。套用後各商品設定獨立，修改不會互相影響。</p></div>`;
}

function syncProductCustomizationSourceLabels(){
  const boxes=Array.from(document.querySelectorAll('#questionEditors .question-editor'));
  boxes.forEach(box=>{
    const select=box.querySelector('.qe-copy-source');
    if(!select)return;
    Array.from(select.options).forEach(option=>{
      if(!option.value)return;
      const sourceBox=boxes.find(item=>item.dataset.qid===option.value);
      const label=sourceBox?sourceBox.querySelector('.qe-label')?.value.trim():'';
      option.textContent=label||'未命名商品';
    });
  });
}

function copyProductCustomizations(targetId){
  const boxes=Array.from(document.querySelectorAll('#questionEditors .question-editor'));
  const targetBox=boxes.find(box=>box.dataset.qid===targetId);
  const sourceId=targetBox&&targetBox.querySelector('.qe-copy-source')?targetBox.querySelector('.qe-copy-source').value:'';
  if(!sourceId){toast('請先選擇要套用設定的來源商品');return;}
  const draft=readBuilderDraft();
  const target=draft.questions.find(q=>q.id===targetId);
  const source=draft.questions.find(q=>q.id===sourceId);
  if(!target||!source||target.type!=='items'||source.type!=='items'){toast('找不到要複製的商品設定');return;}
  if(target.options.length&&!confirm('套用後會取代目前這個商品已設定的客製化／加購項目，確定繼續？'))return;
  target.options=(source.options||[]).map(option=>({
    id:'o'+Math.random().toString(36).slice(2,10),
    label:String(option.label||''),
    price:Number(option.price||0),
    maxQty:Number(option.maxQty||5)
  }));
  state.editDraft=draft;
  renderBuilder();
  toast('已複製客製化／加購設定；後續修改只會影響目前商品。');
}

function newQuestion(type='text'){
  const q={id:'q'+Math.random().toString(36).slice(2,10),label:'',type:type,required:false,maxQty:20,options:[]};
  if(type==='items'){q.itemMode='product';q.basePrice=0;q.allowNote=true;q.options=[];}
  else if(['single','multi','dropdown'].includes(type))q.options=[{id:'o'+Math.random().toString(36).slice(2,8),label:'選項一',price:0},{id:'o'+Math.random().toString(36).slice(2,8),label:'選項二',price:0}];
  return q;
}

function questionEditorHtml(q,index,allQuestions){
  const typeOptions=[['items','商品題'],['text','簡答題'],['textarea','段落文字'],['single','單選題'],['multi','多選題'],['dropdown','下拉選單'],['date','日期題'],['number','數字題'],['rating','1～5 分評分']];
  const mode=q.type==='items'?'product':'';
  let extra='';
  if(q.type==='items'){
    extra=`<div class="field product-base-price-field"><label>主商品單價（元）</label><input class="input qe-base-price" type="number" min="0" max="10000000" step="any" inputmode="decimal" value="${Number(q.basePrice??0)}" placeholder="請輸入主商品單價"><p class="tiny muted" style="margin:6px 0 0">上方題目名稱就是主商品名稱；主商品金額會依訂購數量計算。</p></div>
      <div class="editor-grid"><div class="field"><label>主商品最多數量</label><input class="input qe-maxqty" type="number" min="1" max="99" value="${Number(q.maxQty||20)}"></div><div class="field"><label>商品備註</label><label class="checkline" style="padding:12px 0"><input class="qe-allow-note" type="checkbox" ${q.allowNote!==false?'checked':''}> 允許填寫備註</label></div></div>
      ${productCustomizationSourceHtml(q.id,allQuestions)}<div class="field"><div class="item-options-title">客製化／加購項目</div><div class="qe-options">${(q.options||[]).map(o=>optionEditorHtml(o,true)).join('')}</div><button class="btn btn-plain btn-block" onclick="addOption('${esc(q.id)}')">＋ 新增客製化／加購項目</button><p class="tiny muted">例如加飯、加肉、加蛋、少冰。各項目可單獨設定價格及最多數量；免費項目可填 0 元。</p></div>`;
  } else if(['single','multi','dropdown'].includes(q.type)){
    extra=`<div class="field"><label>選項設定（價格可填 0）</label><div class="qe-options">${(q.options||[]).map(o=>optionEditorHtml(o,false)).join('')}</div><button class="btn btn-plain btn-block" onclick="addOption('${esc(q.id)}')">＋ 新增選項</button><p class="tiny muted">價格用於需要計價的選項；一般調查保持 0 即可。</p></div>`;
  }
  return `<div class="question-editor" data-qid="${esc(q.id)}" data-index="${index}" data-item-mode="${mode}"><div class="editor-head"><strong>第 ${index+1} 題</strong><button class="mini-btn" style="padding:7px 10px" onclick="removeQuestion('${esc(q.id)}')">刪除</button></div><div class="field"><label>${q.type==='items'?'主商品名稱':'題目名稱'}</label><input class="input qe-label" maxlength="160" value="${esc(q.label)}" oninput="syncProductCustomizationSourceLabels()" placeholder="${q.type==='items'?'例如：香煎雞腿便當':'請輸入題目'}"></div><div class="editor-grid"><div class="field"><label>題目類型</label><select class="select qe-type" onchange="changeQuestionType('${esc(q.id)}',this.value)">${typeOptions.map(x=>`<option value="${x[0]}" ${q.type===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field"><label>填寫規則</label><label class="checkline" style="padding:12px 0"><input class="qe-required" type="checkbox" ${q.required?'checked':''}> 必填</label></div></div>${extra}</div>`;
}
function optionEditorHtml(o,isCustom=false,isProductOption=false){
  if(isCustom)return `<div class="option-editor custom-option-editor" data-option-id="${esc(o.id)}"><input class="qe-option-label" maxlength="120" value="${esc(o.label)}" placeholder="客製化名稱"><input class="qe-option-price" type="number" min="0" step="any" value="${Number(o.price||0)}" placeholder="單價（元）"><input class="qe-option-maxqty" type="number" min="1" max="99" value="${Number(o.maxQty||5)}" placeholder="上限"><button class="mini-btn" onclick="this.parentNode.remove()">×</button></div>`;
  if(isProductOption)return `<div class="option-editor product-option-editor" data-option-id="${esc(o.id)}"><input class="qe-option-label" maxlength="120" value="${esc(o.label)}" placeholder="商品名稱"><input class="qe-option-price" type="number" min="0" step="any" value="${Number(o.price||0)}" placeholder="商品單價（元）"><button class="mini-btn" onclick="this.parentNode.remove()">×</button></div>`;
  return `<div class="option-editor" data-option-id="${esc(o.id)}"><input class="qe-option-label" maxlength="120" value="${esc(o.label)}" placeholder="選項名稱"><input class="qe-option-price" type="number" min="0" step="any" value="${Number(o.price||0)}" placeholder="價格"><button class="mini-btn" onclick="this.parentNode.remove()">×</button></div>`;
}


function readBuilderDraft(){
  const questions=[];
  document.querySelectorAll('#questionEditors .question-editor').forEach(box=>{
    const type=box.querySelector('.qe-type').value;
    const itemMode=box.dataset.itemMode||'product';
    const q={id:box.dataset.qid,label:box.querySelector('.qe-label').value.trim(),type,required:box.querySelector('.qe-required').checked,maxQty:Number(box.querySelector('.qe-maxqty')?.value||20),options:[]};
    if(type==='items'){
      q.itemMode='product';
      q.basePrice=Number(box.querySelector('.qe-base-price')?.value||0);
      q.allowNote=box.querySelector('.qe-allow-note')?.checked!==false;
      box.querySelectorAll('.option-editor').forEach(op=>q.options.push({id:op.dataset.optionId,label:op.querySelector('.qe-option-label').value.trim(),price:Number(op.querySelector('.qe-option-price').value||0),maxQty:Number(op.querySelector('.qe-option-maxqty')?.value||5)}));
    }else{
      box.querySelectorAll('.option-editor').forEach(op=>q.options.push({id:op.dataset.optionId,label:op.querySelector('.qe-option-label').value.trim(),price:Number(op.querySelector('.qe-option-price').value||0)}));
    }
    questions.push(q);
  });
  return {title:$('builderTitle').value.trim(),description:$('builderDescription').value.trim(),allowEdit:$('builderAllowEdit').checked,questions};
}


function addQuestion(){const draft=readBuilderDraft();draft.questions.push(newQuestion($('newQuestionType').value));state.editDraft=draft;renderBuilder()}
function removeQuestion(id){const draft=readBuilderDraft();draft.questions=draft.questions.filter(q=>q.id!==id);if(!draft.questions.length)draft.questions.push(newQuestion('text'));state.editDraft=draft;renderBuilder()}
function changeQuestionType(id,type){
  const draft=readBuilderDraft();const q=draft.questions.find(x=>x.id===id);if(!q)return;
  const oldType=q.type;q.type=type;
  if(type==='items'){q.itemMode='product';q.basePrice=Number(q.basePrice??0);q.maxQty=q.maxQty||20;q.allowNote=q.allowNote!==false;q.options=q.options||[];}
  else {delete q.itemMode;delete q.basePrice;delete q.allowNote;}
  if(['single','multi','dropdown'].includes(type)&&!q.options.length)q.options=[{id:'o'+Math.random().toString(36).slice(2,8),label:'選項一',price:0},{id:'o'+Math.random().toString(36).slice(2,8),label:'選項二',price:0}];
  state.editDraft=draft;renderBuilder();
}
function addOption(id){
  const draft=readBuilderDraft();const q=draft.questions.find(x=>x.id===id);if(!q)return;
  if(q.type==='items')q.options.push({id:'o'+Math.random().toString(36).slice(2,8),label:'加飯',price:0,maxQty:5});
  else q.options.push({id:'o'+Math.random().toString(36).slice(2,8),label:'新選項',price:0});
  state.editDraft=draft;renderBuilder();
}
async function saveBuilder(){
  const draft=readBuilderDraft();
  if(!draft.title){toast('請填寫問卷標題');return;}
  if(!draft.questions.length){toast('至少需要一個題目');return;}
  if(draft.questions.some(q=>!q.label)){toast('請填寫每一題的名稱');return;}
  for(const q of draft.questions){
    if(['single','multi','dropdown'].includes(q.type)&&(!q.options.length||q.options.some(o=>!o.label))){toast('選項題至少需要一個選項，而且選項名稱不可空白');return;}
    if(q.type==='items'){
      if(!Number.isFinite(q.basePrice)||q.basePrice<0){toast('主商品單價必須是 0 或正數');return;}
      if(!Number.isInteger(q.maxQty)||q.maxQty<1||q.maxQty>99){toast('主商品最多數量必須設定為 1 至 99 的整數');return;}
      if(q.options.some(o=>!o.label||!Number.isFinite(o.price)||o.price<0||!Number.isInteger(o.maxQty)||o.maxQty<1||o.maxQty>99)){toast('請檢查客製化／加購項目名稱、價格及數量上限');return;}
    }
  }
  setBusy(true);try{let r;if(state.editSurveyId)r=await api('saveSurvey',state.token,state.editSurveyId,draft);else r=await api('createSurvey',state.token,Object.assign({},draft,{initialStatus:'開放中'}));toast(r.message);state.editDraft=null;state.editSurveyId='';appNavigateBack();await loadAdmin()}catch(err){toast(err.message)}finally{setBusy(false)}
}

function responseAnswersObject(response){
  let answers=response&&response.answers;
  if(typeof answers==='string'){try{answers=JSON.parse(answers)}catch(e){answers={}}}
  return answers&&typeof answers==='object'?answers:{};
}
function answerForQuestion(response,q){
  const answers=responseAnswersObject(response);
  if(Object.prototype.hasOwnProperty.call(answers,q.id))return answers[q.id];
  if(Object.prototype.hasOwnProperty.call(answers,q.label))return answers[q.label];
  return undefined;
}
function optionIdFromValue(value){
  if(value&&typeof value==='object')return String(value.optionId||value.itemId||value.id||value.value||value.label||'');
  return String(value==null?'':value);
}
function findQuestionOption(q,value){
  const key=optionIdFromValue(value);
  return (q.options||[]).find(o=>String(o.id)===key||String(o.label)===key)||null;
}
function valuesFromSelection(answer){
  if(Array.isArray(answer))return answer;
  if(answer==null||answer==='')return [];
  if(typeof answer==='object'){
    if(Array.isArray(answer.selected))return answer.selected;
    if(Array.isArray(answer.values))return answer.values;
    if(answer.optionId||answer.id||answer.label||answer.value)return [answer];
  }
  if(typeof answer==='string'&&/[、,，]/.test(answer))return answer.split(/[、,，]/).map(x=>x.trim()).filter(Boolean);
  return [answer];
}
function buildShopOrderSummary(s, list) {
  const rows=[];
  const asQty=(value,fallback=0)=>{
    const n=Number(value==null||value===''?fallback:value);
    return Number.isFinite(n)&&n>0?n:0;
  };
  const optionQty=(item,defaultQty=1)=>{
    if(item&&typeof item==='object'){
      const raw=item.qty??item.quantity??item.count;
      return asQty(raw,defaultQty);
    }
    return asQty(defaultQty,1);
  };
  const collectItemTotals=(q,answer,totals)=>{
    valuesFromSelection(answer).forEach(item=>{
      const op=findQuestionOption(q,item);if(!op)return;
      const qty=optionQty(item,1);if(qty>0)totals[op.id]=(totals[op.id]||0)+qty;
    });
  };
  const appendOptionTotals=(q,totals,kind)=>{
    (q.options||[]).forEach(op=>{
      const qty=Number(totals[op.id]||0);if(qty>0){
        const price=Number(op.price||0);
        rows.push({kind,name:q.label,option:op.label,price,qty,amount:price*qty});
      }
    });
  };
  const collectCustomizations=(q,raw,totals)=>{
    let entries=[];
    if(Array.isArray(raw))entries=raw;
    else if(raw&&typeof raw==='object')entries=Object.keys(raw).map(key=>({optionId:key,qty:raw[key]}));
    entries.forEach(item=>{
      const op=findQuestionOption(q,item);if(!op)return;
      const qty=optionQty(item,1);if(qty>0)totals[op.id]=(totals[op.id]||0)+qty;
    });
  };

  (s.questions||[]).forEach(q=>{
    if(q.type==='items'){
      const isProduct=q.itemMode==='product'||q.basePrice!==undefined;
      if(isProduct){
        let productQty=0;
        const customTotals={},legacyItemTotals={};
        list.forEach(response=>{
          const answer=answerForQuestion(response,q);
          if(Array.isArray(answer)){
            // 相容早期一題多商品的歷史回覆，合併計算所有回覆中的商品數量。
            collectItemTotals(q,answer,legacyItemTotals);
          }else if(answer&&typeof answer==='object'){
            const mainRaw=answer.productQty??answer.mainQty??answer.qty??answer.quantity??answer.count??0;
            productQty+=asQty(mainRaw,0);
            collectCustomizations(q,answer.customizations??answer.addons??answer.customOptions??[],customTotals);
          }
        });
        const basePrice=Number(q.basePrice||0);
        if(productQty>0)rows.push({kind:'主商品',name:q.label,option:'',price:basePrice,qty:productQty,amount:basePrice*productQty});
        appendOptionTotals(q,customTotals,'客製化／加購');
        appendOptionTotals(q,legacyItemTotals,'歷史商品項目');
      }else{
        const totals={};
        list.forEach(response=>collectItemTotals(q,answerForQuestion(response,q),totals));
        appendOptionTotals(q,totals,'商品項目');
      }
    }else if(['single','dropdown','multi','radio','select','checkbox'].includes(q.type)){
      // 一般免費選項留在「一般選項統計」；店家訂單只列有價格的選項。
      const totals={};
      list.forEach(response=>valuesFromSelection(answerForQuestion(response,q)).forEach(value=>{
        const op=findQuestionOption(q,value);if(op)totals[op.id]=(totals[op.id]||0)+1;
      }));
      (q.options||[]).filter(op=>Number(op.price||0)>0).forEach(op=>{
        const qty=Number(totals[op.id]||0);if(qty>0){const price=Number(op.price||0);rows.push({kind:'計價選項',name:q.label,option:op.label,price,qty,amount:price*qty});}
      });
    }
  });
  const total=list.reduce((sum,response)=>sum+Number(response.amount||0),0);
  return {rows,total};
}
function buildGeneralOptionStats(s,list,serverStats){
  if(Array.isArray(serverStats)&&serverStats.length){
    return serverStats.map(item=>`<div class="history-item"><b>${esc(item.label)}</b>${(item.options||[]).map(o=>`<div class="answer-line">${esc(o.label)}：${Number(o.count||0)} 次</div>`).join('')}<div class="tiny muted">有作答 ${Number(item.answeredCount||0)} 份</div></div>`).join('');
  }
  const supported=['single','dropdown','multi','radio','select','checkbox'];
  return (s.questions||[]).filter(q=>supported.includes(q.type)&&(q.options||[]).length).map(q=>{
    const counts={};(q.options||[]).forEach(op=>counts[op.id]=0);
    list.forEach(response=>valuesFromSelection(answerForQuestion(response,q)).forEach(value=>{const op=findQuestionOption(q,value);if(op)counts[op.id]=(counts[op.id]||0)+1;}));
    const answeredCount=Object.values(counts).reduce((a,b)=>a+b,0);
    return `<div class="history-item"><b>${esc(q.label)}</b>${(q.options||[]).map(op=>`<div class="answer-line">${esc(op.label)}：${counts[op.id]||0} 次</div>`).join('')}<div class="tiny muted">選項被選取共 ${answeredCount} 次</div></div>`;
  }).join('');
}
function renderShopOrderSummaryHtml(summary){
  if(!summary.rows.length)return `<div class="notice">目前沒有商品或計價選項的訂購明細。<br>全部回覆總金額：<b>${money(summary.total)}</b></div>`;
  return `<div class="shop-summary-wrap"><table class="shop-summary"><thead><tr><th>類型</th><th>商品名稱／題目</th><th>客製化／選項</th><th>單價</th><th>訂購數量</th><th>金額</th></tr></thead><tbody>${summary.rows.map(r=>`<tr><td>${esc(r.kind)}</td><td>${esc(r.name)}</td><td>${esc(r.option)}</td><td>${money(r.price)}</td><td>${r.qty}</td><td class="money-cell">${money(r.amount)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="5">全部回覆總金額</td><td class="money-cell">${money(summary.total)}</td></tr></tfoot></table></div>`;
}
function renderResponses(){
  const s=state.adminSurvey,list=state.adminResponses||[];const total=list.reduce((n,r)=>n+Number(r.amount||0),0);
  const hasGeneralOptionQuestions=(s.questions||[]).some(q=>['single','dropdown','multi','radio','select','checkbox'].includes(q.type)&&(q.options||[]).length>0);
  const stats=hasGeneralOptionQuestions?buildGeneralOptionStats(s,list,state.adminOptionStats):'';
  // 畫面直接根據每筆回覆內容統整商品份數及客製化數量，避免 API 彙總格式差異造成只剩總金額。
  const shopSummary=buildShopOrderSummary(s,list);
  const generalStatsCard=hasGeneralOptionQuestions?`<div class="card"><h3>一般選項統計</h3>${stats||'<div class="muted small">目前尚無一般選項作答。</div>'}</div>`:'';
  $('main').innerHTML=`<button class="back" onclick="appNavigateBack()">← 返回問卷列表</button><section class="hero"><h2>${esc(s.title)}</h2><p>問卷回覆及統計資料</p></section><div class="card"><div class="stat-grid"><div class="stat"><b>${list.length}</b><span>回覆筆數</span></div><div class="stat"><b>${money(total)}</b><span>金額合計</span></div><div class="stat"><b>${s.status==='開放中'?'開放中':s.status==='已結束'?'已結束':'未開放'}</b><span>問卷狀態</span></div></div><button class="btn btn-green btn-block" style="margin-top:12px" onclick="exportSurveyExcel('${esc(s.id)}')">下載 Excel（個別回覆＋店家統整）</button></div><div class="card"><h3>店家下單統整（商品數量、客製化及金額）</h3>${renderShopOrderSummaryHtml(shopSummary)}</div>${generalStatsCard}<div class="card"><h3>個別回覆</h3>${list.length?list.map(r=>`<div class="order-card"><div class="order-top"><b>${esc(r.name)}（電話末四碼 ${esc(r.phoneLast4)}）</b><span class="amount">${money(r.amount)}</span></div><div class="tiny muted">${esc(dateText(r.submittedAt))} ・ ${esc(r.responseId)}</div>${renderFilledAnswersHtml(s,r.answers)}<button class="btn btn-secondary btn-block" style="margin-top:10px" onclick="adminEditResponse('${esc(r.responseId)}')">管理者修改這筆回覆</button></div>`).join(''):'<div class="notice">目前沒有回覆。</div>'}</div>`;
}
function adminEditResponse(responseId){const r=state.adminResponses.find(x=>x.responseId===responseId);if(!r)return;const s=state.adminSurvey;showModal(`<h3>管理者修改回覆</h3><p class="small muted">${esc(r.name)} ・ ${esc(responseId)}</p><div id="adminQuestionForm">${s.questions.map(q=>renderQuestion(q,r.answers)).join('')}</div><div class="btn-row"><button class="btn btn-primary" onclick="saveAdminResponse('${esc(responseId)}')">儲存</button><button class="btn btn-plain" onclick="closeModal()">取消</button></div>`);document.querySelectorAll('#adminQuestionForm .question-box[data-item-mode="product"]').forEach(syncProductOptionAvailability)}
async function saveAdminResponse(id){const answers=collectAnswersFrom('#adminQuestionForm');setBusy(true);try{const r=await api('adminUpdateResponse',state.token,state.adminSurvey.id,id,answers);toast(r.message);closeModal();await viewResponses(state.adminSurvey.id)}catch(err){toast(err.message)}finally{setBusy(false)}}

async function exportSurveyExcel(id){setBusy(true);try{const r=await api('exportSurveyXlsx',state.token,id);const raw=atob(r.base64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=r.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Excel 匯出完成')}catch(err){toast('匯出失敗：'+err.message)}finally{setBusy(false)}}
function renderSettings(){const s=state.adminOverview.settings||{};const recoveryWarning=state.adminOverview.configCorrupted?`<div class="notice error">目前 JSON 設定檔無法讀取：${esc(state.adminOverview.configError||'格式錯誤')}。請從下方選擇有效的歷史備份進行還原；此時不要建立新問卷或修改備份設定。</div>`:'';$('adminContent').innerHTML=`<div class="card"><h3>☁️ 雲端備份與還原</h3>${recoveryWarning}<div class="notice success">系統會在修改問卷設定前自動保存上一版，每天凌晨約 3 點另建立完整備份。</div><div class="field"><label class="checkline"><input id="autoBackup" type="checkbox" ${s.autoBackup!==false?'checked':''}> 啟用自動雲端備份</label></div><div class="editor-grid"><div class="field"><label>設定版本保留數</label><input id="configKeep" type="number" class="input" min="10" max="100" value="${Number(s.configBackupKeep||50)}"></div><div class="field"><label>完整備份保留數</label><input id="fullKeep" type="number" class="input" min="3" max="30" value="${Number(s.fullBackupKeep||10)}"></div></div><button class="btn btn-secondary btn-block" onclick="saveBackupPrefs()">儲存備份設定</button><div class="divider"></div><div class="notice">最近完整備份：${esc(s.lastBackupAt||'尚未備份')}<br>手動備份會包含全部問卷設定及填寫結果。</div><button class="btn btn-primary btn-block" style="margin-top:10px" onclick="runManualBackup()">☁ 立即雲端備份</button><div class="divider"></div><h3>手動雲端還原</h3><p class="small muted">選擇歷史備份，先預覽內容，再決定只還原問卷設定或完整還原設定及回覆。還原前系統會先保護目前資料。</p><button class="btn btn-plain btn-block" onclick="refreshBackupList()">重新整理備份清單</button><div id="backupList" class="small muted" style="margin-top:12px">尚未載入備份清單。</div></div><div class="card"><h3>🔐 管理者密碼設定</h3><p class="small muted">密碼只儲存在 GAS Script Properties，前端及 JSON 設定檔不會保存密碼。</p><div class="field"><label>新密碼（8 至 64 個字元）</label><input id="newPassword" class="input" type="password" maxlength="64" autocomplete="new-password"></div><div class="field"><label>再次輸入新密碼</label><input id="newPassword2" class="input" type="password" maxlength="64" autocomplete="new-password"></div><button class="btn btn-primary btn-block" onclick="saveNewPassword()">修改管理者密碼</button></div><div class="card"><h3>雲端檔案</h3><div class="btn-row"><a class="btn btn-plain" style="text-decoration:none;text-align:center" target="_blank" href="${esc(s.resultSpreadsheetUrl||'#')}">開啟全部問卷結果試算表</a><a class="btn btn-plain" style="text-decoration:none;text-align:center" target="_blank" href="${esc(s.jsonFileUrl||'#')}">開啟 JSON 設定</a></div></div>`;refreshBackupList()}
function renderBackup(){renderSettings()}

async function refreshBackupList(){const el=$('backupList');if(!el)return;el.innerHTML='正在讀取雲端備份…';try{const list=await api('listBackups',state.token);el.innerHTML=list.length?list.map(b=>`<div class="history-item"><div class="order-top"><b>${esc(b.type)}</b><span class="badge">${esc(dateText(b.createdAt))}</span></div><div class="tiny muted">${esc(b.description)} ・ ${Math.round(b.size/1024)} KB</div><button class="btn btn-plain btn-block" style="margin-top:8px" onclick="previewRestore('${esc(b.id)}')">預覽／還原此版本</button></div>`).join(''):'<div class="notice">目前還沒有備份版本。</div>'}catch(err){el.innerHTML=`<div class="notice error">${esc(err.message)}</div>`}}

async function restoreSelected(id,mode){const message=mode==='full'?'完整還原會以備份當時的資料取代對應問卷工作表目前的回覆。':'只還原問卷設定，保留目前所有填寫結果。';if(!confirm(message+'\n確定繼續？'))return;setBusy(true);try{const r=await api('restoreBackup',state.token,id,mode);closeModal();toast(r.message);await loadAdmin({preserveTab:true});}catch(err){toast(err.message)}finally{setBusy(false)}}
async function saveNewPassword(){const a=$('newPassword').value,b=$('newPassword2').value;if(a.length<8){toast('新密碼至少 8 個字元');return}if(a!==b){toast('兩次輸入的密碼不一致');return}setBusy(true);try{const r=await api('changeAdminPassword',state.token,a);toast(r.message);$('newPassword').value='';$('newPassword2').value=''}catch(err){toast(err.message)}finally{setBusy(false)}}

// 點擊或取得焦點時自動全選文字，方便直接覆寫原內容。
// click 會在瀏覽器完成游標定位後再執行，避免 focusin 的選取被點擊位置覆蓋。
// 數字欄位也嘗試全選；不支援選取的行動瀏覽器會安全略過。
function selectEditableField(field){
  if (!(field instanceof HTMLInputElement || field instanceof HTMLTextAreaElement)) return;
  if (field.disabled || field.readOnly) return;
  if (field instanceof HTMLInputElement) {
    const selectableTypes = ['text', 'tel', 'email', 'search', 'url', 'password', 'number'];
    const inputType = (field.type || 'text').toLowerCase();
    if (!selectableTypes.includes(inputType)) return;
  }
  try { field.select(); } catch (error) { /* 部分行動瀏覽器不支援的欄位略過。 */ }
}
document.addEventListener('focusin', event => {
  const field = event.target;
  if (!(field instanceof HTMLInputElement || field instanceof HTMLTextAreaElement)) return;
  requestAnimationFrame(() => selectEditableField(field));
});
document.addEventListener('click', event => {
  const field = event.target;
  if (!(field instanceof HTMLInputElement || field instanceof HTMLTextAreaElement)) return;
  setTimeout(() => {
    if (document.activeElement === field) selectEditableField(field);
  }, 0);
});

// 手機／PWA 返回鍵：依實際畫面層級返回；位於根畫面時才詢問是否離開。
window.__JQ_APP_NAV__={stack:[],initialized:false,replaying:false,modalActive:false,closingModal:false,reuseModalSlot:false,allowExit:false,suppressNextPop:false};
function setAppNavigationRoot(entry){
  const nav=window.__JQ_APP_NAV__;
  const oldDepth=Math.max(0,nav.stack.length-1);
  nav.stack=[entry];nav.replaying=false;nav.modalActive=false;nav.closingModal=false;nav.reuseModalSlot=false;nav.allowExit=false;
  if(nav.initialized){
    if(oldDepth>0){
      // 將已退出的內頁歷史一併收回，再建立新的根畫面與返回哨兵。
      nav.suppressNextPop=true;history.go(-oldDepth);
    }else history.replaceState({jqAppRoot:true},'',location.href);
  }
}
function pushAppView(entry){
  const nav=window.__JQ_APP_NAV__;if(!nav.initialized)initAppNavigation();
  if(nav.modalActive){nav.modalActive=false;nav.reuseModalSlot=true;}
  nav.stack.push(entry);
  if(nav.reuseModalSlot){history.replaceState({jqAppView:true},'',location.href);nav.reuseModalSlot=false;}
  else history.pushState({jqAppView:true},'',location.href);
}
function appNavigateBack(){
  const nav=window.__JQ_APP_NAV__;
  if(nav.modalActive){closeModal();return;}
  if(nav.stack.length>1){history.back();return;}
  appRequestExit();
}
function appRequestExit(){
  const nav=window.__JQ_APP_NAV__;
  if(!confirm('確定要退出真好點問卷系統嗎？\n\n選擇「取消」會留在程式中。')){
    history.pushState({jqAppRoot:true},'',location.href);
    return;
  }
  // 在 PWA 中讓系統返回上一個啟動層；一般瀏覽器則回到進入程式前的頁面。
  nav.allowExit=true;history.back();
}
function renderAppNavigationEntry(entry){
  const nav=window.__JQ_APP_NAV__;nav.replaying=true;
  try{
    if(!entry||entry.type==='home'){renderHome();return;}
    if(entry.type==='admin'){
      state.adminTab='surveys';
      if(state.adminOverview)renderAdmin();else loadAdmin({preserveTab:true,silent:true});
      return;
    }
    if(entry.type==='adminTab'){
      state.adminTab=entry.tab||'surveys';renderAdmin();return;
    }
    if(entry.type==='builder'){
      state.adminTab='builder';state.editSurveyId=entry.editSurveyId||'';state.editDraft=entry.editDraft||blankSurvey();renderAdmin();return;
    }
    if(entry.type==='responses'){
      state.adminSurvey=entry.survey;state.adminResponses=entry.responses||[];state.adminShopSummary=entry.shopSummary||null;state.adminOptionStats=entry.optionStats||null;state.adminTab='responses';renderResponses();return;
    }
    if(entry.type==='survey'){
      state.activeSurvey=entry.survey;state.editingResponse=entry.existing||null;renderSurveyForm(entry.existing?entry.existing.answers:null);return;
    }
    renderHome();
  }finally{nav.replaying=false;}
}
function initAppNavigation(){
  const nav=window.__JQ_APP_NAV__;if(nav.initialized)return;
  nav.initialized=true;nav.stack=[state.admin?{type:'admin'}:{type:'home'}];
  history.replaceState({jqAppRoot:true},'',location.href);
  // 額外保留一個程式內返回哨兵，確保手機第一次按返回也能顯示退出確認。
  history.pushState({jqAppRootGuard:true},'',location.href);
  window.addEventListener('popstate',event=>{
    const n=window.__JQ_APP_NAV__;
    if(n.suppressNextPop){n.suppressNextPop=false;history.replaceState({jqAppRoot:true},'',location.href);history.pushState({jqAppRootGuard:true},'',location.href);return;}
    if(n.allowExit){n.allowExit=false;return;}
    n.reuseModalSlot=false;
    if(n.modalActive){n.modalActive=false;n.closingModal=false;$('modalRoot').innerHTML='';return;}
    if(n.closingModal){n.closingModal=false;return;}
    if(n.stack.length>1){n.stack.pop();renderAppNavigationEntry(n.stack[n.stack.length-1]);return;}
    if(event.state&&event.state.jqAppView){
      // 先前畫面已透過送出／退出管理重設為根畫面，略過殘留的舊畫面歷史項。
      history.pushState({jqAppRootGuard:true},'',location.href);return;
    }
    if(!confirm('確定要退出真好點問卷系統嗎？\n\n選擇「取消」會留在程式中。'))history.pushState({jqAppRootGuard:true},'',location.href);
    else{n.allowExit=true;history.back();}
  });
}

initAppNavigation();
initPwaInstall();
renderStartupScreen();
