<script id="jq-dynamic-pwa-manifest">
(function(){
  "use strict";
  // 真好點單檔 PWA：Manifest 由 Blob 動態生成，圖示使用 GitHub Pages 根目錄的 ico.png。
  // GitHub Pages 正式網址位於 /JinOrder/，因此所有安裝路徑都轉成絕對網址。
  let appBaseUrl;
  try {
    const isVirtual = window.location.href.startsWith('blob:') || window.location.href.startsWith('data:');
    appBaseUrl = isVirtual
      ? new URL('./', document.referrer || (window.location.origin + '/JinOrder/')).href
      : new URL('./', window.location.href).href;
  } catch (e) {
    appBaseUrl = 'https://tcuteblue.github.io/JinOrder/';
  }

  let iconUrl;
  try {
    const isVirtual = window.location.href.startsWith('blob:') || window.location.href.startsWith('data:');
    iconUrl = new URL('ico.png', isVirtual ? appBaseUrl : window.location.href).href;
  } catch (e) {
    iconUrl = new URL('ico.png', appBaseUrl).href;
  }

  const startUrl = new URL('./?source=pwa', appBaseUrl).href;
  const svgFallback = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ff9b24'/%3E%3Ccircle cx='50' cy='43' r='29' fill='%23ffd928' stroke='%231b1b1b' stroke-width='5'/%3E%3Ccircle cx='40' cy='38' r='3.5'/%3E%3Ccircle cx='60' cy='38' r='3.5'/%3E%3Cpath d='M37 52 Q50 66 63 52' fill='none' stroke='%231b1b1b' stroke-width='5' stroke-linecap='round'/%3E%3Ctext x='50' y='91' font-size='15' font-weight='900' text-anchor='middle' fill='white' stroke='%23d94b18' stroke-width='1.5' paint-order='stroke'%3E真%3C/text%3E%3C/svg%3E";

  const manifest = {
    id: appBaseUrl,
    name: '真好點問卷系統',
    short_name: '真好點',
    description: '輕鬆設計問卷，快速收集與整理回答。',
    lang: 'zh-TW',
    start_url: startUrl,
    scope: appBaseUrl,
    display: 'standalone',
    display_override: ['standalone', 'minimal-ui'],
    orientation: 'portrait',
    background_color: '#fff8e7',
    theme_color: '#ffc928',
    prefer_related_applications: false,
    icons: [
      // 沿用已實際成功安裝的信用卡夾範例：同一個正式 PNG 提供 192 / 512 尺寸宣告。
      { src: iconUrl, sizes: '192x192 512x512', type: 'image/png', purpose: 'any maskable' },
      { src: svgFallback, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' }
    ]
  };

  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const manifestUrl = URL.createObjectURL(manifestBlob);
  const manifestLink = document.createElement('link');
  manifestLink.rel = 'manifest';
  manifestLink.href = manifestUrl;
  document.head.appendChild(manifestLink);

  // 瀏覽器分頁圖示及 iOS 主畫面圖示，均讀取根目錄 ico.png。
  const favicon = document.createElement('link');
  favicon.rel = 'icon';
  favicon.type = 'image/png';
  favicon.href = iconUrl;
  document.head.appendChild(favicon);

  const appleIcon = document.createElement('link');
  appleIcon.rel = 'apple-touch-icon';
  appleIcon.href = iconUrl;
  document.head.appendChild(appleIcon);

  window.__JQ_LOGO_URL__ = iconUrl;
  window.__JQ_MANIFEST_URL__ = manifestUrl;
  window.__JQ_PWA_ICON_URL__ = iconUrl;
})();
</script>

<script>
'use strict';
/* 部署完成後，將 GAS /exec 網址貼在下方，然後更新 GitHub Pages 的 index.html。 */
const GAS_EXEC_URL = 'https://script.google.com/macros/s/AKfycbxw-JED9O-aW_x39VIOZJYeTb4Ou57eito80nsnYcqR3YM4FMQH49XMa3lbTjALbg9klA/exec';
const CHANNEL = 'JINORDER_SURVEY_RPC_V1';
const PROFILE_STORAGE_KEY = 'jinorder_profile_v1';
function readRememberedIdentity(){
  try{
    const saved=JSON.parse(localStorage.getItem(PROFILE_STORAGE_KEY)||'null');
    if(!saved||typeof saved!=='object')return null;
    return {name:String(saved.name||''),phone:String(saved.phone||'')};
  }catch(e){return null}
}
function rememberIdentity(profile){
  const previous=state.identity||{name:'',phone:''};
  const next={
    name:profile&&profile.name!==undefined?String(profile.name):String(previous.name||''),
    phone:profile&&profile.phone!==undefined?String(profile.phone):String(previous.phone||'')
  };
  state.identity=next;
  try{
    if(next.name||next.phone)localStorage.setItem(PROFILE_STORAGE_KEY,JSON.stringify(next));
    else localStorage.removeItem(PROFILE_STORAGE_KEY);
  }catch(e){/* 無痕模式或瀏覽器停用儲存空間時，仍可正常填寫問卷。 */}
  return next;
}
const state = {
  publicData:null, surveys:[], admin:false, token:'', adminTab:'surveys',
  activeSurvey:null, editingResponse:null, identity:readRememberedIdentity(), lookupSurveyId:'',
  adminOverview:null, adminSurvey:null, adminResponses:[], editSurveyId:'',
  logoClicks:0, logoTimer:null, bridgeReady:false, bridgePort:null, bridgePending:new Map(), bridgeNonce:'', requestNo:0
};
let deferredInstallPrompt = null;
const $ = id => document.getElementById(id);
if ($('logoImage') && window.__JQ_LOGO_URL__) $('logoImage').src = window.__JQ_LOGO_URL__;
// 管理者入口：在左上角 Logo 連續點擊五次，即可開啟管理者登入視窗。
$('logoTap').addEventListener('click',()=>{
  state.logoClicks++;
  clearTimeout(state.logoTimer);
  state.logoTimer=setTimeout(()=>{state.logoClicks=0;},1800);
  if(state.logoClicks>=5){
    state.logoClicks=0;
    clearTimeout(state.logoTimer);
    if(state.admin){loadAdmin();}else{adminLoginDialog();}
  }
});
const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Number(n || 0).toLocaleString('zh-TW',{maximumFractionDigits:2});
const dateText = value => { if(!value)return ''; const d=new Date(value); return isNaN(d.getTime())?String(value):d.toLocaleString('zh-TW',{hour12:false}); };
function toast(message){const el=$('toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toast._timer);toast._timer=setTimeout(()=>el.classList.add('hidden'),3200)}
function setBusy(on){document.body.classList.toggle('loading',!!on)}
function showModal(html){$('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
function setStatus(text,ok=true){/* 正常連線狀態不在首頁顯示；連線失敗仍由 renderError() 呈現。 */}

function makeBridgeNonce(){
  try{return Array.from(crypto.getRandomValues(new Uint8Array(18))).map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){return 'jq'+Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)}
}
function isTrustedGasOrigin(origin){
  try{
    const host=new URL(origin).hostname.toLowerCase();
    // Apps Script HTML Service 的實際 sandbox host 常是 n-xxxx-0lu-script.googleusercontent.com，
    // 注意它前面是連字號，不是 .script.googleusercontent.com。
    return host==='script.google.com'||
      host==='script.googleusercontent.com'||
      host.endsWith('.script.googleusercontent.com')||
      /^[a-z0-9-]+-script\.googleusercontent\.com$/.test(host);
  }catch(e){return false}
}
function setupBridge(){
  if(!GAS_EXEC_URL || GAS_EXEC_URL.indexOf('https://script.google.com/macros/s/')!==0){
    setStatus('待設定 API',false);renderBridgeSetup();return;
  }
  const frame=$('gasBridge');
  const nonce=makeBridgeNonce();
  state.bridgeNonce=nonce;

  // 收到 GAS 內層 sandbox frame 傳來的 MessagePort 後，後續 API 全走該 Port。
  // 這可避免 GitHub 只把訊息送到 GAS 外層 iframe、內層 userCodeAppPanel 收不到的巢狀 iframe 問題。
  window.addEventListener('message',event=>{
    if(!isTrustedGasOrigin(event.origin)||!event.data||event.data.channel!==CHANNEL||event.data.nonce!==nonce)return;
    if(event.data.type==='ready'){
      const port=event.ports&&event.ports[0];
      if(!port){setStatus('GAS 橋接錯誤',false);renderError('GAS 已載入，但沒有提供安全訊息通道。請更新 GAS 後端至 v7.0.0。');return;}
      if(state.bridgePort){try{state.bridgePort.close()}catch(e){}}
      state.bridgePort=port;
      state.bridgePort.onmessage=handleBridgePortMessage;
      if(state.bridgePort.start)state.bridgePort.start();
      if(state.bridgeReady)return;
      state.bridgeReady=true;
      setStatus('雲端已連線');
      loadPublic();
      return;
    }
    if(event.data.type==='bridge_error'){
      setStatus('GAS 橋接錯誤',false);
      renderError(event.data.error||'GAS 橋接頁未能啟動。請重新部署最新 Code.gs。');
    }
  });
  frame.addEventListener('load',()=>{
    if(!state.bridgeReady)setStatus('GAS 頁面已載入，正在建立安全通道…',false);
  });
  frame.addEventListener('error',()=>{
    setStatus('GAS 載入失敗',false);
    renderError('瀏覽器無法載入 GAS 橋接頁。請確認網路、部署權限及 GAS 網頁應用程式網址。');
  });
  const bridgeUrl=new URL(GAS_EXEC_URL);
  bridgeUrl.searchParams.set('bridge','1');
  bridgeUrl.searchParams.set('nonce',nonce);
  frame.src=bridgeUrl.toString();

  setTimeout(()=>{
    if(!state.bridgeReady){
      setStatus('連線逾時',false);
      renderError('GAS 橋接頁已發出載入請求，但 25 秒內沒有收到安全通道。請確認已將 GAS Code.gs 更新至 v7.0.0，並部署為「以我執行／所有人均可存取」。');
    }
  },25000);
}
function handleBridgePortMessage(event){
  const data=event&&event.data;
  if(!data||data.channel!==CHANNEL||data.nonce!==state.bridgeNonce)return;
  if(data.type==='response'){
    const pending=state.bridgePending.get(data.id);if(!pending)return;
    clearTimeout(pending.timer);state.bridgePending.delete(data.id);
    if(data.ok)pending.resolve(data.result);else pending.reject(new Error(data.error||'雲端服務發生錯誤'));
  }
}
function api(method,...args){
  return new Promise((resolve,reject)=>{
    if(!state.bridgeReady||!state.bridgePort){reject(new Error('雲端連線尚未就緒，請稍候或重新整理。'));return;}
    const id='r'+(++state.requestNo)+'_'+Date.now();
    const timer=setTimeout(()=>{state.bridgePending.delete(id);reject(new Error('雲端回應逾時，請稍後再試。'));},45000);
    state.bridgePending.set(id,{resolve,reject,timer});
    try{
      state.bridgePort.postMessage({channel:CHANNEL,nonce:state.bridgeNonce,type:'request',id,method,args});
    }catch(err){
      clearTimeout(timer);state.bridgePending.delete(id);reject(err);
    }
  });
}

function isRunningStandalone(){
  const modes=['standalone','minimal-ui','fullscreen'];
  return modes.some(mode=>window.matchMedia&&window.matchMedia(`(display-mode: ${mode})`).matches)
    || window.navigator.standalone===true;
}

function showInstallButton(){

async function installApp(){
  if(isRunningStandalone()){
    hideInstallButton();
    toast('真好點已經安裝在這台裝置上了。');
    return;
  }
  if(deferredInstallPrompt){
    const promptEvent=deferredInstallPrompt;
    deferredInstallPrompt=null;
    try{
      await promptEvent.prompt();
      const choice=await promptEvent.userChoice;
      if(choice&&choice.outcome==='accepted'){
        toast('已接受安裝，請完成系統安裝步驟。');
      }else{
        const btn=$('installBtn');
        if(btn)btn.textContent='📲 安裝為 APP';
      }
    }catch(err){
      console.warn('PWA 安裝視窗未能開啟：',err);
      toast('目前無法開啟安裝視窗，請稍後再試。');
    }
    return;
  }
  showModal(`<h3>真好點安裝為 APP</h3><p>Chrome 目前尚未提供真正的應用程式安裝提示。</p><div class="notice">請確認使用 Android Chrome，並保持網頁開啟一段時間、至少點擊操作一次。若右上角選單出現「安裝應用程式」，可使用該選項。<br><br><strong>請不要選擇「新增至主畫面」來代替安裝</strong>，那可能只會建立帶有 Chrome 標誌的網頁捷徑。</div><p class="tiny muted">當瀏覽器確認符合 PWA 安裝條件後，這個按鈕會直接開啟系統安裝視窗。</p><button class="btn btn-primary btn-block" onclick="closeModal()">知道了</button>`);
}
function initPwaInstall(){
  const btn=$('installBtn');
  if(!btn)return;
  btn.textContent='📲 安裝為 APP';
  btn.addEventListener('click',installApp);

  // CSS 會先隱藏已安裝 App 的按鈕；此處再補 Safari/iOS 的 standalone 判斷。
  if(isRunningStandalone()){
    hideInstallButton();
    return;
  }

  window.addEventListener('beforeinstallprompt',event=>{
    event.preventDefault();
    deferredInstallPrompt=event;
    btn.textContent='📲 立即安裝 APP';
    showInstallButton();
  });

  window.addEventListener('appinstalled',()=>{
    deferredInstallPrompt=null;
    hideInstallButton();
    toast('真好點已成功安裝！');
  });

  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&isRunningStandalone())hideInstallButton();
  });
}

  else if(q.type==='items' && (q.itemMode==='product'||q.basePrice!==undefined)){

      ${(q.options||[]).length?`<div class="customization-list"><h4>客製化／加購選項</h4>${(q.options||[]).map(o=>{const item=custom.find(x=>x.optionId===o.id);const qty=item?Number(item.qty||0):0;const max=Number(o.maxQty||5);return `<div class="customization-row"><div class="customization-info"><strong>${esc(o.label)}</strong><span class="tiny muted">${money(o.price||0)}／份・最多 ${max} 份</span></div><div class="qty-control compact"><button type="button" aria-label="減少${esc(o.label)}數量" onclick="adjustQty(this,-1,${max})" ${productQty<=0||qty<=0?'disabled':''}>－</button><input class="qty-value" data-qty-role="custom" data-option-id="${esc(o.id)}" type="number" inputmode="numeric" min="0" max="${max}" value="${qty}" oninput="handleQtyInput(this)" ${productQty<=0?'disabled':''}><button type="button" aria-label="增加${esc(o.label)}數量" onclick="adjustQty(this,1,${max})" ${productQty<=0||qty>=max?'disabled':''}>＋</button></div></div>`}).join('')}</div>`:'<p class="tiny muted">此商品沒有額外客製化選項。</p>'}
      ${q.allowNote!==false?`<textarea class="textarea item-product-note" data-item-note maxlength="300" placeholder="商品備註（選填，例如不要香菜）">${esc(a.note||'')}</textarea>`:''}

  return `<div class="field question-box" data-qid="${esc(q.id)}" data-type="${esc(q.type)}" data-item-mode="${esc(q.itemMode||(q.basePrice!==undefined?'product':'legacy'))}"><label>${esc(q.label)}${required}</label>${body}</div>`;

function collectAnswersFrom(rootSelector){
  const out={};
  document.querySelectorAll(`${rootSelector} .question-box`).forEach(box=>{
    const id=box.dataset.qid,type=box.dataset.type;
    if(type==='text'||type==='textarea'||type==='date'||type==='number'){const el=box.querySelector('[data-answer]');out[id]=el?el.value:'';}
    else if(type==='rating'){const x=box.querySelector('input:checked');out[id]=x?Number(x.value):'';}
    else if(type==='single'){const x=box.querySelector('input:checked');out[id]=x?x.value:'';}
    else if(type==='multi'){out[id]=Array.from(box.querySelectorAll('input:checked')).map(x=>x.value);}
    else if(type==='dropdown'){const x=box.querySelector('[data-answer]');out[id]=x?x.value:'';}
    else if(type==='items'&&box.dataset.itemMode==='product'){
      const productQty=Math.max(0,Number(box.querySelector('[data-qty-role="product"]')?.value||0));
      const customizations=Array.from(box.querySelectorAll('[data-qty-role="custom"]')).map(el=>({optionId:el.dataset.optionId,qty:Math.max(0,Number(el.value||0))})).filter(x=>x.qty>0);
      const note=box.querySelector('[data-item-note]')?.value.trim()||'';
      out[id]={productQty:productQty,customizations:customizations,note:note};
    }
    else if(type==='items'){
      out[id]=Array.from(box.querySelectorAll('.item-option')).filter(el=>el.querySelector('.item-check').checked).map(el=>({optionId:el.querySelector('.item-check').value,qty:Number(el.querySelector('.item-qty').value)||1,note:el.querySelector('.item-note').value.trim()}));
    }
  });
  return out;
}
function collectAnswers(){return collectAnswersFrom('#questionForm')}
function adjustQty(button,delta,max){
  const control=button.closest('.qty-control');if(!control)return;
  const input=control.querySelector('.qty-value');if(!input||input.disabled)return;
  const next=Math.max(0,Math.min(Number(max||99),Math.floor(Number(input.value||0))+delta));
  input.value=String(next);
  input.dispatchEvent(new Event('input',{bubbles:true}));
}
function handleQtyInput(input){
  const max=Number(input.max||99);let value=Number(input.value);
  if(!Number.isFinite(value)||value<0)value=0;
  value=Math.min(max,Math.floor(value));input.value=String(value);
  const box=input.closest('.question-box');
  if(box&&input.dataset.qtyRole==='product')syncProductOptionAvailability(box);
  updateLiveTotal();
}
function syncProductOptionAvailability(box){
  if(!box)return;
  const productQty=Number(box.querySelector('[data-qty-role="product"]')?.value||0);
  box.querySelectorAll('[data-qty-role="custom"]').forEach(input=>{
    const control=input.closest('.qty-control');
    const buttons=control?control.querySelectorAll('button'):[];
    if(productQty<=0){input.value='0';input.disabled=true;buttons.forEach(b=>b.disabled=true);}
    else{input.disabled=false;buttons.forEach(b=>b.disabled=false);const max=Number(input.max||5);input.value=String(Math.min(max,Math.max(0,Number(input.value||0))));if(buttons[0])buttons[0].disabled=Number(input.value)<=0;if(buttons[1])buttons[1].disabled=Number(input.value)>=max;}
  });
}
function currentAmount(){
  if(!state.activeSurvey)return 0;
  const answers=collectAnswers();let sum=0;
  state.activeSurvey.questions.forEach(q=>{
    const a=answers[q.id];
    if(q.type==='single'||q.type==='dropdown'){const o=(q.options||[]).find(x=>x.id===a);if(o)sum+=Number(o.price||0);}
    else if(q.type==='multi'&&Array.isArray(a)){a.forEach(id=>{const o=(q.options||[]).find(x=>x.id===id);if(o)sum+=Number(o.price||0);});}
    else if(q.type==='items'&&q.itemMode==='product'&&a&&!Array.isArray(a)){
      sum+=Number(q.basePrice||0)*Number(a.productQty||0);
      (a.customizations||[]).forEach(x=>{const o=(q.options||[]).find(y=>y.id===x.optionId);if(o)sum+=Number(o.price||0)*Number(x.qty||0);});
    }
    else if(q.type==='items'&&Array.isArray(a)){a.forEach(x=>{const o=(q.options||[]).find(y=>y.id===x.optionId);if(o)sum+=Number(o.price||0)*Number(x.qty||1);});}
  });
  return sum;
}
function updateLiveTotal(){const el=$('liveTotal');if(el)el.textContent=money(currentAmount())}


async function submitCurrentSurvey(){
  const profile={name:$('profileName').value.trim(),phone:$('profilePhone').value.trim()};
  rememberIdentity(profile);
  if(!profile.name||!profile.phone){toast('請填寫姓名及電話');return;}
  const answers=collectAnswers();
  const total=currentAmount();
  const isEdit=!!state.editingResponse;
  if(!confirm(`${isEdit?'確認儲存修改':'確認送出問卷'}？\n姓名：${profile.name}\n金額：${money(total)}`))return;
  setBusy(true);
  try{
    let result;
    if(isEdit)result=await api('editMyResponse',state.activeSurvey.id,profile,state.editingResponse.responseId,answers);
    else result=await api('submitResponse',state.activeSurvey.id,profile,answers);
    if(result.duplicate){rememberIdentity(profile);toast(result.message);openLookup(state.activeSurvey.id);return;}
    if(!result.ok)throw new Error(result.message||'送出失敗');

function formatAnswerForUi(q,a){
  if(a===undefined||a===null||a==='')return '';
  if(q.type==='text'||q.type==='textarea'||q.type==='date')return String(a).trim();
  if(q.type==='number')return String(a);
  if(q.type==='single'||q.type==='dropdown'){const o=(q.options||[]).find(x=>x.id===a);return o?o.label+(Number(o.price||0)?'（'+money(o.price)+'）':''):'';}
  if(q.type==='multi')return (Array.isArray(a)?a:[]).map(id=>(q.options||[]).find(x=>x.id===id)).filter(Boolean).map(o=>o.label+(Number(o.price||0)?'（'+money(o.price)+'）':'')).join('、');
  if(q.type==='items'&&(q.itemMode==='product'||q.basePrice!==undefined||(a&&typeof a==='object'&&!Array.isArray(a)))){
    const obj=a&&typeof a==='object'?a:{};const qty=Number(obj.productQty||0);const parts=[];
    if(qty>0){const price=Number(q.basePrice||0);parts.push(`商品數量：${qty} 份 × ${money(price)} = ${money(qty*price)}`);}
    (Array.isArray(obj.customizations)?obj.customizations:[]).forEach(item=>{const o=(q.options||[]).find(x=>x.id===item.optionId);const n=Number(item.qty||0);if(o&&n>0){const subtotal=Number(o.price||0)*n;parts.push(`${o.label}：${n} 份（${money(o.price||0)}／份，小計 ${money(subtotal)}）`);}});
    if(obj.note)parts.push('備註：'+String(obj.note).trim());
    return parts.join('；');
  }
  if(q.type==='items')return (Array.isArray(a)?a:[]).map(x=>{const o=(q.options||[]).find(y=>y.id===x.optionId);return (o?o.label:x.optionId)+' × '+x.qty+(o&&Number(o.price||0)?'（'+money(o.price)+'/份）':'')+(x.note?'（'+x.note+'）':'');}).join('；');
  if(q.type==='rating')return a===''?'':String(a)+' 分';
  return String(a).trim();
}
function renderFilledAnswersHtml(survey,answers){
  const rows=(survey.questions||[]).map(q=>({q:q,text:formatAnswerForUi(q,answers?answers[q.id]:undefined)})).filter(x=>x.text!==''&&x.text!=null);
  if(!rows.length)return '<p class="tiny muted">沒有其他填寫內容。</p>';
  return rows.map(x=>`<div class="answer-line"><b>${esc(x.q.label)}</b><br>${esc(x.text)}</div>`).join('');
}

function newQuestion(type='text'){
  const q={id:'q'+Math.random().toString(36).slice(2,10),label:'',type:type,required:false,maxQty:20,options:[]};

}

function questionEditorHtml(q,index){
  const typeOptions=[['text','簡答題'],['textarea','段落文字'],['single','單選題'],['multi','多選題'],['dropdown','下拉選單'],['date','日期題'],['number','數字題'],['rating','1～5 分評分'],['items','商品／數量題']];
  const mode=q.itemMode||(q.basePrice!==undefined?'product':'legacy');
  const itemProduct=q.type==='items'&&mode==='product';
  const itemLegacy=q.type==='items'&&mode!=='product';
  let extra='';
  if(itemProduct){
    extra=`<div class="field"><label>商品單價</label><input class="input qe-base-price" type="number" min="0" step="any" value="${Number(q.basePrice||0)}" placeholder="商品單價"></div>
      <div class="editor-grid"><div class="field"><label>商品最多數量</label><input class="input qe-maxqty" type="number" min="1" max="99" value="${Number(q.maxQty||20)}"></div><div class="field"><label>商品備註</label><label class="checkline" style="padding:12px 0"><input class="qe-allow-note" type="checkbox" ${q.allowNote!==false?'checked':''}> 允許填寫備註</label></div></div>
      <div class="field"><label>客製化／加購選項</label><div class="qe-options">${(q.options||[]).map(o=>optionEditorHtml(o,true)).join('')}</div><button class="btn btn-plain btn-block" onclick="addOption('${esc(q.id)}')">＋ 新增客製化選項</button><p class="tiny muted">例如加飯、加肉、加蛋、少冰。每個選項可設定自己的價格（可填 0 元）及最多數量。</p></div>`;
  } else if(itemLegacy){
    extra=`<div class="notice">這是舊版商品題。為保留舊問卷的商品與回覆資料，暫時沿用舊題型。新建立的商品／數量題會使用「題目名稱＝商品名稱」的新格式。</div><div class="field"><label>舊版每個商品選項最多數量</label><input class="input qe-maxqty" type="number" min="1" max="99" value="${Number(q.maxQty||20)}"></div><div class="field"><label>舊版商品選項</label><div class="qe-options">${(q.options||[]).map(o=>optionEditorHtml(o,false)).join('')}</div><button class="btn btn-plain btn-block" onclick="addOption('${esc(q.id)}')">＋ 新增舊版商品選項</button></div>`;
  } else if(['single','multi','dropdown'].includes(q.type)){
    extra=`<div class="field"><label>選項設定（價格可填 0）</label><div class="qe-options">${(q.options||[]).map(o=>optionEditorHtml(o,false)).join('')}</div><button class="btn btn-plain btn-block" onclick="addOption('${esc(q.id)}')">＋ 新增選項</button><p class="tiny muted">價格用於需要計價的選項；一般調查保持 0 即可。</p></div>`;
  }
  return `<div class="question-editor" data-qid="${esc(q.id)}" data-index="${index}" data-item-mode="${esc(mode)}"><div class="editor-head"><strong>第 ${index+1} 題</strong><button class="mini-btn" style="padding:7px 10px" onclick="removeQuestion('${esc(q.id)}')">刪除</button></div><div class="field"><label>${q.type==='items'?'商品名稱／題目名稱':'題目名稱'}</label><input class="input qe-label" maxlength="160" value="${esc(q.label)}" placeholder="${q.type==='items'?'例如：香煎雞腿便當':'請輸入題目'}"></div><div class="editor-grid"><div class="field"><label>題目類型</label><select class="select qe-type" onchange="changeQuestionType('${esc(q.id)}',this.value)">${typeOptions.map(x=>`<option value="${x[0]}" ${q.type===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field"><label>填寫規則</label><label class="checkline" style="padding:12px 0"><input class="qe-required" type="checkbox" ${q.required?'checked':''}> 必填</label></div></div>${extra}</div>`;
}
function optionEditorHtml(o,isCustom=false){
  if(isCustom)return `<div class="option-editor custom-option-editor" data-option-id="${esc(o.id)}"><input class="qe-option-label" maxlength="120" value="${esc(o.label)}" placeholder="客製化名稱"><input class="qe-option-price" type="number" min="0" step="any" value="${Number(o.price||0)}" placeholder="單價"><input class="qe-option-maxqty" type="number" min="1" max="99" value="${Number(o.maxQty||5)}" placeholder="上限"><button class="mini-btn" onclick="this.parentNode.remove()">×</button></div>`;
  return `<div class="option-editor" data-option-id="${esc(o.id)}"><input class="qe-option-label" maxlength="120" value="${esc(o.label)}" placeholder="選項名稱"><input class="qe-option-price" type="number" min="0" step="any" value="${Number(o.price||0)}" placeholder="價格"><button class="mini-btn" onclick="this.parentNode.remove()">×</button></div>`;
}


function readBuilderDraft(){
  const questions=[];
  document.querySelectorAll('#questionEditors .question-editor').forEach(box=>{
    const type=box.querySelector('.qe-type').value;
    const itemMode=box.dataset.itemMode||'product';
    const q={id:box.dataset.qid,label:box.querySelector('.qe-label').value.trim(),type,required:box.querySelector('.qe-required').checked,maxQty:Number(box.querySelector('.qe-maxqty')?.value||20),options:[]};
    if(type==='items'){
      q.itemMode=itemMode;
      if(itemMode==='product'){
        q.basePrice=Number(box.querySelector('.qe-base-price')?.value||0);
        q.allowNote=box.querySelector('.qe-allow-note')?.checked!==false;
        box.querySelectorAll('.option-editor').forEach(op=>q.options.push({id:op.dataset.optionId,label:op.querySelector('.qe-option-label').value.trim(),price:Number(op.querySelector('.qe-option-price').value||0),maxQty:Number(op.querySelector('.qe-option-maxqty')?.value||5)}));
      }else{
        box.querySelectorAll('.option-editor').forEach(op=>q.options.push({id:op.dataset.optionId,label:op.querySelector('.qe-option-label').value.trim(),price:Number(op.querySelector('.qe-option-price').value||0)}));
      }
    }else{
      box.querySelectorAll('.option-editor').forEach(op=>q.options.push({id:op.dataset.optionId,label:op.querySelector('.qe-option-label').value.trim(),price:Number(op.querySelector('.qe-option-price').value||0)}));
    }
    questions.push(q);
  });
  return {title:$('builderTitle').value.trim(),description:$('builderDescription').value.trim(),allowEdit:$('builderAllowEdit').checked,questions};
}


function addQuestion(){const draft=readBuilderDraft();draft.questions.push(newQuestion($('newQuestionType').value));state.editDraft=draft;renderBuilder()}
function removeQuestion(id){const draft=readBuilderDraft();draft.questions=draft.questions.filter(q=>q.id!==id);if(!draft.questions.length)draft.questions.push(newQuestion('text'));state.editDraft=draft;renderBuilder()}
function changeQuestionType(id,type){
  const draft=readBuilderDraft();const q=draft.questions.find(x=>x.id===id);if(!q)return;
  const oldType=q.type;q.type=type;
  if(type==='items'&&oldType!=='items'){q.itemMode='product';q.basePrice=0;q.maxQty=20;q.allowNote=true;q.options=[];}
  else if(type!=='items'){delete q.itemMode;delete q.basePrice;delete q.allowNote;}
  if(['single','multi','dropdown'].includes(type)&&!q.options.length)q.options=[{id:'o'+Math.random().toString(36).slice(2,8),label:'選項一',price:0},{id:'o'+Math.random().toString(36).slice(2,8),label:'選項二',price:0}];
  if(type==='items'&&q.itemMode==='product')q.options=q.options||[];
  state.editDraft=draft;renderBuilder();
}
function addOption(id){
  const draft=readBuilderDraft();const q=draft.questions.find(x=>x.id===id);if(!q)return;
  if(q.type==='items'&&q.itemMode==='product')q.options.push({id:'o'+Math.random().toString(36).slice(2,8),label:'加飯',price:0,maxQty:5});
  else q.options.push({id:'o'+Math.random().toString(36).slice(2,8),label:'新選項',price:0});
  state.editDraft=draft;renderBuilder();
}
async function saveBuilder(){
  const draft=readBuilderDraft();
  if(!draft.title){toast('請填寫問卷標題');return;}
  if(!draft.questions.length){toast('至少需要一個題目');return;}
  if(draft.questions.some(q=>!q.label)){toast('請填寫每一題的名稱');return;}
  for(const q of draft.questions){
    if(['single','multi','dropdown'].includes(q.type)&&(!q.options.length||q.options.some(o=>!o.label))){toast('選項題至少需要一個選項，而且選項名稱不可空白');return;}
    if(q.type==='items'&&q.itemMode==='product'){
      if(!Number.isFinite(q.basePrice)||q.basePrice<0){toast('商品單價必須是 0 或正數');return;}
      if(!Number.isInteger(q.maxQty)||q.maxQty<1||q.maxQty>99){toast('商品最多數量必須設定為 1 至 99 的整數');return;}
      if(q.options.some(o=>!o.label||!Number.isFinite(o.price)||o.price<0||!Number.isInteger(o.maxQty)||o.maxQty<1||o.maxQty>99)){toast('請檢查客製化選項名稱、價格及數量上限');return;}
    }
    if(q.type==='items'&&q.itemMode==='legacy'&&(!q.options.length||q.options.some(o=>!o.label))){toast('舊版商品題至少需要一個有效商品選項');return;}
  }
  setBusy(true);try{let r;if(state.editSurveyId)r=await api('saveSurvey',state.token,state.editSurveyId,draft);else r=await api('createSurvey',state.token,Object.assign({},draft,{initialStatus:'開放中'}));toast(r.message);state.editDraft=null;state.editSurveyId='';await loadAdmin()}catch(err){toast(err.message)}finally{setBusy(false)}
}
async function toggleSurveyStatus(id,current){const next=current==='開放中'?'已結束':'開放中';const action=next==='開放中'?'重新開放':'結束';if(!confirm(`確定要${action}這份問卷「${next}」？`))return;setBusy(true);try{const r=await api('setSurveyStatus',state.token,id,next);toast(r.message);await loadAdmin()}catch(err){toast(err.message)}finally{setBusy(false)}}
async function copySurvey(id){if(!confirm('複製這份問卷的題目、商品及設定，建立全新的問卷與工作表？\n舊問卷的填寫結果不會複製。新問卷預設未開放。'))return;setBusy(true);try{const r=await api('copySurvey',state.token,id);toast(r.message+'：'+r.title);await loadAdmin()}catch(err){toast(err.message)}finally{setBusy(false)}}
async function viewResponses(id){setBusy(true);try{const r=await api('getAdminSurvey',state.token,id);state.adminSurvey=r.survey;state.adminResponses=r.responses;state.adminTab='responses';renderResponses()}catch(err){toast(err.message)}finally{setBusy(false)}}
function buildShopOrderSummary(s, list) {
  const rows = [];
  (s.questions || []).forEach(q => {
    if (q.type === 'items' && (q.itemMode === 'product' || q.basePrice !== undefined)) {
      const productQty = list.reduce((sum, response) => {
        const answer = response.answers && response.answers[q.id];
        return sum + (answer && !Array.isArray(answer) ? Number(answer.productQty || 0) : 0);
      }, 0);
      const basePrice = Number(q.basePrice || 0);
      if (productQty > 0) {
        rows.push({
          kind: '商品', name: q.label, option: '', price: basePrice,
          qty: productQty, amount: basePrice * productQty
        });
      }
      (q.options || []).forEach(option => {
        const qty = list.reduce((sum, response) => {
          const answer = response.answers && response.answers[q.id];
          const selected = answer && !Array.isArray(answer)
            ? (answer.customizations || []).find(item => item.optionId === option.id)
            : null;
          return sum + (selected ? Number(selected.qty || 0) : 0);
        }, 0);
        if (qty > 0) {
          const price = Number(option.price || 0);
          rows.push({
            kind: '客製化／加購', name: q.label, option: option.label,
            price, qty, amount: price * qty
          });
        }
      });
    } else if (q.type === 'items') {
      // 舊版商品／數量題：保留歷史資料統計方式。
      (q.options || []).forEach(option => {
        const qty = list.reduce((sum, response) => {
          const answer = response.answers && response.answers[q.id];
          const selectedItems = Array.isArray(answer) ? answer : [];
          const selected = selectedItems.find(item => item.optionId === option.id);
          return sum + (selected ? Number(selected.qty || 0) : 0);
        }, 0);
        if (qty > 0) {
          const price = Number(option.price || 0);
          rows.push({
            kind: '商品（舊版）', name: q.label, option: option.label,
            price, qty, amount: price * qty
          });
        }
      });
    } else if (['single', 'dropdown', 'multi'].includes(q.type)) {
      (q.options || []).filter(option => Number(option.price || 0) > 0).forEach(option => {
        const qty = list.reduce((sum, response) => {
          const answer = response.answers && response.answers[q.id];
          if (q.type === 'multi') {
            return sum + (Array.isArray(answer) && answer.includes(option.id) ? 1 : 0);
          }
          return sum + (answer === option.id ? 1 : 0);
        }, 0);
        if (qty > 0) {
          const price = Number(option.price || 0);
          rows.push({
            kind: '計價選項', name: q.label, option: option.label,
            price, qty, amount: price * qty
          });
        }
      });
    }
  });
  return {
    rows,
    total: list.reduce((sum, response) => sum + Number(response.amount || 0), 0)
  };
}
function renderShopOrderSummaryHtml(summary){
  if(!summary.rows.length)return `<div class="notice">目前沒有商品或計價項目。<br>回覆總金額：<b>${money(summary.total)}</b></div>`;
  return `<div class="shop-summary-wrap"><table class="shop-summary"><thead><tr><th>類型</th><th>商品／題目</th><th>客製化內容</th><th>單價</th><th>數量</th><th>金額</th></tr></thead><tbody>${summary.rows.map(r=>`<tr><td>${esc(r.kind)}</td><td>${esc(r.name)}</td><td>${esc(r.option)}</td><td>${money(r.price)}</td><td>${r.qty}</td><td class="money-cell">${money(r.amount)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="5">全部回覆總金額</td><td class="money-cell">${money(summary.total)}</td></tr></tfoot></table></div>`;
}
function renderResponses(){
  const s=state.adminSurvey,list=state.adminResponses||[];const total=list.reduce((n,r)=>n+Number(r.amount||0),0);
  const stats=s.questions.map(q=>{
    const counts={};
    list.forEach(r=>{const a=r.answers[q.id];if(q.type==='single'||q.type==='dropdown'){const o=(q.options||[]).find(x=>x.id===a);if(o)counts[o.label]=(counts[o.label]||0)+1}else if(q.type==='multi'){(Array.isArray(a)?a:[]).forEach(id=>{const o=(q.options||[]).find(x=>x.id===id);if(o)counts[o.label]=(counts[o.label]||0)+1})}});
    return Object.keys(counts).length?`<div class="history-item"><b>${esc(q.label)}</b>${Object.entries(counts).map(([k,v])=>`<div class="answer-line">${esc(k)}：${v}</div>`).join('')}</div>`:'';
  }).join('');
  const shopSummary=buildShopOrderSummary(s,list);
  $('main').innerHTML=`<button class="back" onclick="loadAdmin()">← 返回管理中心</button><section class="hero"><h2>${esc(s.title)}</h2><p>問卷回覆及統計資料</p></section><div class="card"><div class="stat-grid"><div class="stat"><b>${list.length}</b><span>回覆筆數</span></div><div class="stat"><b>${money(total)}</b><span>金額合計</span></div><div class="stat"><b>${s.status==='開放中'?'開放中':'已結束'}</b><span>問卷狀態</span></div></div><button class="btn btn-green btn-block" style="margin-top:12px" onclick="exportSurveyExcel('${esc(s.id)}')">下載 Excel（個人回覆＋店家統整）</button></div><div class="card"><h3>店家下單統整（含金額）</h3>${renderShopOrderSummaryHtml(shopSummary)}</div><div class="card"><h3>一般選項統計</h3>${stats||'<div class="muted small">目前沒有一般選項題的統計資料。</div>'}</div><div class="card"><h3>個別回覆</h3>${list.length?list.map(r=>`<div class="order-card"><div class="order-top"><b>${esc(r.name)}（電話末四碼 ${esc(r.phoneLast4)}）</b><span class="amount">${money(r.amount)}</span></div><div class="tiny muted">${esc(dateText(r.submittedAt))} ・ ${esc(r.responseId)}</div>${renderFilledAnswersHtml(s,r.answers)}<button class="btn btn-secondary btn-block" style="margin-top:10px" onclick="adminEditResponse('${esc(r.responseId)}')">管理者修改這筆回覆</button></div>`).join(''):'<div class="notice">目前沒有回覆。</div>'}</div>`;
}
function adminEditResponse(responseId){const r=state.adminResponses.find(x=>x.responseId===responseId);if(!r)return;const s=state.adminSurvey;showModal(`<h3>管理者修改回覆</h3><p class="small muted">${esc(r.name)} ・ ${esc(responseId)}</p><div id="adminQuestionForm">${s.questions.map(q=>renderQuestion(q,r.answers)).join('')}</div><div class="btn-row"><button class="btn btn-primary" onclick="saveAdminResponse('${esc(responseId)}')">儲存</button><button class="btn btn-plain" onclick="closeModal()">取消</button></div>`);document.querySelectorAll('#adminQuestionForm .question-box[data-item-mode="product"]').forEach(syncProductOptionAvailability)}
async function saveAdminResponse(id){const answers=collectAnswersFrom('#adminQuestionForm');setBusy(true);try{const r=await api('adminUpdateResponse',state.token,state.adminSurvey.id,id,answers);toast(r.message);closeModal();await viewResponses(state.adminSurvey.id)}catch(err){toast(err.message)}finally{setBusy(false)}}

async function exportSurveyExcel(id){setBusy(true);try{const r=await api('exportSurveyXlsx',state.token,id);const raw=atob(r.base64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=r.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Excel 匯出完成')}catch(err){toast('匯出失敗：'+err.message)}finally{setBusy(false)}}
function renderBackup(){const s=state.adminOverview.settings||{};const recoveryWarning=state.adminOverview.configCorrupted?`<div class="notice error">目前 JSON 設定檔無法讀取：${esc(state.adminOverview.configError||'格式錯誤')}。請從下方選擇有效的歷史備份進行還原；此時不要建立新問卷或修改備份設定。</div>`:'';$('adminContent').innerHTML=`<div class="card"><h3>☁️ 雲端備份與還原</h3>${recoveryWarning}<div class="notice success">設定自動備份：每次成功修改問卷設定前，自動保存上一版。每天凌晨約 3 點另建立完整備份。</div><div class="field"><label class="checkline"><input id="autoBackup" type="checkbox" ${s.autoBackup!==false?'checked':''}> 啟用自動雲端備份</label></div><div class="editor-grid"><div class="field"><label>設定版本保留數</label><input id="configKeep" type="number" class="input" min="10" max="100" value="${Number(s.configBackupKeep||50)}"></div><div class="field"><label>完整備份保留數</label><input id="fullKeep" type="number" class="input" min="3" max="30" value="${Number(s.fullBackupKeep||10)}"></div></div><button class="btn btn-secondary btn-block" onclick="saveBackupPrefs()">儲存備份設定</button><div class="divider"></div><div class="notice">最近完整備份：${esc(s.lastBackupAt||'尚未備份')}<br>手動備份會包含全部問卷設定及填寫結果。</div><button class="btn btn-primary btn-block" style="margin-top:10px" onclick="runManualBackup()">☁ 立即雲端備份</button><button class="btn btn-plain btn-block" style="margin-top:8px" onclick="refreshBackupList()">重新整理備份清單</button><div id="backupList" class="small muted" style="margin-top:12px">尚未載入備份清單。</div></div><div class="card"><h3>雲端檔案</h3><div class="btn-row"><a class="btn btn-plain" style="text-decoration:none;text-align:center" target="_blank" href="${esc(s.resultSpreadsheetUrl||'#')}">開啟問卷結果試算表</a><a class="btn btn-plain" style="text-decoration:none;text-align:center" target="_blank" href="${esc(s.jsonFileUrl||'#')}">開啟 JSON 設定</a></div></div>`;refreshBackupList()}
async function saveBackupPrefs(){setBusy(true);try{const r=await api('saveBackupSettings',state.token,{autoBackup:$('autoBackup').checked,configBackupKeep:Number($('configKeep').value),fullBackupKeep:Number($('fullKeep').value)});toast(r.message);await loadAdmin();state.adminTab='backup';renderAdmin()}catch(err){toast(err.message)}finally{setBusy(false)}}
async function runManualBackup(){setBusy(true);try{const r=await api('backupNow',state.token);toast(r.message);await refreshBackupList();await loadAdmin();state.adminTab='backup';renderAdmin()}catch(err){toast(err.message)}finally{setBusy(false)}}
async function refreshBackupList(){const el=$('backupList');if(!el)return;el.innerHTML='正在讀取雲端備份…';try{const list=await api('listBackups',state.token);el.innerHTML=list.length?list.map(b=>`<div class="history-item"><div class="order-top"><b>${esc(b.type)}</b><span class="badge">${esc(dateText(b.createdAt))}</span></div><div class="tiny muted">${esc(b.description)} ・ ${Math.round(b.size/1024)} KB</div><button class="btn btn-plain btn-block" style="margin-top:8px" onclick="previewRestore('${esc(b.id)}')">預覽／還原此版本</button></div>`).join(''):'<div class="notice">目前還沒有備份版本。</div>'}catch(err){el.innerHTML=`<div class="notice error">${esc(err.message)}</div>`}}
async function previewRestore(id){setBusy(true);try{const p=await api('previewBackup',state.token,id);showModal(`<h3>備份版本預覽</h3><div class="notice">建立時間：${esc(dateText(p.createdAt))}<br>備份類型：${esc(p.type)}<br>問卷數：${p.surveyCount}<br>回覆數：${p.responseCount==null?'僅設定資料':p.responseCount}<br>問卷：${esc((p.titles||[]).join('、'))}</div><p class="small muted">還原前會自動保護目前資料。設定還原不會覆蓋現有回覆；完整還原會將該備份時間的回覆資料寫回對應工作表。</p><div class="btn-row"><button class="btn btn-primary" onclick="restoreSelected('${esc(id)}','settings')">只還原設定</button>${p.canRestoreFull?`<button class="btn btn-danger" onclick="restoreSelected('${esc(id)}','full')">完整還原</button>`:''}</div><button class="btn btn-plain btn-block" style="margin-top:8px" onclick="closeModal()">取消</button>`)}catch(err){toast(err.message)}finally{setBusy(false)}}
async function restoreSelected(id,mode){const message=mode==='full'?'完整還原會以備份當時的資料取代對應問卷工作表目前的回覆。':'只還原問卷設定，保留目前所有填寫結果。';if(!confirm(message+'\n確定繼續？'))return;setBusy(true);try{const r=await api('restoreBackup',state.token,id,mode);closeModal();toast(r.message);await loadAdmin();state.adminTab='backup';renderAdmin()}catch(err){toast(err.message)}finally{setBusy(false)}}
function renderSecurity(){$('adminContent').innerHTML=`<div class="card"><h3>🔐 管理者密碼</h3><p class="small muted">密碼只儲存在 GAS Script Properties，前端及 JSON 設定檔不會保存密碼。</p><div class="field"><label>新密碼（8 至 64 個字元）</label><input id="newPassword" class="input" type="password" maxlength="64" autocomplete="new-password"></div><div class="field"><label>再次輸入新密碼</label><input id="newPassword2" class="input" type="password" maxlength="64" autocomplete="new-password"></div><button class="btn btn-primary btn-block" onclick="saveNewPassword()">修改管理者密碼</button></div>`}
async function saveNewPassword(){const a=$('newPassword').value,b=$('newPassword2').value;if(a.length<8){toast('新密碼至少 8 個字元');return}if(a!==b){toast('兩次輸入的密碼不一致');return}setBusy(true);try{const r=await api('changeAdminPassword',state.token,a);toast(r.message);$('newPassword').value='';$('newPassword2').value=''}catch(err){toast(err.message)}finally{setBusy(false)}}

initPwaInstall();
setupBridge();
</script>
