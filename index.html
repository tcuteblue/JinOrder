/* ===== 精緻按鈕與介面層次 ===== */
:root{
  --gold-deep:#d98518;
  --orange-deep:#dc6c2f;
  --pink-deep:#dd647e;
  --green-deep:#558d54;
  --button-shadow:0 5px 0 rgba(180,112,29,.24),0 10px 20px rgba(123,76,28,.12);
}
body{
  background:
    radial-gradient(circle at 8% 4%,rgba(255,205,90,.22),transparent 25rem),
    radial-gradient(circle at 94% 17%,rgba(255,145,132,.14),transparent 22rem),
    linear-gradient(180deg,#fff0c9 0,#fffaf1 300px,#fffaf1 100%);
}
button{
  position:relative;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  transition:transform .16s ease,box-shadow .16s ease,filter .16s ease,background .16s ease;
  outline:none;
}
button:focus-visible{outline:3px solid rgba(238,166,43,.45);outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.58;filter:saturate(.65);transform:none!important;box-shadow:none!important}
.primary{
  color:#fff;
  background:linear-gradient(135deg,#ffc83f 0%,#ffa12f 48%,#f17d39 100%);
  border:1px solid rgba(255,255,255,.72);
  border-radius:15px;
  padding:12px 17px;
  font-weight:850;
  letter-spacing:.02em;
  text-shadow:0 1px 1px rgba(125,67,15,.18);
  box-shadow:0 5px 0 #d77a28,0 9px 18px rgba(216,126,39,.22),inset 0 1px 0 rgba(255,255,255,.5);
}
.primary:hover{transform:translateY(-2px);filter:saturate(1.08);box-shadow:0 7px 0 #d77a28,0 13px 22px rgba(216,126,39,.25),inset 0 1px 0 rgba(255,255,255,.55)}
.primary:active{transform:translateY(3px) scale(.985);box-shadow:0 2px 0 #d77a28,0 4px 9px rgba(216,126,39,.16),inset 0 2px 5px rgba(130,67,16,.12)}
.secondary{
  color:#865018;
  background:linear-gradient(180deg,#fff8e8,#ffedc7);
  border:1px solid #f2d18c;
  border-radius:14px;
  padding:11px 15px;
  font-weight:800;
  box-shadow:0 4px 0 #e9d29f,0 7px 14px rgba(135,93,36,.08),inset 0 1px 0 #fff;
}
.secondary:hover{transform:translateY(-2px);background:linear-gradient(180deg,#fffaf0,#ffe7b0);box-shadow:0 6px 0 #e9d29f,0 10px 16px rgba(135,93,36,.12)}
.secondary:active{transform:translateY(2px);box-shadow:0 1px 0 #e9d29f}
.soft{
  color:#76563b;
  background:linear-gradient(180deg,#fff,#fff8ed);
  border:1px solid #eadcc8;
  border-radius:12px;
  padding:9px 12px;
  font-weight:750;
  box-shadow:0 3px 0 #e8dfd2,0 5px 10px rgba(94,70,44,.055);
}
.soft:hover{transform:translateY(-1px);background:#fffdf8;box-shadow:0 4px 0 #e8dfd2,0 7px 12px rgba(94,70,44,.08)}
.soft:active{transform:translateY(2px);box-shadow:0 1px 0 #e8dfd2}
.danger{
  color:#b64b4e;
  background:linear-gradient(180deg,#fff5f2,#ffe9e5);
  border:1px solid #f2cbc4;
  border-radius:12px;
  padding:9px 12px;
  font-weight:800;
  box-shadow:0 3px 0 #eac9c2,0 5px 10px rgba(175,79,69,.07);
}
.danger:hover{transform:translateY(-1px);background:linear-gradient(180deg,#fff8f5,#ffdfd8)}
.danger:active{transform:translateY(2px);box-shadow:0 1px 0 #eac9c2}
.small{font-size:13px;padding:8px 11px;border-radius:11px}
.icon-btn{
  min-width:44px;min-height:44px;
  display:inline-grid;place-items:center;
  background:linear-gradient(180deg,#fff,#fff8ea);
  border:1px solid #f0dfc2;border-radius:15px;
  color:#835c2f;box-shadow:0 4px 0 #ebdfcc,0 7px 13px rgba(103,69,30,.08);
}
.icon-btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #ebdfcc,0 10px 16px rgba(103,69,30,.1)}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #ebdfcc}
.install-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;padding:0 15px;border-radius:15px;
  color:#fff;background:linear-gradient(135deg,#f7bd2f,#f18a39 72%,#e97854);
  border:1px solid rgba(255,255,255,.75);font-size:13px;font-weight:900;letter-spacing:.02em;
  box-shadow:0 4px 0 #d77931,0 8px 15px rgba(216,126,39,.2),inset 0 1px 0 rgba(255,255,255,.45);
}
.install-btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #d77931,0 11px 18px rgba(216,126,39,.24)}
.install-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #d77931}
.install-symbol{font-size:19px;line-height:1;font-weight:900}
.panel{
  border:1px solid rgba(239,220,189,.9);
  border-radius:23px;
  box-shadow:0 9px 26px rgba(115,78,35,.085),inset 0 1px 0 rgba(255,255,255,.9);
}
.section-head h2,.section-head h3{letter-spacing:.015em}
.child-card{
  position:relative;overflow:hidden;
  border:1px solid #f1d8a8;
  border-radius:19px;
  background:linear-gradient(145deg,#fffefa 0%,#fff8e9 58%,#fff0d5 100%);
  box-shadow:0 4px 0 #f0dfc2,0 8px 16px rgba(117,78,36,.075),inset 0 1px 0 #fff;
}
.child-card:after{content:"›";font-size:25px;font-weight:800;color:#d89a38;margin-left:auto;opacity:.8;transition:transform .16s ease}
.child-card:hover{transform:translateY(-3px);border-color:#eec56f;box-shadow:0 7px 0 #efd9ad,0 13px 20px rgba(117,78,36,.11),inset 0 1px 0 #fff}
.child-card:hover:after{transform:translateX(3px)}
.child-card:active{transform:translateY(2px) scale(.99);box-shadow:0 2px 0 #efd9ad}
.child-avatar{background:linear-gradient(145deg,#ffe99e,#ffd36b);box-shadow:inset 0 2px 3px rgba(255,255,255,.7),0 3px 8px rgba(196,139,42,.12)}
.tab{padding:10px 16px;border:1px solid #eedfc9;background:linear-gradient(180deg,#fff,#fffaf2);box-shadow:0 3px 0 #ede3d5,0 5px 10px rgba(96,70,41,.045);transition:all .16s ease}
.tab:hover{transform:translateY(-1px);border-color:#e9c779}
.tab:active{transform:translateY(1px);box-shadow:0 1px 0 #ede3d5}
.tab.active{color:#754707;border-color:#f2c75f;background:linear-gradient(135deg,#ffe9a5,#ffd36c);box-shadow:0 3px 0 #e9b84a,0 7px 13px rgba(223,166,47,.16),inset 0 1px 0 rgba(255,255,255,.75)}
.setting-tile{
  border:1px solid #f0dfc2;
  background:linear-gradient(145deg,#fffefa,#fff7e9);
  border-radius:18px;padding:16px;text-align:left;color:var(--ink);
  box-shadow:0 4px 0 #f0e4d0,0 8px 14px rgba(105,74,39,.06),inset 0 1px 0 #fff;
}
.setting-tile:hover{transform:translateY(-2px);border-color:#eecb83;box-shadow:0 6px 0 #f0e4d0,0 12px 18px rgba(105,74,39,.1)}
.setting-tile:active{transform:translateY(2px);box-shadow:0 1px 0 #f0e4d0}
.summary-card{box-shadow:inset 0 3px 0 rgba(246,190,83,.38),0 4px 12px rgba(111,78,42,.04);background:linear-gradient(145deg,#fffefa,#fffaf1)}
.record,.note-card{box-shadow:0 3px 10px rgba(103,69,30,.045)}
.record-actions{gap:8px}
.field input,.field select,.field textarea,.month-picker{box-shadow:inset 0 1px 2px rgba(103,69,30,.035);transition:border-color .15s ease,box-shadow .15s ease}
.modal{border:1px solid #f0dfc2;box-shadow:0 22px 65px rgba(57,37,22,.28),inset 0 1px 0 #fff}
.modal-actions{padding-top:4px}
.install-guide{color:#68503a;line-height:1.8;font-size:14px}.install-guide ol{padding-left:22px}.install-guide li{margin:8px 0}.install-guide strong{color:#a65e1d}
.toast{box-shadow:0 9px 25px rgba(48,34,23,.22);border:1px solid rgba(255,255,255,.15)}
@media(max-width:620px){
  .install-btn{min-height:42px;padding:0 11px;font-size:12px;border-radius:14px}

  .tab{padding:9px 13px}

@media(prefers-reduced-motion:reduce){button{transition:none!important}}

</head>
<body>
<div id="appRoot" class="app">
  <div id="loading" class="empty"><div class="busy-spinner"></div><strong>正在載入工作室資料……</strong><div class="helper">首次使用會讀取雲端資料；下次會先顯示本機上次同步資料。</div></div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="busyRoot"></div>
<input id="localFileInput" type="file" accept="application/json,.json" class="hidden">
<script>
'use strict';

// ===== 專案連線設定：此網址對應本專案專用 GAS =====
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwW46ovnM9y_jkwO9sBlSPj9DLkj7NRj--1SVusZhbLE3X1F_mteQ7A8Z5hAEr0EP8S/exec';
const APP_NAME = '工作室收入記帳';
const $ = (selector, root=document) => root.querySelector(selector);
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const money = value => 'NT$' + Number(value || 0).toLocaleString('zh-TW', {maximumFractionDigits:0});
const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const thisMonth = () => today().slice(0,7);
const uid = prefix => prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
let state = {children:[],transactions:[],notes:[],categories:[],settings:{}};
let currentChildId = null;
let currentPage = 'home';
let analysisChildId = '*';
let analysisMonth = thisMonth();
let analysisStartMonth = buildAnalysisMonths(thisMonth(),6)[0];
let analysisEndMonth = thisMonth();
let childTab = 'ledger';
let selectedMonth = thisMonth();
let showArchived = false;
let toastTimer = null;
let requestCounter = 0;
let deferredInstallPrompt = null;
const LOCAL_CACHE_KEY = 'studioIncomeLedgerCache.v1';
let cloudReady = false;
let localCacheAvailable = false;
let syncStatusText = '首次載入雲端資料…';
let syncStatusKind = 'loading';
let historyInitialized = false;

function saveLocalCache() {
  try {
    localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({savedAt:new Date().toISOString(),state}));
    localCacheAvailable = true;
  } catch (err) {
    // 本機空間不足或瀏覽器限制時，不影響雲端資料操作。
    console.warn('本機快取儲存失敗', err);
  }
}
function readLocalCache() {
  try {
    const raw=localStorage.getItem(LOCAL_CACHE_KEY);
    if(!raw)return null;
    const parsed=JSON.parse(raw);
    if(!parsed || !parsed.state || typeof parsed.state!=='object')return null;
    return parsed;
  } catch (err) {
    console.warn('讀取本機快取失敗', err);
    return null;
  }
}
function setSyncStatus(message,kind='loading') {
  syncStatusText=message;syncStatusKind=kind;
  const el=$('#syncStatus');
  if(el){el.textContent=message;el.dataset.kind=kind;}
}
function routeSnapshot() {
  return {__studioRoute:true,page:currentPage,childId:currentChildId,childTab,selectedMonth,showArchived,analysisChildId,analysisMonth,analysisStartMonth,analysisEndMonth};
}
function pushRouteHistory() {
  try { history.pushState(routeSnapshot(), '', location.href); } catch (_) {}
}
function initializeAppHistory() {
  if(historyInitialized)return;historyInitialized=true;
  try {
    // 保留瀏覽器原本的上一頁，並在程式根頁放一個退出確認關卡。
    history.replaceState({__studioExitGate:true}, '', location.href);
    history.pushState({__studioRootGuard:true}, '', location.href);
  } catch (_) {}
}
function restoreRoute(route) {
  if(!route || route.__studioRootGuard) {
    currentPage='home';currentChildId=null;showArchived=false;childTab='ledger';selectedMonth=thisMonth();
  } else {
    currentPage=route.page||'home';currentChildId=route.childId||null;
    childTab=route.childTab||'ledger';selectedMonth=route.selectedMonth||thisMonth();
    showArchived=!!route.showArchived;analysisChildId=route.analysisChildId||'*';analysisMonth=route.analysisMonth||thisMonth();analysisStartMonth=route.analysisStartMonth||buildAnalysisMonths(analysisMonth,6)[0];analysisEndMonth=route.analysisEndMonth||analysisMonth;
  }
  render();
}
function showExitPrompt() {
  openModal('要離開工作室收入記帳嗎？',`<p class="helper" style="font-size:14px">按「離開」返回上一個頁面；按「取消」繼續使用工作室收入記帳。</p><div class="modal-actions"><button type="button" class="soft" data-action="stay-app">取消</button><button type="button" class="primary" data-action="exit-app">離開</button></div>`);
}
window.addEventListener('popstate',e=>{
  if($('#modalRoot')?.firstElementChild){
    closeModal();
    try{history.pushState(routeSnapshot(), '', location.href);}catch(_){}
    return;
  }
  if(e.state?.__studioExitGate){
    restoreRoute({page:'home'});showExitPrompt();return;
  }
  if(e.state?.__studioRootGuard){restoreRoute(e.state);return;}
  if(e.state?.__studioRoute){restoreRoute(e.state);return;}
  // 瀏覽器未保留狀態時，仍回到程式首頁並提供退出確認。
  restoreRoute({page:'home'});showExitPrompt();
});

function base64UrlEncode(text) {
  const bytes = new TextEncoder().encode(text);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function api(action, params={}) {
  return new Promise((resolve,reject) => {
    const callback = '__studioCb' + (++requestCounter) + '_' + Date.now();
    const script = document.createElement('script');
    let done = false;
    const finish = (err, data) => {
      if (done) return; done = true;
      clearTimeout(timer); script.remove(); delete window[callback];
      err ? reject(err) : resolve(data);
    };
    window[callback] = data => finish(null,data);
    const query = new URLSearchParams({action, callback, _:String(Date.now())});
    Object.entries(params).forEach(([k,v]) => query.set(k,String(v)));
    script.onerror = () => finish(new Error('無法連接 GAS，請檢查部署網址及網路。'));
    const timer = setTimeout(() => finish(new Error('雲端連線逾時，請稍後再試。')), 30000);
    script.src = GAS_URL + '?' + query.toString();
    document.head.appendChild(script);
  });
}
async function apiMutation(ops) {
  const data = base64UrlEncode(JSON.stringify({ops}));
  const result = await api('mutate',{data});
  if (!result.ok) throw new Error(result.error || '雲端寫入失敗。');
  if (!result.backupOk) showToast(result.backupMessage || '資料已寫入試算表，但自動備份未完成。');
  try { await loadState(false); }
  catch (refreshErr) { showToast('雲端已回覆寫入成功，但畫面重新讀取失敗；請按重新整理確認最新資料。'); }
  return result;
}
async function loadState(showNotice=true) {
  const result = await api('bootstrap');
  if (!result.ok) throw new Error(result.error || '讀取雲端資料失敗。');
  state = normalizeState(result.state || {});
  cloudReady = true;
  saveLocalCache();
  setSyncStatus('☁️ 雲端資料已同步', 'ok');
  if (showNotice) showToast('雲端資料已同步');
  render();
}
function normalizeState(s) {
  const rawCats=Array.isArray(s.categories)?s.categories:[];
  // 將舊版每位孩童各自的項目合併成全體共用項目；舊識別碼保留為停用別名，供歷史紀錄編輯使用。
  const ordered=rawCats.slice().sort((a,b)=>{
    const aa=(a.active===false||a.active==='false')?1:0, ba=(b.active===false||b.active==='false')?1:0;
    if(aa!==ba)return aa-ba;
    return (String(a.childId||'')==='*'?-1:1)-(String(b.childId||'')==='*'?-1:1);
  });
  const primary=new Map(), categories=[];
  ordered.forEach(c=>{
    const key=String(c.type||'')+'::'+String(c.name||'').trim().toLocaleLowerCase();
    if(!key||key==='::')return;
    if(!primary.has(key)){
      const shared={...c,childId:'*'};primary.set(key,shared);categories.push(shared);
    }else if(primary.get(key).id!==c.id){
      categories.push({...c,childId:'__legacy__',active:false});
    }
  });
  // 預設收入項目：托育費。若雲端尚未建立，前端也會補入選單，確保可立即選用；不覆蓋既有項目。
  const hasChildcareFee=categories.some(c=>c.type==='income'&&String(c.name||'').trim()==='托育費'&&c.active!==false&&c.active!=='false');
  if(!hasChildcareFee){
    const incomeSort=categories.filter(c=>c.type==='income').reduce((max,c)=>Math.max(max,Number(c.sort)||0),0);
    categories.push({id:'cat_childcare_fee',childId:'*',type:'income',name:'托育費',sort:incomeSort+10,active:true});
  }
  return {children:Array.isArray(s.children)?s.children:[],transactions:Array.isArray(s.transactions)?s.transactions:[],notes:Array.isArray(s.notes)?s.notes:[],categories,settings:s.settings||{}};
}
function showToast(message) {
  const root=$('#toastRoot'); root.innerHTML=`<div class="toast">${esc(message)}</div>`;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>root.innerHTML='',3600);
}
function setBusy(button, busy, label) { if(!button)return; if(busy){button.dataset.oldText=button.textContent;button.disabled=true;button.textContent=label||'處理中…';}else{button.disabled=false;button.textContent=button.dataset.oldText||button.textContent;} }
let busyActive=false;
function showBusy(title='正在連接雲端…',detail='請稍候，請勿關閉程式或重複點擊。'){
  busyActive=true;
  $('#busyRoot').innerHTML=`<div class="busy-overlay" role="status" aria-live="polite"><div class="busy-card"><div class="busy-spinner"></div><div class="busy-title">${esc(title)}</div><div class="busy-detail" id="busyDetail">${esc(detail)}</div></div></div>`;
}
function updateBusyDetail(detail){const el=$('#busyDetail');if(el)el.textContent=detail;}
function hideBusy(){busyActive=false;$('#busyRoot').innerHTML='';}
async function withBusy(title,fn,button=null,detail){
  if(busyActive)return;
  setBusy(button,true,'處理中…');showBusy(title,detail);
  try{return await fn();}
  finally{hideBusy();setBusy(button,false);}
}
function render() {
  if(currentPage==='analysis'){renderAnalysis();return;}
  if(currentPage==='settings'){renderSettings();return;}
  if(currentPage==='settlement'){renderSettlement();return;}
  const child = state.children.find(c=>c.id===currentChildId);
  if (currentChildId && child) renderChild(child); else { currentChildId=null; renderHome(); }
}
function shell(content) {
  const root=$('#appRoot');
  root.innerHTML=`
    <header class="topbar">
      <img class="logo" src="${window.__STUDIO_ICON_512__}" alt="工作室收入記帳圖示">
      <div class="brand"><h1>${APP_NAME}</h1><p>把每一份照顧與收穫，好好記錄下來</p></div>
      <div class="top-actions">
        <button class="install-btn" data-action="install" title="安裝工作室收入記帳"><span class="install-symbol">⇩</span><span>安裝 APP</span></button>
        <button class="icon-btn" data-action="analysis" title="收支明細分析">📊</button>
        <button class="icon-btn" data-action="settings" title="設定與備份">⚙️</button>
      </div>
    </header>
    <div id="syncStatus" class="statusline" data-kind="${esc(syncStatusKind)}">${esc(syncStatusText)}</div>
    ${content}
    <div class="footer">工作室收入記帳・專用雲端資料</div>`;
  updateInstallButton();
}
function renderHome() {
  currentPage='home';
  const active=state.children.filter(c=>c.status!=='archived').sort((a,b)=>String(a.name).localeCompare(String(b.name),'zh-TW'));
  const archived=state.children.filter(c=>c.status==='archived').sort((a,b)=>String(a.name).localeCompare(String(b.name),'zh-TW'));
  const list=showArchived?archived:active;
  const income=state.transactions.filter(t=>String(t.date||'').startsWith(thisMonth())&&t.type==='income').reduce((s,t)=>s+Number(t.amount||0),0);
  const expenses=state.transactions.filter(t=>String(t.date||'').startsWith(thisMonth())&&t.type==='expense').reduce((s,t)=>s+Number(t.amount||0),0);
  shell(`
    <section class="panel">
      <div class="section-head"><div><h2>${showArchived?'已離托孩童':'目前收托孩童'}</h2><div class="subtle">${showArchived?'歷史資料完整保留，可隨時恢復收托':'選擇孩童即可查看個別收支與記事'}</div></div></div>
      <div class="home-controls"><button class="primary" data-action="add-child">＋ 新增孩童</button><button class="tab ${!showArchived?'active':''}" data-action="show-active">收托中（${active.length}）</button><button class="tab ${showArchived?'active':''}" data-action="show-archived">已離托（${archived.length}）</button></div>
      ${list.length?`<div class="children-grid">${list.map(c=>`<button class="child-card" data-action="open-child" data-id="${esc(c.id)}"><span class="child-avatar">${showArchived?'📁':'🧸'}</span><span><strong>${esc(c.name)}</strong><small>${showArchived?'已離托・點選查看歷史':'點選進入孩童帳務'}</small></span></button>`).join('')}</div>`:`<div class="empty">${showArchived?'目前沒有已離托的孩童。':'尚未新增孩童，按右上方「新增孩童」開始建立資料。'}</div>`}
    </section>
    <section class="panel"><div class="section-head"><div><h3>本月工作室收支概況</h3><div class="subtle">${thisMonth()}</div></div></div>
      <div class="summary-grid"><div class="summary-card"><span>原始收入</span><strong class="income">${money(income)}</strong></div><div class="summary-card"><span>支出／退費</span><strong class="expense">${money(expenses)}</strong></div><div class="summary-card"><span>原始結餘</span><strong class="net">${money(income-expenses)}</strong></div></div>
      ${renderHomeSettlementSummary(income)}
    </section>
  `);
}
function renderHomeSettlementSummary(monthIncome){
  const month=thisMonth(),d=settlementData(month),c=settlementCalc(month,d);
  return `<div class="home-settlement-block"><div class="home-settlement-head"><div><strong>🤝 本月分帳概況</strong><div class="helper">依本月收入、分帳規則及雙向代墊即時計算；分帳後收入尚未扣除其他工作室支出</div></div><button class="primary small" data-action="settlement" data-month="${esc(month)}">本月分帳結算</button></div><div class="home-settlement-grid"><div class="home-settlement-value"><span>分帳後工作室收入</span><strong class="income">${money(Number(monthIncome||0)-c.due)}</strong></div><div class="home-settlement-value"><span>同事應付金額</span><strong class="expense">${money(c.due)}</strong></div></div></div>`;
}

function childRecords(childId, month='') {
  return state.transactions.filter(t=>t.childId===childId&&(!month||String(t.date||'').startsWith(month))).sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.updatedAt).localeCompare(String(a.updatedAt)));
}
function childNotes(childId, month='') {
  return state.notes.filter(n=>n.childId===childId&&(!month||String(n.date||'').startsWith(month))).sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.startTime).localeCompare(String(a.startTime)));
}
function totals(records) {
  const income=records.filter(r=>r.type==='income').reduce((s,r)=>s+Number(r.amount||0),0);
  const expense=records.filter(r=>r.type==='expense').reduce((s,r)=>s+Number(r.amount||0),0);
  return {income,expense,net:income-expense};
}
function renderChild(child) {
  const records=childRecords(child.id);
  const currentTotals=totals(records.filter(r=>String(r.date||'').startsWith(thisMonth())));
  const tabs=[['ledger','收支明細'],['month','月份統計'],['notes','簡易記事']];
  let body='';
  if(childTab==='ledger') body=renderLedger(child,records);
  else if(childTab==='month') body=renderMonth(child,records);
  else body=renderNotes(child);
  shell(`
    <section class="panel">
      <div class="section-head"><div><button class="soft small" data-action="back-home">← 返回孩童列表</button><h2 style="margin-top:10px">🧸 ${esc(child.name)}${child.status==='archived'?' <span class="subtle">（已離托）</span>':''}</h2><div class="subtle">個別收支、禮金與照顧記事</div></div><div class="toolbar"><button class="soft small" data-action="edit-child" data-id="${esc(child.id)}">編輯資料</button></div></div>

function renderAnalysisCategoryRows(map,type,total){
  const entries=Object.entries(map||{}).sort((a,b)=>Number(b[1])-Number(a[1]));
  if(!entries.length)return '<div class="chart-empty">這個月份沒有相關紀錄。</div>';
  const max=Math.max(1,...entries.map(x=>Number(x[1])||0));
  return entries.map(([name,value])=>{
    const amount=Math.max(0,Number(value)||0);
    const width=Math.max(0,Math.min(100,amount/max*100));
    const pct=total>0?amount/total*100:0;
    return `<div class="chart-row"><div class="chart-row-head"><span>${esc(name)}</span><strong>${money(amount)} <span class="subtle">${pct.toFixed(1)}%</span></strong></div><div class="chart-track"><div class="chart-fill ${type}" style="width:${width}%"></div></div></div>`;
  }).join('');
}
function buildAnalysisMonths(anchor,count=6){
  const [year,month]=String(anchor||thisMonth()).split('-').map(Number);
  return Array.from({length:count},(_,i)=>{
    const d=new Date(year,month-1-(count-1-i),1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  });
}
function monthRangeList(startMonth,endMonth){
  const s=String(startMonth||thisMonth()).split('-').map(Number),e=String(endMonth||thisMonth()).split('-').map(Number);
  let y=s[0],m=s[1],ey=e[0],em=e[1];
  if(!y||!m||!ey||!em)return [thisMonth()];
  const result=[];let guard=0;
  while((y<ey||(y===ey&&m<=em))&&guard++<120){result.push(`${y}-${String(m).padStart(2,'0')}`);m++;if(m>12){m=1;y++;}}
  return result.length?result:[thisMonth()];
}
function renderAnalysisTrend(scopeId,startMonth,endMonth){

  const chartMonths=months.length>12?months.slice(-12):months;

    const records=state.transactions.filter(r=>String(r.date||'').startsWith(m)&&(scopeId==='*'||String(r.childId)===String(scopeId)));
    return {month:m,...totals(records)};
  });
  const max=Math.max(1,...rows.flatMap(r=>[r.income,r.expense]));
  return `<div class="analysis-chart-card"><h3>期間內每月收支趨勢</h3><div class="chart-legend"><span><i class="legend-dot income"></i>收入</span><span><i class="legend-dot expense"></i>支出／退費</span></div><div class="trend-chart" style="grid-template-columns:repeat(${rows.length},minmax(0,1fr))">${rows.map(r=>{
    const ih=r.income?Math.max(2,r.income/max*100):0,eh=r.expense?Math.max(2,r.expense/max*100):0;
    return `<div class="trend-month"><div class="trend-bars"><div class="trend-bar income" style="height:${ih}%" title="${esc(r.month)} 收入 ${money(r.income)}"></div><div class="trend-bar expense" style="height:${eh}%" title="${esc(r.month)} 支出 ${money(r.expense)}"></div></div><div class="trend-label">${esc(r.month.slice(2).replace('-','/'))}</div></div>`;
  }).join('')}</div><div class="helper" style="margin-top:8px">${months.length>12?'區間超過 12 個月，趨勢圖顯示最近 12 個月；上方總額、分類及明細仍依完整期間計算。':'依選定的起訖月份逐月比較。'}</div></div>`;

  }).join('');
}

function settlementRules(){
  const raw=state.settings.settlementRules||{};
  const asRatio=(v,fallback)=>v!==undefined&&v!==null&&v!==''&&Number.isFinite(Number(v))&&Number(v)>=0&&Number(v)<=1?Number(v):fallback;
  const monthKeys=Object.keys(state.settings.monthlySettlements||{}).sort().reverse();
  const latest=monthKeys.length?(state.settings.monthlySettlements[monthKeys[0]]||{}):{};
  return {generalRatio:asRatio(raw.generalRatio,asRatio(latest.generalRatio,1/3)),foodRatio:asRatio(raw.foodRatio,asRatio(latest.foodRatio,1/3))};
}
function settlementRulesForm(){
  const r=settlementRules();
  openModal('分帳規則設定',`<p class="helper">設定每月分帳的預設比例。一般收入與副食品費分開計算；每個月份仍可在結算頁輸入該月手動金額。</p><div class="field"><label>一般收入分帳比例（%）</label><input name="generalRatio" type="number" min="0" max="100" step="0.1" required value="${(r.generalRatio*100).toFixed(1)}"></div><div class="field"><label>副食品費分帳比例（%）</label><input name="foodRatio" type="number" min="0" max="100" step="0.1" required value="${(r.foodRatio*100).toFixed(1)}"></div><div class="modal-actions"><button type="button" class="soft" data-action="close-modal">取消</button><button type="submit" class="primary">儲存分帳規則</button></div>`,'settlementRules');
}
function settlementData(month){
  const all=state.settings.monthlySettlements||{};
  const raw=all[month]||{};
  const rules=settlementRules();
  return {
    generalRatio:raw.generalRatio!==undefined&&raw.generalRatio!==''?Number(raw.generalRatio):rules.generalRatio,
    foodRatio:raw.foodRatio!==undefined&&raw.foodRatio!==''?Number(raw.foodRatio):rules.foodRatio,
    generalOverride:raw.generalOverride??'',foodOverride:raw.foodOverride??'',
    coworkerAdvances:Array.isArray(raw.coworkerAdvances)?raw.coworkerAdvances:[],
    // 舊版「代墊物品」曾直接從應付同事金額扣除，沿用為「工作室代墊同事」以保持舊結算結果一致。
    studioAdvances:Array.isArray(raw.studioAdvances)?raw.studioAdvances:(Array.isArray(raw.advances)?raw.advances:[]),
    memo:raw.memo||''
  };
}
function settlementCalc(month,d){
  const rows=state.transactions.filter(t=>String(t.date||'').startsWith(month)&&t.type==='income');
  const foodRows=rows.filter(t=>/副食品/.test(String(t.category||'')));
  const foodByChild=Object.values(foodRows.reduce((acc,t)=>{const key=String(t.childId||'');if(!acc[key])acc[key]={childId:key,amount:0};acc[key].amount+=Number(t.amount||0);return acc;},{}));
  const generalRows=rows.filter(t=>!/副食品/.test(String(t.category||'')));
  const totalIncome=rows.reduce((a,t)=>a+Number(t.amount||0),0);
  const generalTotal=generalRows.reduce((a,t)=>a+Number(t.amount||0),0);
  const foodTotal=foodRows.reduce((a,t)=>a+Number(t.amount||0),0);
  const generalShare=d.generalOverride!==''&&d.generalOverride!=null?Number(d.generalOverride):Math.round(generalTotal*Number(d.generalRatio??1/3));
  const foodShare=d.foodOverride!==''&&d.foodOverride!=null?Number(d.foodOverride):Math.round(foodTotal*Number(d.foodRatio??1/3));
  const coworkerAdvances=(d.coworkerAdvances||[]).reduce((a,x)=>a+Number(x.amount||0),0);
  const studioAdvances=(d.studioAdvances||[]).reduce((a,x)=>a+Number(x.amount||0),0);
  const entitled=generalShare+foodShare;
  const due=entitled+coworkerAdvances-studioAdvances;
  return {totalIncome,generalTotal,foodTotal,generalShare,foodShare,entitled,coworkerAdvances,studioAdvances,due,studioIncome:totalIncome-due,foodRows,foodByChild};
}
function renderAdvanceRows(rows,type){
  if(!rows.length)return '<div class="empty">尚無代墊紀錄。</div>';
  return rows.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).map(a=>`<div class="advance-row"><div class="advance-main"><b>${esc(a.item||a.detail||'未填明細')}</b><div class="subtle">${esc(a.date||'')}${a.note?'・'+esc(a.note):''}</div></div><strong>${money(a.amount)}</strong><div class="toolbar"><button class="soft small" data-action="edit-advance" data-id="${esc(a.id)}" data-advance-type="${type}">編輯</button><button class="danger small" data-action="delete-advance" data-id="${esc(a.id)}" data-advance-type="${type}">刪除</button></div></div>`).join('');
}

  shell(`<section class="panel"><div class="section-head"><div><button class="soft small" data-action="back-home">← 返回首頁</button><h2 style="margin-top:10px">🤝 ${esc(month)} 分帳結算</h2><div class="subtle">每個月份獨立計算，不跨月合併</div></div></div>

function getChildCategories(_childId,type=null) {
  const list=state.categories.filter(c=>String(c.childId||'')==='*'&&c.active!==false&&c.active!=='false');
  return (type?list.filter(c=>c.type===type):list).sort((a,b)=>{
    if(a.type!==b.type)return a.type.localeCompare(b.type);
    if(a.type==='income'){const ap=String(a.name||'').trim()==='托育費'?0:1,bp=String(b.name||'').trim()==='托育費'?0:1;if(ap!==bp)return ap-bp;}
    return Number(a.sort)-Number(b.sort);
  });
}

function durationMinutes(start,end) {
  if(!start||!end)return 0;
  const [sh,sm]=start.split(':').map(Number),[eh,em]=end.split(':').map(Number);
  let diff=eh*60+em-(sh*60+sm); if(diff<0)diff+=1440; return diff;
}
function formatDuration(minutes) { return minutes?`${Math.floor(minutes/60)} 小時 ${minutes%60} 分鐘`:'尚未計算'; }

async function handleFormSubmit(form) {
  const fd=new FormData(form);const data=Object.fromEntries(fd.entries());
  if(form.dataset.form==='advance'){
    const month=form.dataset.month||thisMonth();
    const all={...(state.settings.monthlySettlements||{})};
    const d=settlementData(month);
    const advanceType=form.dataset.advanceType==='studio'?'studio':'coworker';
    const key=advanceType==='studio'?'studioAdvances':'coworkerAdvances';
    const id=form.dataset.id||uid('advance');
    const old=(d[key]||[]).find(x=>x.id===id)||{};
    const item={...old,id,date:data.date,item:String(data.item||'').trim(),amount:Number(data.amount||0),note:data.note||''};
    if(!item.item)throw new Error('請填寫代墊明細。');
    if(!item.date)throw new Error('請選擇代墊日期。');
    if(item.amount<=0)throw new Error('代墊金額必須大於 0。');
    d[key]=[...(d[key]||[]).filter(x=>x.id!==id),item];all[month]=d;
    await apiMutation([{kind:'saveSetting',data:{key:'monthlySettlements',value:all}}]);
    closeModal();analysisMonth=month;renderSettlement();showToast('代墊明細已儲存');return;
  }
  if(form.dataset.form==='settlementRules'){
    const generalRatio=Number(data.generalRatio)/100,foodRatio=Number(data.foodRatio)/100;
    if(!Number.isFinite(generalRatio)||!Number.isFinite(foodRatio)||generalRatio<0||generalRatio>1||foodRatio<0||foodRatio>1)throw new Error('分帳比例請輸入 0 到 100。');
    await apiMutation([{kind:'saveSetting',data:{key:'settlementRules',value:{generalRatio,foodRatio}}}]);
    closeModal();renderSettings();showToast('分帳規則已儲存');return;
  }
  if(form.dataset.form==='child'){
    const id=form.dataset.id||uid('child');
    const old=state.children.find(c=>c.id===id)||{};
    const ops=[{kind:'saveChild',data:{...old,id,name:data.name.trim(),memo:data.memo||'',status:form.dataset.status||'active'}}];
    await apiMutation(ops);
    closeModal();showToast('孩童資料已儲存');return;
  }
  if(form.dataset.form==='transaction'){
    const childId=form.dataset.childId;const id=form.dataset.id||uid('tx');
    const category=state.categories.find(c=>c.id===data.categoryId);
    if(!category)throw new Error('請先在設定中建立可用的收支項目。');
    const old=state.transactions.find(t=>t.id===id)||{};
    const isGift=category.id==='cat_gift'||category.name==='禮金';
    const amount=Number(data.amount||0);
    if(!isGift&&!String(data.amount||'').trim())throw new Error('請填寫金額。');
    const tx={...old,id,childId,date:data.date,type:data.type,categoryId:category.id,category:category.name,amount,paymentMethod:data.paymentMethod||'',note:data.note||'',giftFestival:isGift?(data.giftFestival||''):'',giftCash:isGift?amount:0,giftItemName:isGift?(data.giftItemName||''):'',giftItemValue:isGift?Number(data.giftItemValue||0):0};
    if(isGift&&amount===0&&!tx.giftItemName)throw new Error('禮金請至少填寫現金金額或禮品名稱。');
    await apiMutation([{kind:'saveTransaction',data:tx}]);
    closeModal();showToast('收支紀錄已儲存');return;
  }
  if(form.dataset.form==='note'){
    const childId=form.dataset.childId;const id=form.dataset.id||uid('note');
    const start=data.startTime||'',end=data.endTime||'',mins=durationMinutes(start,end);
    const old=state.notes.find(n=>n.id===id)||{};
    const note={...old,id,childId,date:data.date,startTime:start,endTime:end,durationMinutes:mins,type:data.type,note:data.note||''};
    await apiMutation([{kind:'saveNote',data:note}]);closeModal();showToast('簡易記事已儲存');return;
  }
  if(form.dataset.form==='category'){
    const id=form.dataset.id||uid('cat');const type=form.querySelector('[name="type"]').value;
    const old=state.categories.find(c=>c.id===id)||{};
    const group=state.categories.filter(c=>String(c.childId||'')==='*'&&c.type===type&&c.active!==false&&c.active!=='false');
    const category={...old,id,childId:'*',type,name:data.name.trim(),sort:old.sort||((group.length+1)*10),active:true};
    await apiMutation([{kind:'saveCategory',data:category}]);closeModal();categoryManager();showToast('共用項目已儲存');return;
  }
  if(form.dataset.form==='noteType'){
    const id=form.dataset.id||uid('noteType');
    const list=getNoteTypes();const index=list.findIndex(x=>x.id===id);
    const old=index>=0?list[index]:{};
    const item={...old,id,name:data.name.trim(),sort:old.sort||((list.length+1)*10),active:true};
    if(index>=0)list[index]=item;else list.push(item);
    await apiMutation([{kind:'saveSetting',data:{key:'noteTypes',value:list}}]);
    closeModal();noteTypeManager();showToast('共用記事類型已儲存');return;
  }
}

async function localBackup() {
  const result=await api('bootstrap');if(!result.ok)throw new Error(result.error||'讀取資料失敗');
  const snapshot={app:'工作室收入記帳',version:1,exportedAt:new Date().toISOString(),state:result.state};
  const blob=new Blob([JSON.stringify(snapshot,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`工作室收入記帳_本機備份_${today()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);showToast('本機備份檔已下載');
}
async function localRestore(file) {
  const parsed=JSON.parse(await file.text());
  if(!parsed||!parsed.state||parsed.app!=='工作室收入記帳')throw new Error('這不是「工作室收入記帳」的備份檔。');
  const s=normalizeState(parsed.state);
  const ops=[];
  s.children.forEach(data=>ops.push({kind:'saveChild',data}));
  s.categories.forEach(data=>ops.push({kind:'saveCategory',data}));
  s.transactions.forEach(data=>ops.push({kind:'saveTransaction',data}));
  s.notes.forEach(data=>ops.push({kind:'saveNote',data}));
  Object.entries(s.settings).forEach(([key,value])=>ops.push({kind:'saveSetting',data:{key,value}}));
  if(!ops.length){showToast('備份檔沒有可匯入的資料');return;}
  if(!confirm(`準備合併匯入 ${ops.length} 筆資料。現有資料不會被清除，識別碼相同的項目會更新。確定繼續？`))return;
  const batchSize=3;
  for(let i=0;i<ops.length;i+=batchSize){updateBusyDetail(`正在寫入第 ${Math.floor(i/batchSize)+1} 批，共 ${Math.ceil(ops.length/batchSize)} 批。請保持網路連線。`);await apiMutation(ops.slice(i,i+batchSize));}
  showToast(`本機資料匯入完成，共處理 ${ops.length} 筆`);
}

function showConnectionError(message) {
  $('#appRoot').innerHTML=`<div class="lock-wrap"><img src="${window.__STUDIO_ICON_512__}" alt="工作室收入記帳"><h2>工作室收入記帳</h2><p>${esc(message||'目前無法連接雲端資料。請確認網路及 GAS 部署設定。')}</p><button class="primary" style="width:100%" id="retryConnect">重新連線</button></div>`;
}

  'cloud-backup':'正在建立雲端備份…','cloud-restore':'正在從雲端還原資料…','local-backup':'正在準備本機備份…',
  'save-settlement':'正在儲存本月分帳結算…','add-advance':'正在準備新增代墊明細…','edit-advance':'正在準備編輯代墊明細…','delete-advance':'正在刪除代墊明細…'

$('#appRoot').addEventListener('click', async e=>{
  const target=e.target.closest('[data-action]');if(!target)return;
  if(target.dataset.action==='close-modal'&&e.target.closest('.modal'))return;
  const action=target.dataset.action;
  try{
    if(!cloudReady && ['archive-child','restore-child','delete-transaction','delete-note','toggle-category','move-category','toggle-note-type','move-note-type','cloud-backup','cloud-restore','local-backup','local-restore','save-settlement','add-advance','edit-advance','delete-advance'].includes(action)){showToast('正在同步最新雲端資料，完成後即可執行這項操作。');return;}
    if(NETWORK_ACTIONS.has(action))await withBusy(ACTION_BUSY_LABELS[action]||'正在處理雲端資料…',()=>handleAction(action,target),target);
    else await handleAction(action,target);
  }catch(err){showToast(err.message||String(err));}
});

    if(NETWORK_ACTIONS.has(action))await withBusy(ACTION_BUSY_LABELS[action]||'正在處理雲端資料…',()=>handleAction(action,target),target);

  }catch(err){showToast(err.message||String(err));}
});

  if(e.target.id==='noteMonth'){selectedMonth=e.target.value;render();}
  if(e.target.id==='analysisScope'){analysisChildId=e.target.value;renderAnalysis();}
  if(e.target.id==='analysisStartMonth'){analysisStartMonth=e.target.value||buildAnalysisMonths(thisMonth(),6)[0];if(analysisStartMonth>analysisEndMonth)analysisEndMonth=analysisStartMonth;renderAnalysis();}
  if(e.target.id==='analysisEndMonth'){analysisEndMonth=e.target.value||thisMonth();if(analysisEndMonth<analysisStartMonth)analysisStartMonth=analysisEndMonth;renderAnalysis();}
  if(e.target.id==='settlementMonth'){
    const previousMonth=analysisMonth||thisMonth(),nextMonth=e.target.value||thisMonth();
    try{
      const {d}=collectSettlementForm(previousMonth);
      const all={...(state.settings.monthlySettlements||{}),[previousMonth]:d};
      await withBusy('正在保存本月分帳設定…',()=>apiMutation([{kind:'saveSetting',data:{key:'monthlySettlements',value:all}}]));
      analysisMonth=nextMonth;renderSettlement();
    }catch(err){showToast(err.message||String(err));renderSettlement();}
  }
  if(e.target.id==='localFileInput'&&e.target.files?.[0]){const file=e.target.files[0];withBusy('正在匯入本機備份…',()=>localRestore(file),null,'資料會分批寫入雲端試算表，請保持網路連線。').catch(err=>showToast(err.message||String(err))).finally(()=>e.target.value='');}
});
function isStandaloneApp(){
  return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
}
function updateInstallButton(){
  document.querySelectorAll('[data-action="install"]').forEach(btn=>{
    btn.classList.toggle('hidden',isStandaloneApp());
    btn.setAttribute('aria-label',deferredInstallPrompt?'安裝工作室收入記帳':'安裝工作室收入記帳或查看安裝方式');
    const label=btn.querySelector('span:last-child');
    if(label) label.textContent=deferredInstallPrompt?'立即安裝 APP':'安裝 APP';
  });
}
function installApp(){
  if(isStandaloneApp()){updateInstallButton();showToast('工作室收入記帳已安裝在這台裝置上。');return;}
  if(deferredInstallPrompt){
    const promptEvent=deferredInstallPrompt;
    deferredInstallPrompt=null;
    promptEvent.prompt();
    Promise.resolve(promptEvent.userChoice).then(choice=>{
      if(choice&&choice.outcome==='accepted')showToast('已接受安裝，請依手機畫面完成安裝。');
      updateInstallButton();
    }).catch(()=>updateInstallButton());
    return;
  }
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const guide=isIOS
    ? '<p>請使用 Safari 開啟本程式，再依照以下步驟加入主畫面：</p><ol><li>點擊 Safari 工具列的「分享」圖示。</li><li>往下找到「加入主畫面」。</li><li>確認名稱後按「新增」。</li></ol>'
    : '<p>目前瀏覽器尚未提供自訂安裝視窗，仍可從瀏覽器選單安裝：</p><ol><li>使用 Android Chrome 正常瀏覽模式開啟 HTTPS 網址。</li><li>點右上角「⋮」。</li><li>選擇「安裝應用程式」或「新增至主畫面」。</li><li>依照畫面確認安裝。</li></ol><p>請勿使用 LINE、Facebook 等 App 內建瀏覽器。</p>';
  openModal(isIOS?'加入 iPhone／iPad 主畫面':'將工作室收入記帳安裝到手機',`<div class="install-guide">${guide}<p class="helper">瀏覽器是否提供原生安裝提示，由瀏覽器依安裝條件判定；未出現提示時，請依上方方式操作。</p></div><div class="modal-actions"><button class="primary" data-action="close-modal">知道了</button></div>`);
}
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  updateInstallButton();
});
window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null;
  updateInstallButton();
  showToast('工作室收入記帳已成功安裝！');
});
window.addEventListener('online',()=>{showToast('網路已恢復，正在同步雲端資料…');if(!cloudReady)loadState(false).catch(err=>{cloudReady=false;setSyncStatus('⚠️ 雲端暫時無法連線，目前顯示本機上次同步資料','offline');showToast('雲端同步仍未成功，請稍後重新整理。');});});
window.addEventListener('offline',()=>showToast('目前離線，雲端資料功能暫時無法使用'));
const standaloneQuery=window.matchMedia?window.matchMedia('(display-mode: standalone)'):null;
if(standaloneQuery){
  if(standaloneQuery.addEventListener)standaloneQuery.addEventListener('change',updateInstallButton);
  else if(standaloneQuery.addListener)standaloneQuery.addListener(updateInstallButton);
}

document.addEventListener('click', async e=>{
  if(e.target && e.target.id==='retryConnect'){
    const btn=e.target;
    try{await withBusy('正在重新連接雲端…',()=>loadState(false),btn,'正在讀取總控試算表，請稍候。');}
    catch(err){showConnectionError(err.message||'雲端連線失敗，請檢查 GAS 部署設定。');}
  }
});

// 開啟程式先顯示本機上次同步快取，再於背景更新雲端；不再讓使用者空等雲端載入。
(async function start(){
  initializeAppHistory();
  const cached=readLocalCache();
  if(cached){
    state=normalizeState(cached.state);
    localCacheAvailable=true;
    const savedAt=cached.savedAt?new Date(cached.savedAt):null;
    const savedLabel=savedAt&&!Number.isNaN(savedAt.getTime())?savedAt.toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'上次保存';
    cloudReady=false;
    syncStatusText=`📱 顯示本機資料（${savedLabel}），正在背景同步雲端…`;syncStatusKind='loading';
    render();
  } else {
    setSyncStatus('首次使用，正在載入雲端資料…','loading');
  }
  try{
    await loadState(false);
  }catch(err){
    cloudReady=false;
    if(cached){
      setSyncStatus('⚠️ 雲端暫時無法連線，目前顯示本機上次同步資料','offline');
      showToast('雲端同步失敗，已保留本機快取資料；請確認網路後重新整理。');
    }else{
      showConnectionError(err.message||'雲端連線失敗，請檢查 GAS 部署設定。');
    }
  }
})();
</script>
