<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFC928">
  <title>真好點｜團購點餐</title>
  <style>
    :root{--yellow:#ffc928;--yellow2:#ffe58b;--orange:#ff8d3a;--pink:#ff7797;--green:#4dbb83;--blue:#69b8ed;--ink:#34302a;--muted:#827b70;--paper:#fffdf7;--line:#f0e6d0;--shadow:0 10px 28px rgba(109,82,20,.10)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff8df 0%,#fffdf8 42%,#fff1e6 100%);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;min-height:100vh}
    button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.55;cursor:not-allowed}
    .app{max-width:820px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
    .top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.logo{width:52px;height:52px;border-radius:18px;background:linear-gradient(145deg,#ffe578,#ffad30);display:grid;place-items:center;box-shadow:0 7px 15px #e8af3c55;user-select:none;touch-action:manipulation;flex:none}.logo span{font-size:28px}.brand{min-width:0}.brand h1{font-size:23px;margin:0;font-weight:900;letter-spacing:1px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.top-right{margin-left:auto}.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:800}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
    .hero{border-radius:26px;padding:22px;background:linear-gradient(125deg,#ffdc67,#ffb54e 55%,#ff9672);color:#573719;position:relative;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}.hero:after{content:"🍱";position:absolute;right:18px;bottom:-8px;font-size:76px;opacity:.35;transform:rotate(-12deg)}.hero h2{font-size:22px;margin:0 0 7px;max-width:78%;line-height:1.35}.hero p{font-size:13px;margin:0;max-width:75%;line-height:1.6}.card{background:rgba(255,255,255,.94);border:1px solid rgba(242,226,190,.85);border-radius:22px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}.card h3{margin:0 0 14px;font-size:17px}.section-title{display:flex;align-items:center;gap:8px}.section-title .emoji{font-size:22px}.muted{color:var(--muted)}.small{font-size:12px}.field{margin:13px 0}.field label,.field-label{display:block;font-weight:800;font-size:14px;margin-bottom:7px}.required{font-size:10px;color:#e45763;background:#fff0f0;padding:3px 7px;border-radius:99px;margin-left:6px}.optional{font-size:10px;color:#7a8b54;background:#f2f8e9;padding:3px 7px;border-radius:99px;margin-left:6px}.input,.textarea,.select{width:100%;border:1.5px solid #e9dfcc;background:#fffefa;border-radius:13px;padding:12px 13px;outline:none;color:var(--ink);min-height:46px}.input:focus,.textarea:focus,.select:focus{border-color:#eab82f;box-shadow:0 0 0 3px #ffd95d35}.textarea{min-height:84px;resize:vertical}.option-list{display:grid;gap:8px}.option{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1.5px solid #eee5d7;border-radius:14px;background:#fffefa}.option:has(input:checked){border-color:#f0be34;background:#fff9e5}.option input{accent-color:#e9a900;width:18px;height:18px}.option-name{flex:1;font-size:14px;font-weight:650}.price{font-size:13px;color:#d47b1c;font-weight:850}.qty-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.qty{width:72px;text-align:center;padding:7px;border:1px solid #e9dfcc;border-radius:10px}.note-input{margin-top:8px;font-size:13px}.btn{padding:12px 16px;border-radius:13px;font-weight:850;transition:transform .12s,filter .12s}.btn:active{transform:scale(.98)}.btn-primary{background:linear-gradient(135deg,#ffc928,#ffad35);color:#503715;box-shadow:0 5px 13px #e6ad3438}.btn-secondary{background:#fff3ce;color:#795719}.btn-plain{background:#f7f3e9;color:#665c4d}.btn-danger{background:#fff0ee;color:#bd4c43}.btn-green{background:#e8f8ed;color:#27794a}.btn-block{width:100%}.btn-row{display:flex;gap:9px;flex-wrap:wrap}.btn-row>*{flex:1}.total-box{background:#fff6d9;border:1px dashed #efbf3d;padding:14px 16px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;margin:14px 0}.total-box strong{font-size:25px;color:#c77b07}.notice{padding:12px 14px;border-radius:13px;background:#fff7df;color:#805e16;font-size:13px;line-height:1.6}.notice.error{background:#fff0ee;color:#b54e43}.notice.success{background:#eaf8ed;color:#28774a}.hidden{display:none!important}.divider{height:1px;background:var(--line);margin:14px 0}.admin-tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px;margin-bottom:12px}.tab{white-space:nowrap;padding:10px 13px;border-radius:12px;background:#f6f0e2;color:#75664f;font-weight:800;font-size:13px}.tab.active{background:#ffdd72;color:#60410d}.question-editor{border:1px solid #eee3ce;border-radius:16px;padding:13px;margin:12px 0;background:#fffefa}.editor-head{display:flex;align-items:center;gap:7px;margin-bottom:10px}.editor-head strong{flex:1}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.option-editor{display:grid;grid-template-columns:minmax(0,1fr) 90px 38px;gap:6px;margin:7px 0}.option-editor input{min-width:0;padding:9px;border:1px solid #e8dfce;border-radius:10px}.mini-btn{border-radius:10px;background:#fff0ed;color:#ba5548;font-weight:900}.order-card{border:1px solid #eee3ce;border-radius:15px;padding:13px;margin:10px 0}.order-top{display:flex;gap:8px;align-items:center;justify-content:space-between}.amount{color:#c77b07;font-size:18px;font-weight:900}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px;background:#fff6df;border-radius:14px;text-align:center}.stat b{display:block;font-size:20px;color:#9b6c0a}.stat span{font-size:11px;color:#81745d}.modal-backdrop{position:fixed;inset:0;background:#2d251b77;display:grid;place-items:center;padding:16px;z-index:30}.modal{width:min(100%,430px);max-height:90vh;overflow:auto;background:#fffdf7;border-radius:22px;padding:20px;box-shadow:0 20px 70px #0003}.modal h3{margin:0 0 13px}.toast{position:fixed;z-index:50;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:12px 18px;background:#332d25;color:white;border-radius:99px;font-size:13px;box-shadow:var(--shadow);max-width:90%;text-align:center}.loading{opacity:.65;pointer-events:none}.history-item{padding:12px;border:1px solid var(--line);border-radius:13px;margin:8px 0}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:800;background:#eef6ea;color:#4c7c3a}.badge.closed{background:#f2efeb;color:#81776b}.footer{text-align:center;color:#a69b88;font-size:11px;padding:16px 0 4px}
    @media(min-width:650px){.app{padding-top:24px}.hero{padding:28px}.hero h2{font-size:26px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .field{margin:6px 0 12px}}
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo" id="logoTap" title="真好點"><span>🍋</span></div>
    <div class="brand"><h1>真好點</h1><p>好吃的一起點，快樂一起分享！</p></div>
    <div class="top-right"><span class="pill" id="statusPill"><i class="dot"></i>讀取中</span></div>
  </header>
  <main id="main"><div class="card"><div class="muted">正在載入真好點…</div></div></main>
  <div class="footer">真好點・團購點餐小幫手</div>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const state={publicData:null,admin:false,token:'',adminTab:'builder',selectedSurveyId:'',adminOrders:[],adminSurvey:null,orderMode:'new',myOrder:null,logoClicks:0,logoTimer:null};
const $=id=>document.getElementById(id);
const money=n=>'$'+Number(n||0).toLocaleString('zh-TW',{maximumFractionDigits:2});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const call=(fn,...args)=>new Promise((resolve,reject)=>{if(!window.google||!google.script||!google.script.run){reject(new Error('請從已部署的 GAS 網頁應用程式網址開啟。'));return;}const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e))));runner[fn](...args);});
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.add('hidden'),2800);}
function setBusy(on){document.body.classList.toggle('loading',!!on)}
function moneyFromAnswers(config,answers){let n=0;(config.questions||[]).forEach(q=>{const a=answers[q.id];if(q.type==='single'){const o=q.options.find(x=>x.label===a);if(o)n+=Number(o.price||0)}else if(q.type==='multi'&&Array.isArray(a)){a.forEach(v=>{const o=q.options.find(x=>x.label===v);if(o)n+=Number(o.price||0)})}else if(q.type==='items'&&a&&Array.isArray(a.items)){a.items.forEach(i=>n+=Number(i.price||0)*Number(i.qty||1))}});return n}
function activeSurvey(){return state.publicData&&state.publicData.survey}
async function loadPublic(){try{const d=await call('getPublicData');state.publicData=d;if(!d.ok&&!d.initialized){$('statusPill').innerHTML='<i class="dot" style="background:#e5a33a"></i>待初始化';renderInitNotice(d.message);return;}renderUser();}catch(e){$('statusPill').textContent='連線失敗';renderError(e.message)}}
function renderInitNotice(msg){$('main').innerHTML=`<section class="hero"><h2>歡迎使用真好點！</h2><p>第一次使用前，請管理者先完成 GAS 初始化。</p></section><div class="card"><h3>尚未完成系統初始化</h3><div class="notice">${esc(msg||'請執行 initializeRealGoodOrder()。')}</div><p class="small muted">請在 Apps Script 編輯器選擇 initializeRealGoodOrder，按下「執行」並完成 Google 授權，再重新整理本頁。</p></div>`}
function renderError(msg){$('main').innerHTML=`<div class="card"><h3>目前無法連線</h3><div class="notice error">${esc(msg)}</div><button class="btn btn-primary btn-block" onclick="loadPublic()">重新載入</button></div>`}
function renderUser(){const s=activeSurvey();$('statusPill').innerHTML=s?'<i class="dot"></i>開放填寫':'<i class="dot" style="background:#c2b8a8"></i>未開放';if(!s){$('main').innerHTML=`<section class="hero"><h2>今天想吃什麼？</h2><p>好吃的一起點，快樂一起分享！</p></section><div class="card" style="text-align:center;padding:34px 20px"><div style="font-size:54px">🍱</div><h3 style="font-size:21px">目前問卷未開放</h3><p class="muted">管理者尚未開啟新的團購問卷，請稍後再來。</p><button class="btn btn-plain" onclick="loadPublic()">重新整理</button></div><div class="card"><h3>已經送出過訂單？</h3><p class="small muted">可使用姓名及手機號碼查詢自己的訂單。</p><button class="btn btn-secondary btn-block" onclick="openLookup(false)">查詢我的訂單</button></div>`;return;}
const cfg=s.config||{};$('main').innerHTML=`<section class="hero"><h2>${esc(s.title)}</h2><p>${esc(cfg.description||'請填寫以下內容，確認餐點後送出訂單。')}</p></section><section class="card"><div class="section-title"><span class="emoji">🧑‍🍳</span><h3 style="margin:0">填寫訂購資料</h3></div><div class="form-grid"><div class="field"><label>姓名<span class="required">必填</span></label><input id="custName" class="input" maxlength="60" placeholder="請輸入姓名"></div><div class="field"><label>手機號碼<span class="required">必填</span></label><input id="custPhone" class="input" inputmode="tel" maxlength="20" placeholder="請輸入手機號碼"></div></div><div class="divider"></div><div id="questionForm">${(cfg.questions||[]).map(renderQuestion).join('')}</div><div class="total-box"><span>預估訂購金額</span><strong id="liveTotal">$0</strong></div><div class="btn-row"><button class="btn btn-primary btn-block" onclick="submitNewOrder()">確認並送出訂單</button><button class="btn btn-secondary" onclick="openLookup(false)">查詢訂單</button></div><p class="small muted" style="margin:12px 0 0">送出前請再次確認；同一份問卷、相同姓名及手機號碼只保留一筆訂單。</p></section>`;
}
function renderQuestion(q){const req=q.required?'<span class="required">必填</span>':'<span class="optional">選填</span>';let html=`<div class="field question" data-qid="${esc(q.id)}"><label>${esc(q.label)}${req}</label>`;
if(q.type==='text')html+=`<input class="input" data-type="text" placeholder="請輸入${esc(q.label)}" maxlength="1000">`;
if(q.type==='textarea')html+=`<textarea class="textarea" data-type="textarea" placeholder="請輸入${esc(q.label)}" maxlength="1000"></textarea>`;
if(q.type==='single'||q.type==='multi'){html+=`<div class="option-list">${(q.options||[]).map((o,i)=>`<label class="option"><input type="${q.type==='single'?'radio':'checkbox'}" name="q_${esc(q.id)}" value="${esc(o.label)}" data-price="${Number(o.price||0)}"><span class="option-name">${esc(o.label)}</span>${Number(o.price||0)>0?`<span class="price">+${money(o.price)}</span>`:''}</label>`).join('')}</div>`;}
if(q.type==='items'){html+=`<div class="option-list">${(q.options||[]).map((o,i)=>`<div class="option item-option"><label style="display:flex;align-items:center;gap:9px;flex:1;margin:0"><input type="${q.selectionMode==='single'?'radio':'checkbox'}" name="item_${esc(q.id)}" class="item-check" value="${esc(o.label)}" data-price="${Number(o.price||0)}" data-qid="${esc(q.id)}"><span class="option-name">${esc(o.label)}</span><span class="price">${money(o.price)}</span></label>${q.allowQuantity?`<input class="qty" type="number" min="1" max="99" value="1" aria-label="數量">`:''}<input class="note-input input" style="max-width:125px;padding:8px" placeholder="餐點備註" aria-label="餐點備註" ${q.allowItemNote?'':'disabled hidden'}></div>`).join('')}</div>`;}
return html+'</div>'}
function collectAnswers(){const cfg=activeSurvey().config;const answers={};document.querySelectorAll('.question').forEach(box=>{const q=(cfg.questions||[]).find(x=>x.id===box.dataset.qid);if(!q)return;if(q.type==='text'||q.type==='textarea'){answers[q.id]=box.querySelector('[data-type]').value.trim()}else if(q.type==='single'){const v=box.querySelector('input:checked');answers[q.id]=v?v.value:''}else if(q.type==='multi'){answers[q.id]=Array.from(box.querySelectorAll('input:checked')).map(x=>x.value)}else if(q.type==='items'){const items=[];box.querySelectorAll('.item-option').forEach(el=>{const c=el.querySelector('.item-check');if(c.checked){const qtyEl=el.querySelector('.qty');items.push({label:c.value,qty:qtyEl?Math.max(1,Math.min(99,Math.floor(Number(qtyEl.value)||1))):1,price:Number(c.dataset.price||0),note:el.querySelector('.note-input')?el.querySelector('.note-input').value.trim():''})}});answers[q.id]={items:items}}});return answers}
function updateLiveTotal(){const s=activeSurvey();if(!s)return;const a=collectAnswers();$('liveTotal').textContent=money(moneyFromAnswers(s.config,a))}
document.addEventListener('change',e=>{if(e.target.closest&&e.target.closest('#questionForm'))updateLiveTotal()});document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#questionForm'))updateLiveTotal()});
function validateLocal(){const name=$('custName').value.trim(),phone=$('custPhone').value.replace(/[\s()\-＋+]/g,'');if(!name){toast('請輸入姓名');$('custName').focus();return false}if(!/^\d{8,15}$/.test(phone)){toast('請輸入正確的手機號碼');$('custPhone').focus();return false}const cfg=activeSurvey().config;for(const q of cfg.questions){const a=collectAnswers()[q.id];let empty=(a===''||a==null||(Array.isArray(a)&&!a.length)||(q.type==='items'&&(!a||!a.items.length)));if(q.required&&empty){toast('請完成必填題目：'+q.label);return false}}return true}
async function submitNewOrder(){if(!validateLocal())return;const answers=collectAnswers();const preview=money(moneyFromAnswers(activeSurvey().config,answers));if(!confirm('請確認訂購金額：'+preview+'\n確定送出訂單嗎？'))return;setBusy(true);try{const r=await call('submitOrder',{surveyId:activeSurvey().id,name:$('custName').value,phone:$('custPhone').value,answers});if(r.ok){showSuccess(r.orderId,r.amount);return}if(r.code==='DUPLICATE'){openLookup(false,'已存在訂單 '+r.orderId+'，請輸入相同姓名及手機號碼查詢。');return}toast(r.message||'送出失敗');}catch(e){toast(e.message)}finally{setBusy(false)}}
function showSuccess(id,amount){$('main').innerHTML=`<section class="hero"><h2>訂單送出成功！</h2><p>謝謝你的訂購，期待美味餐點到來。</p></section><div class="card" style="text-align:center;padding:28px 18px"><div style="font-size:54px">🎉</div><h3>已收到你的訂單</h3><div class="notice success">請記下訂單編號，方便日後查詢。</div><div style="font-size:12px;color:#8a806e;margin-top:18px">訂單編號</div><div style="font-size:22px;font-weight:900;letter-spacing:1px;margin:5px 0">${esc(id)}</div><div class="total-box"><span>應付金額</span><strong>${money(amount)}</strong></div><button class="btn btn-primary btn-block" onclick="loadPublic()">返回首頁</button><button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="openLookup(false)">查看我的訂單</button></div>`}
function openLookup(editMode,extra=''){const surveys=(state.publicData&&state.publicData.surveys)||[];const current=activeSurvey();const options=surveys.map(x=>`<option value="${esc(x.id)}" ${current&&x.id===current.id?'selected':''}>${esc(x.title)}（${esc(x.status)}）</option>`).join('');modal(`<h3>🔎 查詢我的訂單</h3>${extra?`<div class="notice">${esc(extra)}</div>`:''}<p class="small muted">只有姓名及手機號碼都符合，才能查看該份問卷的訂單。</p><div class="field"><label>選擇問卷</label><select id="lookupSurvey" class="select">${options||'<option value="">目前沒有問卷紀錄</option>'}</select></div><div class="field"><label>姓名</label><input id="lookupName" class="input" placeholder="請輸入姓名"></div><div class="field"><label>手機號碼</label><input id="lookupPhone" class="input" inputmode="tel" placeholder="請輸入手機號碼"></div><div class="btn-row"><button class="btn btn-primary" onclick="lookupOrder()">查詢訂單</button><button class="btn btn-plain" onclick="closeModal()">取消</button></div>`)}
async function lookupOrder(){const surveyId=$('lookupSurvey').value;const name=$('lookupName').value.trim(),phone=$('lookupPhone').value.trim();if(!surveyId){toast('目前沒有可查詢的問卷');return}if(!name||!phone){toast('請輸入姓名及手機號碼');return}setBusy(true);try{const r=await call('lookupMyOrder',{surveyId,name,phone});if(!r.ok){toast(r.message);return}closeModal();state.myOrder={...r.order,config:r.config,surveyId:surveyId,name:name,phone:phone};renderMyOrder(false)}catch(e){toast(e.message)}finally{setBusy(false)}}
function answersSummary(config,answers){return (config.questions||[]).map(q=>`<div style="margin:9px 0"><div class="small muted">${esc(q.label)}</div><b>${esc(formatAnswer(answers&&answers[q.id],q))||'（未填寫）'}</b></div>`).join('')}
function formatAnswer(a,q){if(a==null||a==='')return '';if(typeof a==='object'&&Array.isArray(a.items))return a.items.map(x=>x.label+' ×'+x.qty+'（'+money(Number(x.price||0))+'/份，小計 '+money(Number(x.price||0)*Number(x.qty||1))+'）'+(x.note?'（備註：'+x.note+'）':'')).join('、');if(Array.isArray(a))return a.map(v=>{const o=(q.options||[]).find(x=>x.label===v);return v+(o&&Number(o.price||0)>0?'（'+money(o.price)+'）':'')}).join('、');if(q&&q.type==='single'){const o=(q.options||[]).find(x=>x.label===a);return String(a)+(o&&Number(o.price||0)>0?'（'+money(o.price)+'）':'')}return String(a)}
function renderMyOrder(editing){const o=state.myOrder;if(!o)return;const s=activeSurvey();const config=o.config||(s&&s.id===o.surveyId?s.config:{});const canEdit=!!(s&&s.id===o.surveyId&&s.config.allowUserEdit);$('main').innerHTML=`<section class="hero"><h2>我的訂單</h2><p>請再次確認餐點、客製化內容及應付金額。</p></section><div class="card"><div class="order-top"><b>訂單編號</b><span class="badge">已送出</span></div><div style="font-weight:900;font-size:18px;margin:8px 0">${esc(o.orderId)}</div><div class="small muted">${esc(o.name)} ・ ${esc(o.createdAt||'')}</div><div class="divider"></div>${answersSummary(config,o.answers)}<div class="total-box"><span>應付金額</span><strong>${money(o.amount)}</strong></div>${canEdit?`<button class="btn btn-primary btn-block" onclick="startUserEdit()">修改我的訂單</button>`:'<div class="notice">目前問卷未開放修改，仍可查看訂單內容。</div>'}<button class="btn btn-plain btn-block" style="margin-top:8px" onclick="loadPublic()">返回首頁</button></div>`}
function startUserEdit(){const o=state.myOrder,s=activeSurvey();if(!s||!s.config.allowUserEdit){toast('目前不能修改訂單');return}state.orderMode='edit';$('main').innerHTML=`<section class="hero"><h2>修改我的訂單</h2><p>修改完成後，系統會重新計算金額。</p></section><section class="card"><div class="field"><label>姓名</label><input id="custName" class="input" value="${esc(o.name)}" readonly></div><div class="field"><label>手機號碼（核對用）</label><input id="custPhone" class="input" value="${esc(o.phone)}" readonly></div><div id="questionForm">${(s.config.questions||[]).map(q=>renderQuestion(q)).join('')}</div><div class="total-box"><span>修改後金額</span><strong id="liveTotal">${money(o.amount)}</strong></div><div class="btn-row"><button class="btn btn-primary" onclick="saveUserEdit()">儲存修改</button><button class="btn btn-plain" onclick="renderMyOrder(false)">取消</button></div></section>`;populateAnswers(o.answers,s.config)}
function populateAnswers(answers,cfg){(cfg.questions||[]).forEach(q=>{const box=document.querySelector(`.question[data-qid="${q.id}"]`);if(!box)return;const a=answers[q.id];if(q.type==='text'||q.type==='textarea'){box.querySelector('[data-type]').value=a||''}else if(q.type==='single'){box.querySelectorAll('input').forEach(x=>x.checked=x.value===a)}else if(q.type==='multi'){box.querySelectorAll('input').forEach(x=>x.checked=Array.isArray(a)&&a.includes(x.value))}else if(q.type==='items'){const entries=(a&&a.items)||[];box.querySelectorAll('.item-option').forEach(el=>{const c=el.querySelector('.item-check'),found=entries.find(x=>x.label===c.value);c.checked=!!found;if(found){const qel=el.querySelector('.qty'),nel=el.querySelector('.note-input');if(qel)qel.value=found.qty;if(nel)nel.value=found.note||''}})}});updateLiveTotal()}
async function saveUserEdit(){if(!validateLocal())return;const o=state.myOrder;setBusy(true);try{const r=await call('updateMyOrder',{surveyId:o.surveyId,orderId:o.orderId,name:o.name,phone:o.phone,answers:collectAnswers()});if(!r.ok){toast(r.message);return}o.amount=r.amount;o.answers=collectAnswers();o.updatedAt=new Date().toISOString();state.orderMode='new';toast('訂單修改完成');renderMyOrder(false)}catch(e){toast(e.message)}finally{setBusy(false)}}

// 管理者介面
function adminLoginDialog(){modal(`<h3>🔐 管理者登入</h3><p class="small muted">請輸入管理者密碼以進入管理模式。</p><input id="adminPassword" class="input" type="password" inputmode="numeric" placeholder="管理者密碼" maxlength="64"><div class="btn-row" style="margin-top:14px"><button class="btn btn-primary" onclick="doAdminLogin()">登入</button><button class="btn btn-plain" onclick="closeModal()">取消</button></div>`);setTimeout(()=>$('adminPassword')&&$('adminPassword').focus(),50)}
async function doAdminLogin(){const pwd=$('adminPassword').value;setBusy(true);try{const r=await call('loginAdmin',pwd);if(!r.ok){toast(r.message);return}state.token=r.token;state.admin=true;closeModal();await loadAdmin()}catch(e){toast(e.message)}finally{setBusy(false)}}
async function loadAdmin(){try{const previous=state.selectedSurveyId;const r=await call('getAdminOverview',state.token);state.overview=r;state.selectedSurveyId=(r.surveys||[]).some(x=>x.id===previous)?previous:(r.openSurveyId||(r.surveys[0]&&r.surveys[0].id)||'');if(state.selectedSurveyId)await selectAdminSurvey(state.selectedSurveyId);else{state.adminSurvey=null;state.adminOrders=[]}renderAdmin()}catch(e){state.admin=false;state.token='';toast(e.message);loadPublic()}}
async function selectAdminSurvey(id){state.selectedSurveyId=id;if(!id){state.adminSurvey=null;state.adminOrders=[];return}const r=await call('getAdminSurvey',state.token,id);state.adminSurvey=r.survey;state.adminOrders=r.orders||[]}
function renderAdmin(){const s=state.adminSurvey;const tabs=`<div class="admin-tabs"><button class="tab ${state.adminTab==='builder'?'active':''}" onclick="setAdminTab('builder')">📝 問卷設計</button><button class="tab ${state.adminTab==='orders'?'active':''}" onclick="setAdminTab('orders')">📊 訂單統計</button><button class="tab ${state.adminTab==='history'?'active':''}" onclick="setAdminTab('history')">🗂 問卷歷史</button><button class="tab ${state.adminTab==='backup'?'active':''}" onclick="setAdminTab('backup')">☁️ 備份還原</button><button class="tab ${state.adminTab==='security'?'active':''}" onclick="setAdminTab('security')">🔐 密碼</button></div>`;
$('statusPill').innerHTML='<i class="dot" style="background:#8d7be8"></i>管理模式';$('main').innerHTML=`<section class="hero"><h2>管理者工作台</h2><p>建立團購問卷、管理訂單及整理店家下單資料。</p></section><div class="card"><div class="order-top"><b>目前管理問卷</b><button class="btn btn-plain" style="padding:7px 10px;font-size:12px" onclick="exitAdmin()">退出管理</button></div><select class="select" style="margin-top:9px" onchange="changeAdminSurvey(this.value)"><option value="">選擇問卷</option>${(state.overview.surveys||[]).map(x=>`<option value="${esc(x.id)}" ${x.id===state.selectedSurveyId?'selected':''}>${esc(x.title)}（${esc(x.status)}）</option>`).join('')}</select>${s?`<div class="notice" style="margin-top:10px">狀態：<b>${esc(s.status)}</b>　${s.status==='開放'?'使用者目前可以填寫':'使用者目前不能新增或修改'}</div>`:''}</div>${tabs}<div id="adminPanel">${renderAdminPanel()}</div>`}
function renderAdminPanel(){if(state.adminTab==='builder')return renderBuilder();if(state.adminTab==='orders')return renderOrders();if(state.adminTab==='history')return renderHistory();if(state.adminTab==='backup')return renderBackup();return renderSecurity()}
function setAdminTab(tab){state.adminTab=tab;renderAdmin();}
async function changeAdminSurvey(id){try{await selectAdminSurvey(id);renderAdmin()}catch(e){toast(e.message)}}
async function openSurveyOrders(id){try{await selectAdminSurvey(id);state.adminTab='orders';renderAdmin()}catch(e){toast(e.message)}}
function renderBuilder(){const s=state.adminSurvey;const cfg=s?s.config:{title:'',description:'',allowUserEdit:true,questions:[]};return `<div class="card"><h3>✨ 問卷基本資料</h3><div class="field"><label>問卷標題</label><input id="cfgTitle" class="input" maxlength="100" value="${esc(cfg.title)}" placeholder="例如：11/01 中午訂購便當"></div><div class="field"><label>問卷說明</label><textarea id="cfgDesc" class="textarea" maxlength="500" placeholder="填寫提醒、截止時間等">${esc(cfg.description||'')}</textarea></div><label class="option"><input id="cfgAllowEdit" type="checkbox" ${cfg.allowUserEdit!==false?'checked':''}><span class="option-name">問卷開放期間，允許使用者修改已送出的訂單</span></label><div class="divider"></div><div class="order-top"><h3 style="margin:0">問卷題目</h3><button class="btn btn-secondary" style="padding:8px 11px" onclick="addQuestion()">＋ 新增題目</button></div><div id="questionEditors">${(cfg.questions||[]).map((q,i)=>questionEditor(q,i)).join('')||'<div class="notice">目前尚未新增題目。至少新增一題才能建立問卷。</div>'}</div><div class="btn-row" style="margin-top:16px"><button class="btn btn-primary" onclick="saveSurveyConfig(false)">${s?'儲存目前問卷':'儲存為新問卷'}</button><button class="btn btn-green" onclick="saveSurveyConfig(true)">建立新問卷並開放</button></div><p class="small muted">「建立新問卷並開放」會建立新的 Google 試算表，並自動關閉目前開放中的問卷。</p>${s?`<div class="divider"></div><div class="btn-row"><button class="btn ${s.status==='開放'?'btn-danger':'btn-green'}" onclick="toggleSurveyStatus()">${s.status==='開放'?'立即關閉問卷':'重新開放這份問卷'}</button><a class="btn btn-plain" style="text-align:center;text-decoration:none" href="${esc(s.spreadsheetUrl||'#')}" target="_blank">開啟訂單試算表 ↗</a></div>`:''}</div>`}
function questionEditor(q,i){return `<div class="question-editor" data-editor="${esc(q.id)}"><div class="editor-head"><strong>第 ${i+1} 題</strong><button class="mini-btn" style="padding:7px 10px" onclick="removeQuestion('${esc(q.id)}')">刪除</button></div><div class="field"><label>題目名稱</label><input class="input qe-label" value="${esc(q.label)}" placeholder="例如：餐點名稱"></div><div class="editor-grid"><div class="field"><label>題目類型</label><select class="select qe-type" onchange="typeChanged(this)"><option value="text" ${q.type==='text'?'selected':''}>簡答文字</option><option value="textarea" ${q.type==='textarea'?'selected':''}>長篇文字</option><option value="single" ${q.type==='single'?'selected':''}>單選題</option><option value="multi" ${q.type==='multi'?'selected':''}>複選題</option><option value="items" ${q.type==='items'?'selected':''}>餐點／飲料（含價格）</option></select></div><div class="field"><label>填寫規則</label><select class="select qe-required"><option value="true" ${q.required?'selected':''}>必填</option><option value="false" ${!q.required?'selected':''}>可不填</option></select></div></div><div class="qe-options ${['single','multi','items'].includes(q.type)?'':'hidden'}">${(q.options||[]).map(o=>optionEditor(o)).join('')}<button class="btn btn-plain" style="padding:8px 11px;font-size:12px" onclick="addOption(this)">＋ 新增選項</button><div class="qe-item-settings ${q.type==='items'?'':'hidden'}"><div class="field"><label>餐點選擇方式</label><select class="select qe-item-mode"><option value="multi" ${q.selectionMode!=='single'?'selected':''}>多選</option><option value="single" ${q.selectionMode==='single'?'selected':''}>單選</option></select></div><label class="option"><input type="checkbox" class="qe-qty" ${q.allowQuantity!==false?'checked':''}><span class="option-name">允許設定數量</span></label><label class="option"><input type="checkbox" class="qe-note" ${q.allowItemNote!==false?'checked':''}><span class="option-name">每個品項可填寫備註</span></label></div></div></div>`}
function optionEditor(o){return `<div class="option-editor"><input class="oe-name" value="${esc(o.label)}" placeholder="選項名稱"><input class="oe-price" type="number" min="0" step="1" value="${Number(o.price||0)}" placeholder="價格"><button class="mini-btn" onclick="this.parentElement.remove()">×</button></div>`}
function addQuestion(){const id='q'+Date.now()+Math.random().toString(36).slice(2,5);const q={id,label:'',type:'text',required:true,options:[],selectionMode:'multi',allowQuantity:true,allowItemNote:true};const root=$('questionEditors');if(root.querySelector('.notice'))root.innerHTML='';root.insertAdjacentHTML('beforeend',questionEditor(q,root.querySelectorAll('.question-editor').length));}
function removeQuestion(id){const el=document.querySelector(`[data-editor="${id}"]`);if(el)el.remove();document.querySelectorAll('.question-editor').forEach((x,i)=>x.querySelector('.editor-head strong').textContent='第 '+(i+1)+' 題')}
function addOption(btn){btn.insertAdjacentHTML('beforebegin',optionEditor({label:'',price:0}))}
function typeChanged(sel){const box=sel.closest('.question-editor');const type=sel.value;box.querySelector('.qe-options').classList.toggle('hidden',!['single','multi','items'].includes(type));box.querySelector('.qe-item-settings').classList.toggle('hidden',type!=='items');box.querySelectorAll('.oe-price').forEach(x=>x.disabled=!['single','multi','items'].includes(type))}
function collectConfig(){const questions=[];document.querySelectorAll('.question-editor').forEach(el=>{const type=el.querySelector('.qe-type').value;const options=Array.from(el.querySelectorAll('.option-editor')).map(x=>({label:x.querySelector('.oe-name').value.trim(),price:Number(x.querySelector('.oe-price').value||0)})).filter(x=>x.label);questions.push({id:el.dataset.editor,label:el.querySelector('.qe-label').value.trim(),type,required:el.querySelector('.qe-required').value==='true',options,allowQuantity:el.querySelector('.qe-qty')?el.querySelector('.qe-qty').checked:true,allowItemNote:el.querySelector('.qe-note')?el.querySelector('.qe-note').checked:true,selectionMode:el.querySelector('.qe-item-mode')?el.querySelector('.qe-item-mode').value:'multi'})});return {title:$('cfgTitle').value.trim(),description:$('cfgDesc').value.trim(),allowUserEdit:$('cfgAllowEdit').checked,questions}}
async function saveSurveyConfig(createNew){const cfg=collectConfig();if(!cfg.title){toast('請輸入問卷標題');return}if(!cfg.questions.length){toast('請至少新增一個題目');return}if(!confirm(createNew?'建立新問卷會關閉目前開放中的問卷，並建立一份新的 Google 試算表。確定繼續？':'確定儲存問卷設定？'))return;setBusy(true);try{let r;if(createNew){r=await call('createNewSurvey',state.token,cfg);state.selectedSurveyId=r.surveyId}else if(state.adminSurvey){r=await call('updateSurveyConfig',state.token,state.adminSurvey.id,cfg)}else{r=await call('createNewSurvey',state.token,cfg);state.selectedSurveyId=r.surveyId}toast(r.message);await loadAdmin();state.adminTab='builder';renderAdmin()}catch(e){toast(e.message)}finally{setBusy(false)}}
async function toggleSurveyStatus(){const s=state.adminSurvey;if(!s)return;const open=s.status!=='開放';if(!confirm(open?'確定重新開放這份問卷？其他開放中的問卷會自動關閉。':'確定關閉問卷？使用者將不能新增或修改訂單，但仍可查詢自己的訂單。'))return;setBusy(true);try{const r=await call('setSurveyStatus',state.token,s.id,open);toast(r.message);await loadAdmin()}catch(e){toast(e.message)}finally{setBusy(false)}}
function renderOrders(){const s=state.adminSurvey;const orders=state.adminOrders||[];if(!s)return `<div class="card"><div class="notice">請先建立或選擇一份問卷。</div></div>`;const total=orders.reduce((a,o)=>a+Number(o.amount||0),0);const itemSummary=buildSummaryClient(s.config,orders);return `<div class="card"><h3>📊 訂單統計</h3><div class="stat-grid"><div class="stat"><b>${orders.length}</b><span>訂單筆數</span></div><div class="stat"><b>${money(total)}</b><span>訂單總金額</span></div><div class="stat"><b>${orders.reduce((n,o)=>n+Number(o.amount||0),0)?orders.length:0}</b><span>有效訂單</span></div></div><div class="btn-row" style="margin-top:13px"><button class="btn btn-primary" onclick="exportExcel()">⬇ 匯出 Excel</button><button class="btn btn-plain" onclick="refreshAdminSurvey()">重新整理</button></div></div><div class="card"><h3>🧾 每位使用者訂單</h3>${orders.length?orders.map(o=>`<div class="order-card"><div class="order-top"><b>${esc(o.name)}</b><span class="amount">${money(o.amount)}</span></div><div class="small muted">${esc(o.orderId)} ・ ${esc(o.phone)} ・ ${esc(o.createdAt)}</div>${answersSummary(s.config,o.answers)}<button class="btn btn-plain" style="width:100%;margin-top:6px" onclick="editAdminOrder('${esc(o.orderId)}')">管理者修改此筆訂單</button></div>`).join(''):'<div class="notice">目前尚無訂單。</div>'}</div><div class="card"><h3>🍱 店家下單統計</h3>${itemSummary.length?itemSummary.map(x=>`<div class="order-top" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${esc(x.label)}</span><b>${x.count} 份</b></div>`).join(''):'<div class="muted small">目前沒有可彙總的餐點選項。</div>'}</div>`}
function buildSummaryClient(cfg,orders){const map={};(cfg.questions||[]).forEach(q=>orders.forEach(o=>{const a=o.answers&&o.answers[q.id];let vals=[];if(q.type==='items'&&a&&a.items)vals=a.items.map(x=>({label:x.label+(x.note?'（備註：'+x.note+'）':''),count:x.qty||1}));else if(q.type==='single'&&a)vals=[{label:a,count:1}];else if(q.type==='multi'&&Array.isArray(a))vals=a.map(label=>({label,count:1}));else if((q.type==='text'||q.type==='textarea')&&String(a||'').trim())vals=[{label:'文字回覆：'+String(a).trim(),count:1}];vals.forEach(v=>{const key=q.label+'|'+v.label;map[key]=map[key]||{label:q.label+'：'+v.label,count:0};map[key].count+=v.count})}));return Object.values(map)}
function renderHistory(){const list=state.overview.surveys||[];return `<div class="card"><h3>🗂 問卷歷史</h3><p class="small muted">每份問卷都有獨立試算表。舊問卷關閉後仍保留訂單，可查詢、統計及匯出。</p>${list.length?list.map(s=>`<div class="history-item"><div class="order-top"><b>${esc(s.title)}</b><span class="badge ${s.status==='開放'?'':'closed'}">${esc(s.status)}</span></div><div class="small muted">建立：${esc(s.createdAt||'')}</div><div class="btn-row" style="margin-top:9px"><button class="btn btn-plain" onclick="openSurveyOrders('${esc(s.id)}')">查看訂單</button><a class="btn btn-plain" style="text-decoration:none;text-align:center" target="_blank" href="${esc(s.spreadsheetUrl||'#')}">開啟試算表</a></div></div>`).join(''):'<div class="notice">尚無問卷紀錄。</div>'}<button class="btn btn-primary btn-block" style="margin-top:12px" onclick="setAdminTab('builder')">＋ 設計新問卷</button></div>`}
function renderBackup(){return `<div class="card"><h3>☁️ 雲端備份與還原</h3><p class="small muted">備份包含問卷設定、歷史問卷及所有訂單。系統每日自動備份，並保留最近 20 個版本。</p><button class="btn btn-primary btn-block" onclick="backupNow()">立即建立備份</button><div class="divider"></div><div class="order-top"><b>雲端備份版本</b><button class="btn btn-plain" style="padding:7px 10px" onclick="loadBackups()">重新整理</button></div><div id="backupList"><div class="muted small">按「重新整理」載入備份清單。</div></div></div>`}
async function backupNow(){setBusy(true);try{const r=await call('backupNow',state.token);toast('備份完成：'+r.name);await loadBackups()}catch(e){toast(e.message)}finally{setBusy(false)}}
async function loadBackups(){setBusy(true);try{const list=await call('listBackups',state.token);$('backupList').innerHTML=list.length?list.map(b=>`<div class="history-item"><b>${esc(b.name)}</b><div class="small muted">${esc(b.createdAt)} ・ ${(b.size/1024).toFixed(1)} KB</div><button class="btn btn-plain" style="margin-top:8px;width:100%" onclick="previewAndRestore('${esc(b.id)}')">預覽並還原這個版本</button></div>`).join(''):'<div class="notice">目前沒有備份檔案。</div>'}catch(e){toast(e.message)}finally{setBusy(false)}}
async function previewAndRestore(id){setBusy(true);try{const p=await call('previewRestore',state.token,id);setBusy(false);if(!confirm(`還原預覽\n備份時間：${p.createdAt}\n問卷數：${p.surveyCount}\n訂單數：${p.orderCount}\n問卷：${p.titles.join('、')}\n\n還原會以新試算表重建備份內容，不刪除目前試算表。確定還原？`))return;setBusy(true);const r=await call('restoreBackup',state.token,id);toast(r.message);await loadAdmin()}catch(e){toast(e.message)}finally{setBusy(false)}}
function renderSecurity(){return `<div class="card"><h3>🔐 管理者密碼</h3><p class="small muted">密碼只儲存在 GAS 的 Script Properties，前端不會取得密碼或雜湊。</p><div class="field"><label>新密碼（至少 5 個字元）</label><input id="newAdminPassword" class="input" type="password" maxlength="64" placeholder="輸入新密碼"></div><div class="field"><label>再次輸入新密碼</label><input id="confirmAdminPassword" class="input" type="password" maxlength="64" placeholder="再次輸入新密碼"></div><button class="btn btn-primary btn-block" onclick="changePassword()">修改管理者密碼</button></div>`}
async function changePassword(){const a=$('newAdminPassword').value,b=$('confirmAdminPassword').value;if(a.length<5){toast('新密碼至少需要 5 個字元');return}if(a!==b){toast('兩次輸入的密碼不一致');return}setBusy(true);try{const r=await call('changeAdminPassword',state.token,a);toast(r.message);$('newAdminPassword').value='';$('confirmAdminPassword').value=''}catch(e){toast(e.message)}finally{setBusy(false)}}
async function refreshAdminSurvey(){try{await selectAdminSurvey(state.selectedSurveyId);renderAdmin()}catch(e){toast(e.message)}}
async function editAdminOrder(orderId){const o=state.adminOrders.find(x=>x.orderId===orderId);if(!o)return;const s=state.adminSurvey;state.editingOrder=o;modal(`<h3>管理者修改訂單</h3><p class="small muted">${esc(o.name)} ・ ${esc(o.orderId)}</p><div id="adminEditQuestions">${s.config.questions.map(q=>renderQuestion(q)).join('')}</div><div class="total-box"><span>重新計算金額</span><strong id="adminEditTotal">${money(o.amount)}</strong></div><div class="btn-row"><button class="btn btn-primary" onclick="saveAdminOrder()">儲存</button><button class="btn btn-plain" onclick="closeModal()">取消</button></div>`);populateAdminEditAnswers(o.answers,s.config);}
function populateAdminEditAnswers(answers,cfg){document.querySelectorAll('#adminEditQuestions .question').forEach(box=>{const q=cfg.questions.find(x=>x.id===box.dataset.qid),a=answers[q.id];if(q.type==='text'||q.type==='textarea')box.querySelector('[data-type]').value=a||'';else if(q.type==='single')box.querySelectorAll('input').forEach(x=>x.checked=x.value===a);else if(q.type==='multi')box.querySelectorAll('input').forEach(x=>x.checked=Array.isArray(a)&&a.includes(x.value));else if(q.type==='items'){(a&&a.items||[]).forEach(item=>{const el=Array.from(box.querySelectorAll('.item-option')).find(x=>x.querySelector('.item-check').value===item.label);if(el){el.querySelector('.item-check').checked=true;if(el.querySelector('.qty'))el.querySelector('.qty').value=item.qty;if(el.querySelector('.note-input'))el.querySelector('.note-input').value=item.note||''}})}});updateAdminEditTotal()}
function collectAdminEditAnswers(){const obj={};document.querySelectorAll('#adminEditQuestions .question').forEach(box=>{const q=state.adminSurvey.config.questions.find(x=>x.id===box.dataset.qid);if(q.type==='text'||q.type==='textarea')obj[q.id]=box.querySelector('[data-type]').value.trim();else if(q.type==='single'){const v=box.querySelector('input:checked');obj[q.id]=v?v.value:''}else if(q.type==='multi')obj[q.id]=Array.from(box.querySelectorAll('input:checked')).map(x=>x.value);else{obj[q.id]={items:Array.from(box.querySelectorAll('.item-option')).filter(x=>x.querySelector('.item-check').checked).map(x=>({label:x.querySelector('.item-check').value,qty:x.querySelector('.qty')?Math.floor(Number(x.querySelector('.qty').value)||1):1,price:Number(x.querySelector('.item-check').dataset.price||0),note:x.querySelector('.note-input')?x.querySelector('.note-input').value:''}))}}});return obj}
function updateAdminEditTotal(){if(!state.adminSurvey)return;const n=moneyFromAnswers(state.adminSurvey.config,collectAdminEditAnswers());const el=$('adminEditTotal');if(el)el.textContent=money(n)}
document.addEventListener('change',e=>{if(e.target.closest&&e.target.closest('#adminEditQuestions'))updateAdminEditTotal()});document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#adminEditQuestions'))updateAdminEditTotal()});
async function saveAdminOrder(){const o=state.editingOrder;setBusy(true);try{const r=await call('adminUpdateOrder',state.token,{surveyId:state.selectedSurveyId,orderId:o.orderId,answers:collectAdminEditAnswers()});toast(r.message);closeModal();await refreshAdminSurvey()}catch(e){toast(e.message)}finally{setBusy(false)}}
async function exportExcel(){setBusy(true);try{const r=await call('exportSurveyExcel',state.token,state.selectedSurveyId);const bin=atob(r.base64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=r.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Excel 匯出完成')}catch(e){toast('匯出失敗：'+e.message)}finally{setBusy(false)}}
function exitAdmin(){state.admin=false;state.token='';state.adminSurvey=null;state.adminOrders=[];loadPublic()}
function modal(html){$('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
$('logoTap').addEventListener('click',()=>{state.logoClicks++;clearTimeout(state.logoTimer);state.logoTimer=setTimeout(()=>state.logoClicks=0,2500);if(state.logoClicks>=5){state.logoClicks=0;adminLoginDialog()}});
loadPublic();
</script>
</body>
</html>
