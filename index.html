<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFC928">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="真好點">
  <meta name="application-name" content="真好點問卷系統">
  <style>
    :root{--yellow:#ffc928;--yellow2:#ffe58b;--orange:#ff8d3a;--pink:#ff7797;--green:#4dbb83;--blue:#69b8ed;--ink:#34302a;--muted:#827b70;--paper:#fffdf7;--line:#f0e6d0;--shadow:0 10px 28px rgba(109,82,20,.10)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff8df 0%,#fffdf8 42%,#fff1e6 100%);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;min-height:100vh}
    button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.55;cursor:not-allowed}a{color:#246eae}
    .app{max-width:900px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
    .top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.logo{width:58px;height:58px;border-radius:19px;background:linear-gradient(145deg,#ffe578,#ffad30);display:grid;place-items:center;box-shadow:0 7px 15px #e8af3c55;user-select:none;touch-action:manipulation;flex:none;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}.brand h1{font-size:23px;margin:0;font-weight:950;letter-spacing:1px}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.top-right{margin-left:auto;display:flex;align-items:center;gap:7px}.install-btn{padding:8px 10px;border-radius:99px;background:#fff3c6;border:1px solid #edc54c;color:#76520e;font-size:12px;font-weight:900;white-space:nowrap;box-shadow:0 3px 9px #c58b2220}.install-btn:active{transform:scale(.97)}.install-btn.installed{background:#e8f8ed;border-color:#b9dfc3;color:#27794a}.install-strip{display:flex;justify-content:flex-end;align-items:center;margin:-5px 0 13px}.install-strip .install-hint{font-size:11px;color:#94866f;margin-right:9px}.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:800;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
    .hero{border-radius:26px;padding:23px;background:linear-gradient(125deg,#ffdc67,#ffb54e 55%,#ff9672);color:#573719;position:relative;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}.hero:after{content:"✦";position:absolute;right:24px;bottom:-36px;font-size:135px;opacity:.22;transform:rotate(18deg)}.hero h2{font-size:23px;margin:0 0 7px;max-width:78%;line-height:1.35}.hero p{font-size:13px;margin:0;max-width:77%;line-height:1.65}
    .card{background:rgba(255,255,255,.95);border:1px solid rgba(242,226,190,.9);border-radius:22px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}.card h3{margin:0 0 14px;font-size:17px}.section-title{display:flex;align-items:center;gap:8px}.section-title h3{margin:0}.emoji{font-size:22px}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.field{margin:13px 0}.field label,.field-label{display:block;font-weight:850;font-size:14px;margin-bottom:7px}.required{font-size:10px;color:#e45763;background:#fff0f0;padding:3px 7px;border-radius:99px;margin-left:6px}.optional{font-size:10px;color:#7a8b54;background:#f2f8e9;padding:3px 7px;border-radius:99px;margin-left:6px}
    .input,.textarea,.select{width:100%;border:1.5px solid #e9dfcc;background:#fffefa;border-radius:13px;padding:12px 13px;outline:none;color:var(--ink);min-height:45px}.input:focus,.textarea:focus,.select:focus{border-color:#eab82f;box-shadow:0 0 0 3px #ffd95d35}.textarea{min-height:84px;resize:vertical}
    .option-list{display:grid;gap:8px}.option{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1.5px solid #eee5d7;border-radius:14px;background:#fffefa}.option:has(input:checked){border-color:#f0be34;background:#fff9e5}.option input{accent-color:#e9a900;width:18px;height:18px}.option-name{flex:1;font-size:14px;font-weight:650}.price{font-size:13px;color:#d47b1c;font-weight:850}.qty-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.qty{width:72px;text-align:center;padding:7px;border:1px solid #e9dfcc;border-radius:10px}.note-input{margin-top:8px;font-size:13px}
    .btn{padding:12px 16px;border-radius:13px;font-weight:850;transition:transform .12s,filter .12s}.btn:active{transform:scale(.98)}.btn-primary{background:linear-gradient(135deg,#ffc928,#ffad35);color:#503715;box-shadow:0 5px 13px #e6ad3438}.btn-secondary{background:#fff3ce;color:#795719}.btn-plain{background:#f7f3e9;color:#665c4d}.btn-danger{background:#fff0ee;color:#bd4c43}.btn-green{background:#e8f8ed;color:#27794a}.btn-blue{background:#e8f3ff;color:#286a9c}.btn-block{width:100%}.btn-row{display:flex;gap:9px;flex-wrap:wrap}.btn-row>*{flex:1;min-width:115px}.total-box{background:#fff6d9;border:1px dashed #efbf3d;padding:14px 16px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;margin:14px 0}.total-box strong{font-size:25px;color:#c77b07}.notice{padding:12px 14px;border-radius:13px;background:#fff7df;color:#805e16;font-size:13px;line-height:1.65}.notice.error{background:#fff0ee;color:#b54e43}.notice.success{background:#eaf8ed;color:#28774a}.hidden{display:none!important}.divider{height:1px;background:var(--line);margin:14px 0}
    .survey-card{border:1px solid #f0e3c8;border-radius:18px;padding:15px;margin:10px 0;background:linear-gradient(145deg,#fffefa,#fff9e9)}.survey-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.survey-head h3{margin:0 0 5px;font-size:16px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:850;background:#eaf8ed;color:#357849;white-space:nowrap}.badge.closed{background:#f2efeb;color:#81776b}.badge.draft{background:#eaf3ff;color:#326d9c}.survey-meta{color:var(--muted);font-size:11px;margin:8px 0 11px}
    .admin-tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px;margin:0 0 12px}.tab{white-space:nowrap;padding:10px 13px;border-radius:12px;background:#f6f0e2;color:#75664f;font-weight:850;font-size:13px}.tab.active{background:#ffdd72;color:#60410d}
    .question-editor{border:1px solid #eee3ce;border-radius:16px;padding:13px;margin:12px 0;background:#fffefa}.editor-head{display:flex;align-items:center;gap:7px;margin-bottom:10px}.editor-head strong{flex:1}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.option-editor{display:grid;grid-template-columns:minmax(0,1fr) 88px 36px;gap:6px;margin:7px 0}.option-editor input{min-width:0;padding:9px;border:1px solid #e8dfce;border-radius:10px}.mini-btn{border-radius:10px;background:#fff0ed;color:#ba5548;font-weight:900}.checkline{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}.checkline input{accent-color:#d99a16;width:17px;height:17px}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px;background:#fff6df;border-radius:14px;text-align:center}.stat b{display:block;font-size:20px;color:#9b6c0a}.stat span{font-size:11px;color:#81745d}.order-card,.history-item{border:1px solid #eee3ce;border-radius:15px;padding:13px;margin:10px 0}.order-top{display:flex;gap:8px;align-items:center;justify-content:space-between}.amount{color:#c77b07;font-size:18px;font-weight:900}.answer-line{padding:7px 0;border-bottom:1px dashed #eee3ce;font-size:13px}.answer-line:last-child{border-bottom:0}.modal-backdrop{position:fixed;inset:0;background:#2d251b77;display:grid;place-items:center;padding:16px;z-index:30}.modal{width:min(100%,480px);max-height:90vh;overflow:auto;background:#fffdf7;border-radius:22px;padding:20px;box-shadow:0 20px 70px #0003}.modal h3{margin:0 0 13px}.toast{position:fixed;z-index:50;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:12px 18px;background:#332d25;color:white;border-radius:99px;font-size:13px;box-shadow:var(--shadow);max-width:90%;text-align:center}.loading{opacity:.68;pointer-events:none}.footer{text-align:center;color:#a69b88;font-size:11px;padding:16px 0 4px}.back{display:inline-flex;align-items:center;gap:5px;background:transparent;color:#80652b;padding:7px 0;font-weight:800}.link{background:none;color:#2475b8;padding:0;text-decoration:underline;font-size:12px}
    #gasBridge{position:absolute;width:1px;height:1px;left:-10000px;top:-10000px;border:0;opacity:0;pointer-events:none}
    @media(min-width:680px){.app{padding-top:24px}.hero{padding:29px}.hero h2{font-size:27px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .field{margin:6px 0 12px}.survey-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.survey-grid .survey-card{margin:0}.admin-layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}.admin-layout .card{margin:0}}
  </style>

  document.head.appendChild(appleIcon);
  window.__JQ_LOGO_DATA__ = icon192;
  window.__JQ_MANIFEST_URL__ = manifestUrl;
  window.addEventListener('pagehide', function() { URL.revokeObjectURL(manifestUrl); }, {once:true});

<body>
  <iframe id="gasBridge" title="真好點雲端服務" aria-hidden="true"></iframe>
  <div class="app">
    <header class="top">
      <div class="logo" id="logoTap" title="真好點問卷系統"><img id="logoImage" alt="真好點 Logo" /></div>

      <div class="top-right"><span class="pill" id="statusPill"><i class="dot"></i>連線中</span></div>
    </header>
    <div class="install-strip"><span class="install-hint">將真好點加入手機桌面</span><button class="install-btn" id="installBtn" type="button">📲 安裝為 APP</button></div>

    <div class="footer">真好點問卷系統 ・ 問卷設計與資料整理</div>
  </div>
  <div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
/* 部署完成後，將 GAS /exec 網址貼在下方，然後更新 GitHub Pages 的 index.html。 */
const GAS_EXEC_URL = 'https://script.google.com/macros/s/AKfycbxw-JED9O-aW_x39VIOZJYeTb4Ou57eito80nsnYcqR3YM4FMQH49XMa3lbTjALbg9klA/exec';
const CHANNEL = 'JINORDER_SURVEY_RPC_V1';
const state = {
  publicData:null, surveys:[], admin:false, token:'', adminTab:'surveys',
  activeSurvey:null, editingResponse:null, identity:null, lookupSurveyId:'',
  adminOverview:null, adminSurvey:null, adminResponses:[], editSurveyId:'',
  logoClicks:0, logoTimer:null, bridgeReady:false, bridgePort:null, bridgePending:new Map(), bridgeNonce:'', requestNo:0
};
let deferredInstallPrompt = null;
const $ = id => document.getElementById(id);
if ($('logoImage') && window.__JQ_LOGO_DATA__) $('logoImage').src = window.__JQ_LOGO_DATA__;
const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Number(n || 0).toLocaleString('zh-TW',{maximumFractionDigits:2});
const dateText = value => { if(!value)return ''; const d=new Date(value); return isNaN(d.getTime())?String(value):d.toLocaleString('zh-TW',{hour12:false}); };
function toast(message){const el=$('toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toast._timer);toast._timer=setTimeout(()=>el.classList.add('hidden'),3200)}
function setBusy(on){document.body.classList.toggle('loading',!!on)}
function showModal(html){$('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
function setStatus(text,ok=true){$('statusPill').innerHTML=`<i class="dot" style="background:${ok?'#4dbb83':'#e4a03c'}"></i>${esc(text)}`}

function makeBridgeNonce(){
  try{return Array.from(crypto.getRandomValues(new Uint8Array(18))).map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){return 'jq'+Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)}
}
function isTrustedGasOrigin(origin){
  try{
    const host=new URL(origin).hostname.toLowerCase();
    // Apps Script HTML Service 的實際 sandbox host 常是 n-xxxx-0lu-script.googleusercontent.com，
    // 注意它前面是連字號，不是 .script.googleusercontent.com。
    return host==='script.google.com'||
      host==='script.googleusercontent.com'||
      host.endsWith('.script.googleusercontent.com')||
      /^[a-z0-9-]+-script\.googleusercontent\.com$/.test(host);
  }catch(e){return false}
}
function setupBridge(){
  if(!GAS_EXEC_URL || GAS_EXEC_URL.indexOf('https://script.google.com/macros/s/')!==0){
    setStatus('待設定 API',false);renderBridgeSetup();return;
  }
  const frame=$('gasBridge');
  const nonce=makeBridgeNonce();
  state.bridgeNonce=nonce;

  // 收到 GAS 內層 sandbox frame 傳來的 MessagePort 後，後續 API 全走該 Port。
  // 這可避免 GitHub 只把訊息送到 GAS 外層 iframe、內層 userCodeAppPanel 收不到的巢狀 iframe 問題。
  window.addEventListener('message',event=>{
    if(!isTrustedGasOrigin(event.origin)||!event.data||event.data.channel!==CHANNEL||event.data.nonce!==nonce)return;
    if(event.data.type==='ready'){
      const port=event.ports&&event.ports[0];
      if(!port){setStatus('GAS 橋接錯誤',false);renderError('GAS 已載入，但沒有提供安全訊息通道。請更新 GAS 後端至 v7.0.0。');return;}
      if(state.bridgePort){try{state.bridgePort.close()}catch(e){}}
      state.bridgePort=port;
      state.bridgePort.onmessage=handleBridgePortMessage;
      if(state.bridgePort.start)state.bridgePort.start();
      if(state.bridgeReady)return;
      state.bridgeReady=true;
      setStatus('雲端已連線');
      loadPublic();
      return;
    }
    if(event.data.type==='bridge_error'){
      setStatus('GAS 橋接錯誤',false);
      renderError(event.data.error||'GAS 橋接頁未能啟動。請重新部署最新 Code.gs。');
    }
  });
  frame.addEventListener('load',()=>{
    if(!state.bridgeReady)setStatus('GAS 頁面已載入，正在建立安全通道…',false);
  });
  frame.addEventListener('error',()=>{
    setStatus('GAS 載入失敗',false);
    renderError('瀏覽器無法載入 GAS 橋接頁。請確認網路、部署權限及 GAS 網頁應用程式網址。');
  });
  const bridgeUrl=new URL(GAS_EXEC_URL);
  bridgeUrl.searchParams.set('bridge','1');
  bridgeUrl.searchParams.set('nonce',nonce);
  frame.src=bridgeUrl.toString();

  setTimeout(()=>{
    if(!state.bridgeReady){
      setStatus('連線逾時',false);
      renderError('GAS 橋接頁已發出載入請求，但 25 秒內沒有收到安全通道。請確認已將 GAS Code.gs 更新至 v7.0.0，並部署為「以我執行／所有人均可存取」。');
    }
  },25000);
}
function handleBridgePortMessage(event){
  const data=event&&event.data;
  if(!data||data.channel!==CHANNEL||data.nonce!==state.bridgeNonce)return;
  if(data.type==='response'){
    const pending=state.bridgePending.get(data.id);if(!pending)return;
    clearTimeout(pending.timer);state.bridgePending.delete(data.id);
    if(data.ok)pending.resolve(data.result);else pending.reject(new Error(data.error||'雲端服務發生錯誤'));
  }
}
function api(method,...args){
  return new Promise((resolve,reject)=>{
    if(!state.bridgeReady||!state.bridgePort){reject(new Error('雲端連線尚未就緒，請稍候或重新整理。'));return;}
    const id='r'+(++state.requestNo)+'_'+Date.now();
    const timer=setTimeout(()=>{state.bridgePending.delete(id);reject(new Error('雲端回應逾時，請稍後再試。'));},45000);
    state.bridgePending.set(id,{resolve,reject,timer});
    try{
      state.bridgePort.postMessage({channel:CHANNEL,nonce:state.bridgeNonce,type:'request',id,method,args});
    }catch(err){
      clearTimeout(timer);state.bridgePending.delete(id);reject(err);
    }
  });
}

function isRunningStandalone(){
  return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;
}
function hideInstallButton(){
  const btn=$('installBtn');if(btn)btn.hidden=true;
}
function markPwaInstalled(){
  try{localStorage.setItem('jq_pwa_installed','1')}catch(e){}
}
function installApp(){
  if(isRunningStandalone()){
    hideInstallButton();toast('真好點已經安裝在這台裝置上了。');return;
  }
  if(deferredInstallPrompt){
    const promptEvent=deferredInstallPrompt;
    deferredInstallPrompt=null;
    promptEvent.prompt();
    Promise.resolve(promptEvent.userChoice).then(choice=>{
      if(choice&&choice.outcome==='accepted')toast('已接受安裝真好點，請依手機畫面完成安裝。');
      const btn=$('installBtn');if(btn)btn.textContent='📲 安裝為 APP';
    }).catch(()=>{});
    return;
  }
  showModal(`<h3>📲 將真好點安裝到手機</h3><p>目前瀏覽器尚未提供自訂安裝視窗，仍可從瀏覽器選單安裝：</p><div class="notice">Android Chrome：<br>1. 點右上角「⋮」。<br>2. 選擇「安裝應用程式」或「新增至主畫面」。<br>3. 依照畫面確認，即可將真好點加入手機桌面。<br><br>請使用 Chrome 正常瀏覽模式，不要使用 LINE、Facebook 等 App 內建瀏覽器。</div><p class="tiny muted">beforeinstallprompt 是否出現由瀏覽器依安裝條件決定；按鈕會保留手動安裝指引，不會假裝已叫出系統安裝視窗。</p><button class="btn btn-primary btn-block" onclick="closeModal()">知道了</button>`);
}
function initPwaInstall(){
  const btn=$('installBtn');
  if(!btn)return;
  btn.textContent='📲 安裝為 APP';
  btn.addEventListener('click',installApp);
  // 只在目前真的以獨立 App 模式執行時隱藏安裝按鈕。
  // 不使用舊 localStorage 記錄判斷，避免使用者解除安裝後按鈕仍被永久隱藏。
  if(isRunningStandalone()){
    markPwaInstalled();
    hideInstallButton();return;
  }
  // 不是每個瀏覽器都會提供 beforeinstallprompt；未提供時仍保留手動安裝說明按鈕。
  window.addEventListener('beforeinstallprompt',event=>{
    event.preventDefault();
    deferredInstallPrompt=event;
    btn.textContent='📲 立即安裝 APP';
    btn.hidden=false;
  });
  window.addEventListener('appinstalled',()=>{
    deferredInstallPrompt=null;markPwaInstalled();hideInstallButton();toast('真好點已成功安裝！');
  });
  // 若使用者已從瀏覽器安裝後再回到分頁，display-mode 可辨識獨立視窗。
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&isRunningStandalone())hideInstallButton();});
}
function renderBridgeSetup(){
  $('main').innerHTML=`<section class="hero"><h2>歡迎使用真好點問卷系統</h2><p>同一個網址管理多份問卷，問卷結果集中保存於 Google 試算表。</p></section><section class="card"><h3>尚未設定 GAS 連線網址</h3><div class="notice">請先完成 GAS 部署，再將產生的網頁應用程式 /exec 網址填入 index.html 最上方的 GAS_EXEC_URL，提交 GitHub 後重新整理本頁。</div><p class="small muted">這個 GitHub Pages 網址是管理者與使用者共用的正式入口；GAS /exec 只在背景作為資料服務。</p></section>`;
}
function renderError(message){$('main').innerHTML=`<section class="hero"><h2>雲端連線暫時中斷</h2><p>請確認網路及 GAS 部署設定。</p></section><div class="card"><div class="notice error">${esc(message)}</div><button class="btn btn-primary btn-block" style="margin-top:12px" onclick="loadPublic()">重新連線</button></div>`}

async function loadPublic(){
  try{setBusy(true);const data=await api('getPublicData');state.publicData=data;state.surveys=data.surveys||[];setStatus('雲端已連線');renderHome();}
  catch(err){setStatus('連線失敗',false);renderError(err.message)}finally{setBusy(false)}
}
function renderHome(){
  const open=state.surveys.filter(s=>s.status==='開放中');
  const hasAnySurvey=state.surveys.length>0;
  const emptyMessage=hasAnySurvey
    ? '目前沒有問卷進行中，請稍後再來。所有已結束問卷仍可在下方查詢自己的回覆。'
    : '目前沒有問卷進行中，請稍後再來。管理者建立並開放問卷後，這裡就會自動顯示。';
  $('main').innerHTML=`<section class="hero"><h2>每一份回答，都值得好好收集！</h2><p>選擇下方開放中的問卷開始填寫。不同活動、團購或調查，可以同時進行。</p></section>
    <section class="card"><div class="section-title"><span class="emoji">📝</span><h3>目前開放中的問卷</h3><span class="badge">${open.length} 份</span></div>
      ${open.length?`<div class="survey-grid">${open.map(s=>`<div class="survey-card"><div class="survey-head"><div><h3>${esc(s.title)}</h3><div class="tiny muted">${esc(s.description||'歡迎填寫本問卷')}</div></div><span class="badge">開放中</span></div><div class="survey-meta">建立時間：${esc(dateText(s.createdAt))}</div><div class="btn-row"><button class="btn btn-primary" onclick="openSurvey('${esc(s.id)}')">開始填寫</button><button class="btn btn-plain" onclick="openLookup('${esc(s.id)}')">查詢回覆</button></div></div>`).join('')}</div>`:`<div class="notice"><strong>目前沒有問卷進行中……</strong><br>${esc(emptyMessage)}</div>`}
    </section>
    <section class="card"><div class="section-title"><span class="emoji">🔎</span><h3>查詢以前的回覆</h3></div><p class="small muted">問卷結束後仍可查詢自己的回覆。必須輸入填寫時相同的姓名及電話，系統不會顯示其他人的資料。</p>
      ${hasAnySurvey?`<div class="field"><label>選擇問卷</label><select id="lookupSurveySelect" class="select">${state.surveys.map(s=>`<option value="${esc(s.id)}">${esc(s.title)}（${esc(s.status)}）</option>`).join('')}</select></div><button class="btn btn-secondary btn-block" onclick="openLookup($('lookupSurveySelect').value)">查詢我的回覆</button>`:'<div class="notice">目前尚未建立任何問卷，暫時沒有可查詢的回覆。</div>'}
    </section>`;
}
async function openSurvey(id,existing){
  try{setBusy(true);const result=await api('getPublicSurvey',id);state.activeSurvey=result.survey;state.editingResponse=existing||null;renderSurveyForm(existing?existing.answers:null);}
  catch(err){toast(err.message)}finally{setBusy(false)}
}
function renderQuestion(q,answers){
  const required=q.required?'<span class="required">必填</span>':'<span class="optional">選填</span>';
  const answer=answers?answers[q.id]:null;
  let body='';
  if(q.type==='text')body=`<input class="input" data-answer="text" maxlength="3000" value="${esc(answer||'')}" placeholder="請輸入${esc(q.label)}">`;
  else if(q.type==='textarea')body=`<textarea class="textarea" data-answer="textarea" maxlength="3000" placeholder="請輸入${esc(q.label)}">${esc(answer||'')}</textarea>`;
  else if(q.type==='date')body=`<input class="input" type="date" data-answer="date" value="${esc(answer||'')}">`;
  else if(q.type==='number')body=`<input class="input" type="number" step="any" data-answer="number" value="${answer==null?'':esc(answer)}" placeholder="請輸入數字">`;
  else if(q.type==='rating')body=`<div class="option-list">${[1,2,3,4,5].map(n=>`<label class="option"><input type="radio" name="rating_${esc(q.id)}" value="${n}" ${Number(answer)===n?'checked':''}><span class="option-name">${'★'.repeat(n)}${'☆'.repeat(5-n)}</span><b>${n} 分</b></label>`).join('')}</div>`;
  else if(q.type==='single'||q.type==='multi')body=`<div class="option-list">${(q.options||[]).map(o=>{const checked=q.type==='single'?answer===o.id:Array.isArray(answer)&&answer.includes(o.id);return `<label class="option"><input type="${q.type==='single'?'radio':'checkbox'}" name="${q.type}_${esc(q.id)}" value="${esc(o.id)}" ${checked?'checked':''}><span class="option-name">${esc(o.label)}</span>${Number(o.price||0)?`<span class="price">${money(o.price)}</span>`:''}</label>`}).join('')}</div>`;
  else if(q.type==='dropdown')body=`<select class="select" data-answer="dropdown"><option value="">請選擇</option>${(q.options||[]).map(o=>`<option value="${esc(o.id)}" ${answer===o.id?'selected':''}>${esc(o.label)}${Number(o.price||0)?'（'+money(o.price)+'）':''}</option>`).join('')}</select>`;
  else if(q.type==='items')body=`<div class="option-list">${(q.options||[]).map(o=>{const chosen=Array.isArray(answer)?answer.find(x=>x.optionId===o.id):null;return `<div class="option item-option"><input type="checkbox" class="item-check" value="${esc(o.id)}" ${chosen?'checked':''}><div style="flex:1;min-width:0"><div class="option-name">${esc(o.label)} ${Number(o.price||0)?`<span class="price">${money(o.price)}</span>`:''}</div><div class="qty-row"><span class="tiny muted">數量</span><input class="qty item-qty" type="number" min="1" max="${Number(q.maxQty||20)}" value="${chosen?Number(chosen.qty||1):1}"><input class="input note-input item-note" style="flex:1;min-width:110px;min-height:36px;padding:7px 9px" maxlength="300" placeholder="備註（選填）" value="${esc(chosen?chosen.note||'':'')}"></div></div></div>`}).join('')}</div>`;
  return `<div class="field question-box" data-qid="${esc(q.id)}" data-type="${esc(q.type)}"><label>${esc(q.label)}${required}</label>${body}</div>`;
}
function renderSurveyForm(initialAnswers){
  const s=state.activeSurvey;if(!s)return;
  const editing=!!state.editingResponse;
  const profile=state.identity||{};
  $('main').innerHTML=`<button class="back" onclick="renderHome()">← 返回問卷列表</button><section class="hero"><h2>${esc(s.title)}</h2><p>${esc(s.description||'請依照題目填寫資料。')}</p></section>
    ${s.status!=='開放中'?'<div class="notice">這份問卷已結束，只能查詢自己的回覆。</div>':''}
    <section class="card"><h3>填寫者資料</h3><div class="form-grid"><div class="field"><label>姓名<span class="required">必填</span></label><input id="profileName" class="input" maxlength="60" value="${esc(profile.name||'')}" placeholder="請輸入姓名"></div><div class="field"><label>手機／聯絡電話<span class="required">必填</span></label><input id="profilePhone" class="input" inputmode="tel" maxlength="20" value="${esc(profile.phone||'')}" placeholder="請輸入電話"></div></div><p class="tiny muted">姓名與電話用於查詢及核對自己的回覆；試算表只顯示電話末四碼。</p></section>
    <section class="card"><h3>問卷內容</h3><div id="questionForm">${s.questions.map(q=>renderQuestion(q,initialAnswers)).join('')}</div><div class="total-box"><span>本次金額（如有價格題目）</span><strong id="liveTotal">$0</strong></div>
      ${s.status==='開放中'?`<button class="btn btn-primary btn-block" onclick="submitCurrentSurvey()">${editing?'儲存修改':'確認並送出'}</button>`:''}
      <button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="openLookup('${esc(s.id)}')">查詢我的回覆</button>
    </section>`;
  updateLiveTotal();
  $('questionForm').addEventListener('change',updateLiveTotal);$('questionForm').addEventListener('input',updateLiveTotal);
}
function collectAnswers(){
  const out={};
  document.querySelectorAll('#questionForm .question-box').forEach(box=>{
    const id=box.dataset.qid,type=box.dataset.type;
    if(type==='text'||type==='textarea'||type==='date'||type==='number'){const el=box.querySelector('[data-answer]');out[id]=el?el.value:'';}
    else if(type==='rating'){const x=box.querySelector('input:checked');out[id]=x?Number(x.value):'';}
    else if(type==='single'){const x=box.querySelector('input:checked');out[id]=x?x.value:'';}
    else if(type==='multi'){out[id]=Array.from(box.querySelectorAll('input:checked')).map(x=>x.value);}
    else if(type==='dropdown'){const x=box.querySelector('[data-answer]');out[id]=x?x.value:'';}
    else if(type==='items'){out[id]=Array.from(box.querySelectorAll('.item-option')).filter(el=>el.querySelector('.item-check').checked).map(el=>({optionId:el.querySelector('.item-check').value,qty:Number(el.querySelector('.item-qty').value)||1,note:el.querySelector('.item-note').value.trim()}));}
  });
  return out;
}
function currentAmount(){if(!state.activeSurvey)return 0;const answers=collectAnswers();let sum=0;state.activeSurvey.questions.forEach(q=>{const a=answers[q.id];if(q.type==='single'||q.type==='dropdown'){const o=(q.options||[]).find(x=>x.id===a);if(o)sum+=Number(o.price||0)}else if(q.type==='multi'&&Array.isArray(a)){a.forEach(id=>{const o=q.options.find(x=>x.id===id);if(o)sum+=Number(o.price||0)})}else if(q.type==='items'&&Array.isArray(a)){a.forEach(x=>{const o=q.options.find(y=>y.id===x.optionId);if(o)sum+=Number(o.price||0)*Number(x.qty||1)})}});return sum;}
function updateLiveTotal(){const el=$('liveTotal');if(el)el.textContent=money(currentAmount())}
async function submitCurrentSurvey(){
  const profile={name:$('profileName').value.trim(),phone:$('profilePhone').value.trim()};
  if(!profile.name||!profile.phone){toast('請填寫姓名及電話');return}
  const answers=collectAnswers();
  const total=currentAmount();
  const isEdit=!!state.editingResponse;
  if(!confirm(`${isEdit?'確認儲存修改':'確認送出問卷'}？\n姓名：${profile.name}\n金額：${money(total)}`))return;
  setBusy(true);
  try{
    let result;
    if(isEdit)result=await api('editMyResponse',state.activeSurvey.id,profile,state.editingResponse.responseId,answers);
    else result=await api('submitResponse',state.activeSurvey.id,profile,answers);
    if(result.duplicate){state.identity=profile;toast(result.message);openLookup(state.activeSurvey.id);return;}
    if(!result.ok)throw new Error(result.message||'送出失敗');
    state.identity=profile;state.editingResponse=null;

  }catch(err){toast(err.message)}finally{setBusy(false)}
}
function openLookup(surveyId){

  const remembered=state.identity||{};
  showModal(`<h3>查詢我的回覆</h3><p class="small muted">請輸入填寫時使用的姓名及電話，兩者必須一致。</p><div class="field"><label>姓名</label><input id="lookupName" class="input" maxlength="60" value="${esc(remembered.name||'')}" placeholder="請輸入姓名"></div><div class="field"><label>手機／聯絡電話</label><input id="lookupPhone" class="input" inputmode="tel" maxlength="20" value="${esc(remembered.phone||'')}" placeholder="請輸入電話"></div><div id="lookupResult"></div><div class="btn-row"><button class="btn btn-primary" onclick="doLookup()">查詢</button><button class="btn btn-plain" onclick="closeModal()">取消</button></div>`);
}
async function doLookup(){
  const profile={name:$('lookupName').value.trim(),phone:$('lookupPhone').value.trim()};
  if(!profile.name||!profile.phone){toast('請輸入姓名及電話');return}
  setBusy(true);
  try{
    const r=await api('lookupMyResponse',state.lookupSurveyId,profile);
    if(!r.found){$('lookupResult').innerHTML=`<div class="notice error">${esc(r.message||'查無資料')}</div>`;return}
    state.identity=profile;
    const surveyData=await api('getPublicSurvey',state.lookupSurveyId);state.activeSurvey=surveyData.survey;
    state.editingResponse=r.response;
    const s=state.activeSurvey,resp=r.response;
    $('lookupResult').innerHTML=`<div class="notice success">已找到你的回覆。<br>回覆編號：<b>${esc(resp.responseId)}</b><br>填寫時間：${esc(dateText(resp.submittedAt))}<br>金額：<b>${money(resp.amount)}</b></div><div class="order-card">${s.questions.map(q=>`<div class="answer-line"><b>${esc(q.label)}</b><br>${esc(formatAnswerForUi(q,resp.answers[q.id])||'（未填寫）')}</div>`).join('')}</div>${r.canEdit?'<button class="btn btn-primary btn-block" onclick="closeModal();openSurveyForEdit()">修改我的回覆</button>':'<div class="notice">這份問卷已結束或已停止修改，目前只能查看。</div>'}`;
  }catch(err){$('lookupResult').innerHTML=`<div class="notice error">${esc(err.message)}</div>`}finally{setBusy(false)}
}
function openSurveyForEdit(){const saved=state.editingResponse;renderSurveyForm(saved?saved.answers:null)}
function formatAnswerForUi(q,a){if(a==null||a===''||(Array.isArray(a)&&!a.length))return '';if(q.type==='single'||q.type==='dropdown'){const o=q.options.find(x=>x.id===a);return o?o.label:''}if(q.type==='multi')return (a||[]).map(id=>(q.options.find(x=>x.id===id)||{}).label||id).join('、');if(q.type==='items')return (a||[]).map(x=>{const o=q.options.find(y=>y.id===x.optionId);return (o?o.label:x.optionId)+' × '+x.qty+(x.note?'（'+x.note+'）':'')}).join('；');if(q.type==='rating')return a+' 分';return String(a)}

$('logoTap').addEventListener('click',()=>{state.logoClicks++;clearTimeout(state.logoTimer);state.logoTimer=setTimeout(()=>state.logoClicks=0,2400);if(state.logoClicks>=5){state.logoClicks=0;adminLoginDialog()}});
function adminLoginDialog(){showModal(`<h3>管理者登入</h3><p class="small muted">請輸入管理者密碼以進入問卷管理。</p><div class="field"><label>管理者密碼</label><input id="adminPassword" class="input" type="password" autocomplete="current-password" placeholder="請輸入密碼"></div><div id="loginError"></div><div class="btn-row"><button class="btn btn-primary" onclick="doAdminLogin()">登入</button><button class="btn btn-plain" onclick="closeModal()">取消</button></div>`);$('adminPassword').addEventListener('keydown',e=>{if(e.key==='Enter')doAdminLogin()})}

async function loadAdmin(){try{state.adminOverview=await api('getAdminOverview',state.token);state.adminTab='surveys';renderAdmin()}catch(err){toast(err.message);if(/逾期|重新登入/.test(err.message)){state.admin=false;state.token='';renderHome()}}}

}
function newQuestion(type='text') {return {id:'q'+Math.random().toString(36).slice(2,10),label:'',type:type,required:false,maxQty:20,options:['single','multi','dropdown','items'].includes(type)?[{id:'o'+Math.random().toString(36).slice(2,8),label:'選項一',price:0},{id:'o'+Math.random().toString(36).slice(2,8),label:'選項二',price:0}]:[]}}
function blankSurvey(){return {title:'',description:'',allowEdit:true,questions:[newQuestion('text')]}}
function newSurvey(){state.editSurveyId='';state.editDraft=blankSurvey();renderBuilder()}
async function editSurvey(id){setBusy(true);try{const r=await api('getPublicSurvey',id);state.editSurveyId=id;state.editDraft=JSON.parse(JSON.stringify(r.survey));renderBuilder()}catch(err){toast(err.message)}finally{setBusy(false)}}
function renderBuilder(){
  const s=state.editDraft||blankSurvey();
  $('adminContent').innerHTML=`<div class="card"><div class="section-title"><span class="emoji">🧩</span><h3>${state.editSurveyId?'編輯問卷':'設計新問卷'}</h3></div><div class="field"><label>問卷標題 *</label><input id="builderTitle" class="input" maxlength="120" value="${esc(s.title)}" placeholder="例如：員工旅遊報名調查"></div><div class="field"><label>問卷說明</label><textarea id="builderDescription" class="textarea" maxlength="1000" placeholder="填寫說明、截止日期等">${esc(s.description||'')}</textarea></div><label class="checkline"><input type="checkbox" id="builderAllowEdit" ${s.allowEdit!==false?'checked':''}> 使用者送出後，在問卷開放期間允許自行修改</label><div class="divider"></div><div class="order-top"><h3 style="margin:0">問卷題目</h3><span class="tiny muted">每題可設定必填或選填</span></div><div id="questionEditors">${s.questions.map((q,i)=>questionEditorHtml(q,i)).join('')}</div><div class="field"><label>新增題目類型</label><div class="editor-grid"><select id="newQuestionType" class="select"><option value="text">簡答題</option><option value="textarea">段落文字</option><option value="single">單選題</option><option value="multi">多選題</option><option value="dropdown">下拉選單</option><option value="date">日期題</option><option value="number">數字題</option><option value="rating">1～5 分評分</option><option value="items">商品／數量題</option></select><button class="btn btn-secondary" onclick="addQuestion()">＋ 新增題目</button></div></div><div class="btn-row"><button class="btn btn-primary" onclick="saveBuilder()">${state.editSurveyId?'儲存問卷修改':'建立並開放問卷'}</button><button class="btn btn-plain" onclick="setAdminTab('surveys')">返回問卷管理</button></div></div>`;
}
function questionEditorHtml(q,index){
  const choice=['single','multi','dropdown','items'].includes(q.type);
  return `<div class="question-editor" data-qid="${esc(q.id)}" data-index="${index}"><div class="editor-head"><strong>第 ${index+1} 題</strong><button class="mini-btn" style="padding:7px 10px" onclick="removeQuestion('${esc(q.id)}')">刪除</button></div><div class="field"><label>題目名稱</label><input class="input qe-label" maxlength="160" value="${esc(q.label)}" placeholder="請輸入題目"></div><div class="editor-grid"><div class="field"><label>題目類型</label><select class="select qe-type" onchange="changeQuestionType('${esc(q.id)}',this.value)">${[['text','簡答題'],['textarea','段落文字'],['single','單選題'],['multi','多選題'],['dropdown','下拉選單'],['date','日期題'],['number','數字題'],['rating','1～5 分評分'],['items','商品／數量題']].map(x=>`<option value="${x[0]}" ${q.type===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field"><label>填寫規則</label><label class="checkline" style="padding:12px 0"><input class="qe-required" type="checkbox" ${q.required?'checked':''}> 必填</label></div></div>${q.type==='items'?`<div class="field"><label>每項最多數量</label><input class="input qe-maxqty" type="number" min="1" max="99" value="${Number(q.maxQty||20)}"></div>`:''}${choice?`<div class="field"><label>選項設定（價格可填 0）</label><div class="qe-options">${(q.options||[]).map(o=>optionEditorHtml(o)).join('')}</div><button class="btn btn-plain btn-block" onclick="addOption('${esc(q.id)}')">＋ 新增選項</button><p class="tiny muted">價格用於團購或商品問卷；一般調查保持 0 即可。</p></div>`:''}</div>`;
}
function optionEditorHtml(o){return `<div class="option-editor" data-option-id="${esc(o.id)}"><input class="qe-option-label" maxlength="120" value="${esc(o.label)}" placeholder="選項名稱"><input class="qe-option-price" type="number" min="0" step="any" value="${Number(o.price||0)}" placeholder="價格"><button class="mini-btn" onclick="this.parentNode.remove()">×</button></div>`}
function readBuilderDraft(){
  const questions=[];
  document.querySelectorAll('#questionEditors .question-editor').forEach(box=>{
    const type=box.querySelector('.qe-type').value;
    const q={id:box.dataset.qid,label:box.querySelector('.qe-label').value.trim(),type,required:box.querySelector('.qe-required').checked,maxQty:Number(box.querySelector('.qe-maxqty')?.value||20),options:[]};
    box.querySelectorAll('.option-editor').forEach(op=>q.options.push({id:op.dataset.optionId,label:op.querySelector('.qe-option-label').value.trim(),price:Number(op.querySelector('.qe-option-price').value||0)}));
    questions.push(q);
  });
  return {title:$('builderTitle').value.trim(),description:$('builderDescription').value.trim(),allowEdit:$('builderAllowEdit').checked,questions};
}
function addQuestion(){const draft=readBuilderDraft();draft.questions.push(newQuestion($('newQuestionType').value));state.editDraft=draft;renderBuilder()}
function removeQuestion(id){const draft=readBuilderDraft();draft.questions=draft.questions.filter(q=>q.id!==id);if(!draft.questions.length)draft.questions.push(newQuestion('text'));state.editDraft=draft;renderBuilder()}
function changeQuestionType(id,type){const draft=readBuilderDraft();const q=draft.questions.find(x=>x.id===id);if(!q)return;q.type=type;if(['single','multi','dropdown','items'].includes(type)&&!q.options.length)q.options=[{id:'o'+Math.random().toString(36).slice(2,8),label:'選項一',price:0},{id:'o'+Math.random().toString(36).slice(2,8),label:'選項二',price:0}];state.editDraft=draft;renderBuilder()}
function addOption(id){const draft=readBuilderDraft();const q=draft.questions.find(x=>x.id===id);if(q)q.options.push({id:'o'+Math.random().toString(36).slice(2,8),label:'新選項',price:0});state.editDraft=draft;renderBuilder()}
async function saveBuilder(){
  const draft=readBuilderDraft();if(!draft.title){toast('請填寫問卷標題');return}if(!draft.questions.length){toast('至少需要一個題目');return}if(draft.questions.some(q=>!q.label)){toast('請填寫每一題的名稱');return}if(draft.questions.some(q=>['single','multi','dropdown','items'].includes(q.type)&&(!q.options.length||q.options.some(o=>!o.label)))){toast('選項題至少需要一個選項，而且選項名稱不可空白');return}
  setBusy(true);try{let r;if(state.editSurveyId)r=await api('saveSurvey',state.token,state.editSurveyId,draft);else r=await api('createSurvey',state.token,Object.assign({},draft,{initialStatus:'開放中'}));toast(r.message);state.editDraft=null;state.editSurveyId='';await loadAdmin()}catch(err){toast(err.message)}finally{setBusy(false)}
}
async function toggleSurveyStatus(id,current){const next=current==='開放中'?'已結束':'開放中';if(!confirm(`確定要將這份問卷改為「${next}」？`))return;setBusy(true);try{const r=await api('setSurveyStatus',state.token,id,next);toast(r.message);await loadAdmin()}catch(err){toast(err.message)}finally{setBusy(false)}}
async function viewResponses(id){setBusy(true);try{const r=await api('getAdminSurvey',state.token,id);state.adminSurvey=r.survey;state.adminResponses=r.responses;state.adminTab='responses';renderResponses()}catch(err){toast(err.message)}finally{setBusy(false)}}
function renderResponses(){
  const s=state.adminSurvey,list=state.adminResponses||[];const total=list.reduce((n,r)=>n+Number(r.amount||0),0);
  const stats=s.questions.map(q=>{
    const counts={};list.forEach(r=>{const a=r.answers[q.id];if(q.type==='single'||q.type==='dropdown'){const o=q.options.find(x=>x.id===a);if(o)counts[o.label]=(counts[o.label]||0)+1}else if(q.type==='multi'){(a||[]).forEach(id=>{const o=q.options.find(x=>x.id===id);if(o)counts[o.label]=(counts[o.label]||0)+1})}else if(q.type==='items'){(a||[]).forEach(x=>{const o=q.options.find(y=>y.id===x.optionId);if(o)counts[o.label]=(counts[o.label]||0)+Number(x.qty||1)})}});
    return Object.keys(counts).length?`<div class="history-item"><b>${esc(q.label)}</b>${Object.entries(counts).map(([k,v])=>`<div class="answer-line">${esc(k)}：${v}</div>`).join('')}</div>`:'';
  }).join('');
  $('main').innerHTML=`<button class="back" onclick="loadAdmin()">← 返回管理中心</button><section class="hero"><h2>${esc(s.title)}</h2><p>問卷回覆及統計資料</p></section><div class="card"><div class="stat-grid"><div class="stat"><b>${list.length}</b><span>回覆筆數</span></div><div class="stat"><b>${money(total)}</b><span>金額合計</span></div><div class="stat"><b>${s.status==='開放中'?'開放中':'已結束'}</b><span>問卷狀態</span></div></div><button class="btn btn-green btn-block" style="margin-top:12px" onclick="exportSurveyExcel('${esc(s.id)}')">下載 Excel（.xlsx）</button></div><div class="card"><h3>選項統計</h3>${stats||'<div class="muted small">目前沒有可統計的選項題。</div>'}</div><div class="card"><h3>個別回覆</h3>${list.length?list.map(r=>`<div class="order-card"><div class="order-top"><b>${esc(r.name)}（電話末四碼 ${esc(r.phoneLast4)}）</b><span class="amount">${money(r.amount)}</span></div><div class="tiny muted">${esc(dateText(r.submittedAt))} ・ ${esc(r.responseId)}</div>${s.questions.map(q=>`<div class="answer-line"><b>${esc(q.label)}</b><br>${esc(formatAnswerForUi(q,r.answers[q.id])||'（未填寫）')}</div>`).join('')}<button class="btn btn-secondary btn-block" style="margin-top:10px" onclick="adminEditResponse('${esc(r.responseId)}')">管理者修改這筆回覆</button></div>`).join(''):'<div class="notice">目前沒有回覆。</div>'}</div>`;
}
function adminEditResponse(responseId){const r=state.adminResponses.find(x=>x.responseId===responseId);if(!r)return;const s=state.adminSurvey;showModal(`<h3>管理者修改回覆</h3><p class="small muted">${esc(r.name)} ・ ${esc(responseId)}</p><div id="adminQuestionForm">${s.questions.map(q=>renderQuestion(q,r.answers)).join('')}</div><div class="btn-row"><button class="btn btn-primary" onclick="saveAdminResponse('${esc(responseId)}')">儲存</button><button class="btn btn-plain" onclick="closeModal()">取消</button></div>`)}
async function saveAdminResponse(id){const answers={};document.querySelectorAll('#adminQuestionForm .question-box').forEach(box=>{const q=state.adminSurvey.questions.find(x=>x.id===box.dataset.qid),type=q.type;let a;if(['text','textarea','date','number'].includes(type))a=box.querySelector('[data-answer]').value;else if(type==='rating'){const x=box.querySelector('input:checked');a=x?Number(x.value):''}else if(type==='single'){const x=box.querySelector('input:checked');a=x?x.value:''}else if(type==='multi')a=Array.from(box.querySelectorAll('input:checked')).map(x=>x.value);else if(type==='dropdown')a=box.querySelector('[data-answer]').value;else if(type==='items')a=Array.from(box.querySelectorAll('.item-option')).filter(x=>x.querySelector('.item-check').checked).map(x=>({optionId:x.querySelector('.item-check').value,qty:Number(x.querySelector('.item-qty').value)||1,note:x.querySelector('.item-note').value}));answers[q.id]=a});setBusy(true);try{const r=await api('adminUpdateResponse',state.token,state.adminSurvey.id,id,answers);toast(r.message);closeModal();await viewResponses(state.adminSurvey.id)}catch(err){toast(err.message)}finally{setBusy(false)}}
async function exportSurveyExcel(id){setBusy(true);try{const r=await api('exportSurveyXlsx',state.token,id);const raw=atob(r.base64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=r.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Excel 匯出完成')}catch(err){toast('匯出失敗：'+err.message)}finally{setBusy(false)}}
function renderBackup(){const s=state.adminOverview.settings||{};const recoveryWarning=state.adminOverview.configCorrupted?`<div class="notice error">目前 JSON 設定檔無法讀取：${esc(state.adminOverview.configError||'格式錯誤')}。請從下方選擇有效的歷史備份進行還原；此時不要建立新問卷或修改備份設定。</div>`:'';$('adminContent').innerHTML=`<div class="card"><h3>☁️ 雲端備份與還原</h3>${recoveryWarning}<div class="notice success">設定自動備份：每次成功修改問卷設定前，自動保存上一版。每天凌晨約 3 點另建立完整備份。</div><div class="field"><label class="checkline"><input id="autoBackup" type="checkbox" ${s.autoBackup!==false?'checked':''}> 啟用自動雲端備份</label></div><div class="editor-grid"><div class="field"><label>設定版本保留數</label><input id="configKeep" type="number" class="input" min="10" max="100" value="${Number(s.configBackupKeep||50)}"></div><div class="field"><label>完整備份保留數</label><input id="fullKeep" type="number" class="input" min="3" max="30" value="${Number(s.fullBackupKeep||10)}"></div></div><button class="btn btn-secondary btn-block" onclick="saveBackupPrefs()">儲存備份設定</button><div class="divider"></div><div class="notice">最近完整備份：${esc(s.lastBackupAt||'尚未備份')}<br>手動備份會包含全部問卷設定及填寫結果。</div><button class="btn btn-primary btn-block" style="margin-top:10px" onclick="runManualBackup()">☁ 立即雲端備份</button><button class="btn btn-plain btn-block" style="margin-top:8px" onclick="refreshBackupList()">重新整理備份清單</button><div id="backupList" class="small muted" style="margin-top:12px">尚未載入備份清單。</div></div><div class="card"><h3>雲端檔案</h3><div class="btn-row"><a class="btn btn-plain" style="text-decoration:none;text-align:center" target="_blank" href="${esc(s.resultSpreadsheetUrl||'#')}">開啟問卷結果試算表</a><a class="btn btn-plain" style="text-decoration:none;text-align:center" target="_blank" href="${esc(s.jsonFileUrl||'#')}">開啟 JSON 設定</a></div></div>`;refreshBackupList()}
async function saveBackupPrefs(){setBusy(true);try{const r=await api('saveBackupSettings',state.token,{autoBackup:$('autoBackup').checked,configBackupKeep:Number($('configKeep').value),fullBackupKeep:Number($('fullKeep').value)});toast(r.message);await loadAdmin();state.adminTab='backup';renderAdmin()}catch(err){toast(err.message)}finally{setBusy(false)}}
async function runManualBackup(){setBusy(true);try{const r=await api('backupNow',state.token);toast(r.message);await refreshBackupList();await loadAdmin();state.adminTab='backup';renderAdmin()}catch(err){toast(err.message)}finally{setBusy(false)}}
async function refreshBackupList(){const el=$('backupList');if(!el)return;el.innerHTML='正在讀取雲端備份…';try{const list=await api('listBackups',state.token);el.innerHTML=list.length?list.map(b=>`<div class="history-item"><div class="order-top"><b>${esc(b.type)}</b><span class="badge">${esc(dateText(b.createdAt))}</span></div><div class="tiny muted">${esc(b.description)} ・ ${Math.round(b.size/1024)} KB</div><button class="btn btn-plain btn-block" style="margin-top:8px" onclick="previewRestore('${esc(b.id)}')">預覽／還原此版本</button></div>`).join(''):'<div class="notice">目前還沒有備份版本。</div>'}catch(err){el.innerHTML=`<div class="notice error">${esc(err.message)}</div>`}}
async function previewRestore(id){setBusy(true);try{const p=await api('previewBackup',state.token,id);showModal(`<h3>備份版本預覽</h3><div class="notice">建立時間：${esc(dateText(p.createdAt))}<br>備份類型：${esc(p.type)}<br>問卷數：${p.surveyCount}<br>回覆數：${p.responseCount==null?'僅設定資料':p.responseCount}<br>問卷：${esc((p.titles||[]).join('、'))}</div><p class="small muted">還原前會自動保護目前資料。設定還原不會覆蓋現有回覆；完整還原會將該備份時間的回覆資料寫回對應工作表。</p><div class="btn-row"><button class="btn btn-primary" onclick="restoreSelected('${esc(id)}','settings')">只還原設定</button>${p.canRestoreFull?`<button class="btn btn-danger" onclick="restoreSelected('${esc(id)}','full')">完整還原</button>`:''}</div><button class="btn btn-plain btn-block" style="margin-top:8px" onclick="closeModal()">取消</button>`)}catch(err){toast(err.message)}finally{setBusy(false)}}
async function restoreSelected(id,mode){const message=mode==='full'?'完整還原會以備份當時的資料取代對應問卷工作表目前的回覆。':'只還原問卷設定，保留目前所有填寫結果。';if(!confirm(message+'\n確定繼續？'))return;setBusy(true);try{const r=await api('restoreBackup',state.token,id,mode);closeModal();toast(r.message);await loadAdmin();state.adminTab='backup';renderAdmin()}catch(err){toast(err.message)}finally{setBusy(false)}}
function renderSecurity(){$('adminContent').innerHTML=`<div class="card"><h3>🔐 管理者密碼</h3><p class="small muted">密碼只儲存在 GAS Script Properties，前端及 JSON 設定檔不會保存密碼。</p><div class="field"><label>新密碼（8 至 64 個字元）</label><input id="newPassword" class="input" type="password" maxlength="64" autocomplete="new-password"></div><div class="field"><label>再次輸入新密碼</label><input id="newPassword2" class="input" type="password" maxlength="64" autocomplete="new-password"></div><button class="btn btn-primary btn-block" onclick="saveNewPassword()">修改管理者密碼</button></div>`}
async function saveNewPassword(){const a=$('newPassword').value,b=$('newPassword2').value;if(a.length<8){toast('新密碼至少 8 個字元');return}if(a!==b){toast('兩次輸入的密碼不一致');return}setBusy(true);try{const r=await api('changeAdminPassword',state.token,a);toast(r.message);$('newPassword').value='';$('newPassword2').value=''}catch(err){toast(err.message)}finally{setBusy(false)}}

initPwaInstall();
setupBridge();
</script>
</body>
</html>
